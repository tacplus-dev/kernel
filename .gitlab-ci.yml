stages:
  - build
  - package
  - manifest

compute-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  script:
    - |
      TACPLUS_VER=$(grep '^tacplus-version:' tacplus.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$TACPLUS_VER" ]; then
        echo "ERROR: tacplus-version not set in tacplus.yaml" >&2; exit 1
      fi
      MAJOR="$(echo "$TACPLUS_VER" | cut -d. -f1)"
      MINOR="$(echo "$TACPLUS_VER" | cut -d. -f2)"
      REPO="secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}"
      IMAGE="${CI_REGISTRY}/${REPO}:latest"
      echo "TACPLUS_IMAGE=${IMAGE}" > tacplus.env
      echo "Using tacplus image: ${IMAGE}"
  artifacts:
    reports:
      dotenv: tacplus.env

variables:
  DOCKER_TLS_CERTDIR: ""
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  TACPLUS_PROJECT_PATH: "secondstarcavalier/schematic/tacplus"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    DOTPART="${V%%-*}"
    MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
    MINOR="$(echo "$DOTPART" | cut -d. -f2)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

# Resolve the proto tag matching the service tag's branch channel and run
# `tacplus build`. Service tag v{M}.{N}.{P}-{BRANCH}.{LOCAL} → newest proto
# tag matching v{M}.{N}.{P}-{BRANCH}.*. Falls back to letting `tacplus
# build` auto-resolve (latest main patch) if no branch-matching proto tag
# exists. Needed because tacplus build does not understand non-main
# channels (e.g. demo) and silently picks latest main otherwise.
#
# tacplus's `--tag` flag only labels the generated package; the actual
# proto source comes from its own cache which auto-resolves to the latest
# main patch. To force a specific tag we pre-populate the cache dir from
# the proto repo at that tag, then invoke `tacplus build --tag <tag>`.
.tacplus-build: &tacplus-build
  - |
    V="${CI_COMMIT_TAG#v}"
    DOTPART="${V%%-*}"
    PROTO_MAJOR="$(echo "$DOTPART" | cut -d. -f1)"
    PROTO_MINOR="$(echo "$DOTPART" | cut -d. -f2)"
    PROTO_PATCH="$(echo "$DOTPART" | cut -d. -f3)"
    RESTPART="${V#*-}"
    PROTO_BRANCH="${RESTPART%.*}"
    PROTO_TAG=$(git ls-remote --tags --refs \
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/secondstarcavalier/schematic/platform/proto.git" \
      "refs/tags/v${PROTO_MAJOR}.${PROTO_MINOR}.${PROTO_PATCH}-${PROTO_BRANCH}.*" \
      | sed -n "s|.*refs/tags/v${PROTO_MAJOR}\\.${PROTO_MINOR}\\.${PROTO_PATCH}-${PROTO_BRANCH}\\.\\([0-9][0-9]*\\)$|\\1 v${PROTO_MAJOR}.${PROTO_MINOR}.${PROTO_PATCH}-${PROTO_BRANCH}.\\1|p" \
      | sort -n \
      | tail -1 \
      | awk '{print $2}')
    if [ -n "$PROTO_TAG" ]; then
      echo "Resolved proto tag: $PROTO_TAG"
      PROTO_CACHE_DIR="/root/.tacplus/cache/proto/gitlab.com-secondstarcavalier-controlplane-cavalier-proto"
      rm -rf "$PROTO_CACHE_DIR"
      mkdir -p "$(dirname "$PROTO_CACHE_DIR")"
      git clone --depth 1 --branch "$PROTO_TAG" \
        "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/secondstarcavalier/schematic/platform/proto.git" \
        "$PROTO_CACHE_DIR"
      tacplus build --tag "$PROTO_TAG"
    else
      echo "No proto tag matching v${PROTO_MAJOR}.${PROTO_MINOR}.${PROTO_PATCH}-${PROTO_BRANCH}.*; letting tacplus auto-resolve"
      tacplus build
    fi

build:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  cache:
    - key: maven
      paths:
        - .m2/repository
  before_script:
    - *setup-netrc
    - *tacplus-build
  script:
    - mvn -pl server -am -Dtacplus.skip=true package
    - |
      javap -classpath server/target/kernel.jar \
        com.gitlab.secondstarcavalier.controlplane.cavalier.services.kernel.model.types.services.kernel.MintGrpc \
        | grep -q 'getMintX509CertMethod'
  artifacts:
    paths:
      - server/target/kernel.jar
    expire_in: 1 hour

.package-arch:
  stage: package
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    # Pre-pull the schematic base image while DOCKER_AUTH_CONFIG (group read) is active,
    # then switch to the CI job token for push.
    - docker pull "$(awk '/^FROM/{print $2; exit}' Dockerfile)" || true
    - docker pull "${TACPLUS_IMAGE}"
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      cid=$(docker create --platform "linux/${ARCH}" "${TACPLUS_IMAGE}")
      docker cp "${cid}:/usr/local/bin/launcher" "launcher-linux-${ARCH}"
      docker rm "${cid}"
      chmod +x "launcher-linux-${ARCH}"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/kernel-${MAJOR}-${MINOR}"
      docker build --platform "linux/${ARCH}" \
        -t "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}" \
        .
      docker push "${IMAGE}:${CI_COMMIT_TAG}-${ARCH}"

package-arm64:
  extends: .package-arch
  tags:
    - schematic-aarch64
  needs:
    - build
    - compute-image
  variables:
    ARCH: arm64

manifest:
  stage: manifest
  retry: 2
  image: docker:latest
  services:
    - docker:dind
  tags:
    - schematic-aarch64
  needs: [package-arm64]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-[a-zA-Z0-9_][a-zA-Z0-9_.-]*\.\d+$/
  before_script:
    - *parse-version
    - unset DOCKER_AUTH_CONFIG
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/kernel-${MAJOR}-${MINOR}"
      docker pull --platform linux/arm64 "${IMAGE}:${CI_COMMIT_TAG}-arm64"
      docker tag "${IMAGE}:${CI_COMMIT_TAG}-arm64" "${IMAGE}:${CI_COMMIT_TAG}"
      docker push "${IMAGE}:${CI_COMMIT_TAG}"

# ---------------------------------------------------------------------------
# Proto validation: fires when proto CI fans out on new proto tag.
# ---------------------------------------------------------------------------
compute-validate-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $PROTO_VALIDATE == "true"
  script:
    - |
      TACPLUS_VER=$(grep '^tacplus-version:' tacplus.yaml | awk '{print $2}' | tr -d '"')
      if [ -z "$TACPLUS_VER" ]; then
        echo "ERROR: tacplus-version not set in tacplus.yaml" >&2; exit 1
      fi
      MAJOR="$(echo "$TACPLUS_VER" | cut -d. -f1)"
      MINOR="$(echo "$TACPLUS_VER" | cut -d. -f2)"
      REPO="secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}"
      echo "TACPLUS_IMAGE=${CI_REGISTRY}/${REPO}:latest" > tacplus.env
      echo "Using tacplus image: ${CI_REGISTRY}/${REPO}:latest" 
  artifacts:
    reports:
      dotenv: tacplus.env

proto-validate:
  stage: build
  retry: 2
  image: $TACPLUS_IMAGE
  needs: [compute-validate-image]
  rules:
    - if: $PROTO_VALIDATE == "true"
  before_script:
    - *setup-netrc
  script:
    - tacplus build --tag $PROTO_VERSION
