stages:
  - build
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  TACPLUS_PROJECT_ID: "78207479"
  PROTO_REPO: https://gitlab.com/secondstarcavalier/controlplane/services/proto.git

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

build:
  stage: build
  image: maven:3-eclipse-temurin-21
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip > /dev/null
    - |
      ARCH=$(dpkg --print-architecture)
      if [ "$ARCH" = "arm64" ]; then PROTOC_ARCH="linux-aarch_64"; else PROTOC_ARCH="linux-x86_64"; fi
      curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-${PROTOC_ARCH}.zip"
      unzip -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
      chmod +x /usr/local/bin/protoc
    - |
      GRPC_ARCH="linux-x86_64"
      if [ "$ARCH" = "arm64" ]; then GRPC_ARCH="linux-aarch_64"; fi
      curl -fsSL -o /usr/local/bin/protoc-gen-grpc-java \
        "https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/1.79.0/protoc-gen-grpc-java-1.79.0-${GRPC_ARCH}.exe"
      chmod +x /usr/local/bin/protoc-gen-grpc-java
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - |
      if [ "$ARCH" = "arm64" ]; then TACPLUS_ARCH="linux-arm64"; else TACPLUS_ARCH="linux-amd64"; fi
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           -fsSL -o /usr/local/bin/tacplus \
           "${CI_API_V4_URL}/projects/${TACPLUS_PROJECT_ID}/packages/generic/tacplus-1-2/latest/tacplus-1-2-latest-${TACPLUS_ARCH}"
      chmod +x /usr/local/bin/tacplus
    - git clone --depth 1 "$PROTO_REPO" /tmp/proto
    - (cd server && tacplus build --src /tmp/proto --tag "${CI_COMMIT_TAG#v}")
  script:
    - mvn package -DskipTests -B -s ci_settings.xml
  artifacts:
    paths:
      - server/target/kernel.jar
    expire_in: 1 hour

package:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name multiarch --driver docker-container
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/kernel-${MAJOR}-${MINOR}"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t "${IMAGE}:${PATCH}" \
        -t "${IMAGE}:latest" \
        --push .
