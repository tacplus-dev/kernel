stages:
  - build
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  TACPLUS_PROJECT_ID: "78207479"
  PROTO_REPO: https://gitlab.com/secondstarcavalier/controlplane/services/proto.git

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

build:
  stage: build
  image: maven:3-eclipse-temurin-21
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository
  before_script:
    - apt-get update -qq && apt-get install -y -qq git protobuf-compiler > /dev/null
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           -fsSL -o /usr/local/bin/tacplus \
           "${CI_API_V4_URL}/projects/${TACPLUS_PROJECT_ID}/packages/generic/tacplus/v1.0.0/tacplus-linux-amd64"
      chmod +x /usr/local/bin/tacplus
    - |
      git clone --depth 1 "$PROTO_REPO" /tmp/proto
      sed -i "s|^src:.*|src: /tmp/proto|" server/tacplus.yaml
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      mvn versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      mvn package -DskipTests -B -s ci_settings.xml
  artifacts:
    paths:
      - server/target/kernel.jar
    expire_in: 1 hour

package:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/kernel-${MAJOR}-${MINOR}"
      docker build -t "${IMAGE}:${PATCH}" .
      docker tag "${IMAGE}:${PATCH}" "${IMAGE}:latest"
      docker push "${IMAGE}:${PATCH}"
      docker push "${IMAGE}:latest"
