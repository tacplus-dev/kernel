stages:
  - build
  - package

compute-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - V="${CI_COMMIT_TAG#v}"
    - MAJOR="$(echo "$V" | cut -d. -f1)"
    - MINOR="$(echo "$V" | cut -d. -f2)"
    - echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/utils/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

build:
  stage: build
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    key: maven
    paths:
      - .m2/repository
  before_script:
    - *setup-netrc
    - tacplus build --no-container --skip-post
  script:
    - mvn -pl server -am -Dtacplus.skip=true -Dmaven.test.skip=true package
  artifacts:
    paths:
      - server/target/kernel.jar
    expire_in: 1 hour

package:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name multiarch --driver docker-container
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/kernel-${MAJOR}-${MINOR}"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t "${IMAGE}:${PATCH}" \
        -t "${IMAGE}:latest" \
        --push .
