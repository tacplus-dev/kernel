stages:
  - build
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  TACPLUS_IMAGE: "${CI_REGISTRY}/secondstarcavalier/controlplane/utils/tacplus/tacplus-1-1:42"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

build:
  stage: build
  image: $TACPLUS_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache:
    key: maven
    paths:
      - .m2/repository
  before_script:
    - *parse-version
    - (cd kernel/tacplus && tacplus build --no-container --tag "${CI_COMMIT_TAG#v}")
  script:
    - cd kernel && mvn package -DskipTests -B -s ci_settings.xml
  artifacts:
    paths:
      - kernel/server/target/kernel.jar
    expire_in: 1 hour

package:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name multiarch --driver docker-container
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/kernel-${MAJOR}-${MINOR}"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t "${IMAGE}:${PATCH}" \
        -t "${IMAGE}:latest" \
        --push kernel
