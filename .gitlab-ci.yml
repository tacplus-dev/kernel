stages:
  - build
  - package
  - manifest

compute-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev)?$/
  script:
    - V="${CI_COMMIT_TAG#v}"
    - if [[ "$V" == *-dev ]]; then DEV_SUFFIX="-dev"; V="${V%-dev}"; else DEV_SUFFIX=""; fi
    - MAJOR="$(echo "$V" | cut -d. -f1)"
    - MINOR="$(echo "$V" | cut -d. -f2)"
    - echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > tacplus.env
    - echo "DEV_SUFFIX=${DEV_SUFFIX}" >> tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

.parse-version: &parse-version
  - |
    V="${CI_COMMIT_TAG#v}"
    if [[ "$V" == *-dev ]]; then DEV_SUFFIX="-dev"; V="${V%-dev}"; else DEV_SUFFIX=""; fi
    MAJOR="$(echo "$V" | cut -d. -f1)"
    MINOR="$(echo "$V" | cut -d. -f2)"
    PATCH="$(echo "$V" | cut -d. -f3)"

.setup-netrc: &setup-netrc
  - printf "machine gitlab.com\nlogin gitlab-ci-token\npassword %s\n" "$CI_JOB_TOKEN" > ~/.netrc

build:
  stage: build
  image: $TACPLUS_IMAGE
  needs: [compute-image]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev)?$/
  cache:
    - key: tacplus
      paths:
        - tacplus/
    - key: maven
      paths:
        - .m2/repository
  before_script:
    - *setup-netrc
    - tacplus build --skip-post
  script:
    - mvn -pl server -am -Dtacplus.skip=true -Dmaven.test.skip=true package
  artifacts:
    paths:
      - server/target/kernel.jar
    expire_in: 1 hour

.package-arch:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev)?$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/kernel-${MAJOR}-${MINOR}"
      docker pull "${IMAGE}:latest${DEV_SUFFIX}-${ARCH}" || true
      docker build \
        --cache-from "${IMAGE}:latest${DEV_SUFFIX}-${ARCH}" \
        -t "${IMAGE}:${PATCH}${DEV_SUFFIX}-${ARCH}" \
        -t "${IMAGE}:latest${DEV_SUFFIX}-${ARCH}" \
        .
      docker push "${IMAGE}:${PATCH}${DEV_SUFFIX}-${ARCH}"
      docker push "${IMAGE}:latest${DEV_SUFFIX}-${ARCH}"

package-amd64:
  extends: .package-arch
  variables:
    ARCH: amd64

package-arm64:
  extends: .package-arch
  tags:
    - saas-linux-large-arm64
  variables:
    ARCH: arm64

manifest:
  stage: manifest
  image: docker:latest
  services:
    - docker:dind
  needs: [package-amd64, package-arm64]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-dev)?$/
  before_script:
    - *parse-version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/kernel-${MAJOR}-${MINOR}"
      docker manifest create "${IMAGE}:${PATCH}${DEV_SUFFIX}" "${IMAGE}:${PATCH}${DEV_SUFFIX}-amd64" "${IMAGE}:${PATCH}${DEV_SUFFIX}-arm64"
      docker manifest push "${IMAGE}:${PATCH}${DEV_SUFFIX}"
      docker manifest create "${IMAGE}:latest${DEV_SUFFIX}" "${IMAGE}:${PATCH}${DEV_SUFFIX}-amd64" "${IMAGE}:${PATCH}${DEV_SUFFIX}-arm64"
      docker manifest push "${IMAGE}:latest${DEV_SUFFIX}"

# ---------------------------------------------------------------------------
# Proto validation: fires when proto CI fans out on new proto tag.
# ---------------------------------------------------------------------------
compute-validate-image:
  stage: .pre
  image: alpine:latest
  rules:
    - if: $PROTO_VALIDATE == "true"
  script:
    - V="${PROTO_VERSION#v}"
    - MAJOR="$(echo "$V" | cut -d. -f1)"
    - MINOR="$(echo "$V" | cut -d. -f2)"
    - echo "TACPLUS_IMAGE=${CI_REGISTRY}/secondstarcavalier/schematic/tacplus/tacplus-${MAJOR}-${MINOR}:latest" > tacplus.env
  artifacts:
    reports:
      dotenv: tacplus.env

proto-validate:
  stage: build
  image: $TACPLUS_IMAGE
  needs: [compute-validate-image]
  rules:
    - if: $PROTO_VALIDATE == "true"
  before_script:
    - *setup-netrc
  script:
    - tacplus build --skip-post --tag $PROTO_VERSION
