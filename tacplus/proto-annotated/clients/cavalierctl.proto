// Package cavalierctl defines configuration types for the cavalierctl CLI tool
// and the agentic workstation sensor (blueclaude daemon).

syntax = "proto3";

package cavalierctl;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.clients.cavalierctl";
option java_outer_classname = "Cavalierctl";

import "libs/spec.proto";
import "libs/grpcconfig.proto";
import "libs/outputformat.proto";

// Directory and path constants — all relative to $HOME.
option (spec.string_const) = { name: "HOME_DIR"        value: ".cavalierctl" };
option (spec.string_const) = { name: "BOOTSTRAP_DIR"   value: "bootstrap" };
option (spec.string_const) = { name: "CONFIG_DIR"      value: "config" };
option (spec.string_const) = { name: "TOKEN_CACHE_DIR" value: "cache/tokens" };
option (spec.string_const) = { name: "DAEMON_SOCK"     value: "daemon.sock" };
option (spec.string_const) = { name: "EVENT_SOCK"      value: "sensor.sock" };
option (spec.string_const) = { name: "SPOOL_FILE"      value: "spool" };

// ============================================================================
// CLI Config
// ============================================================================

// Config is the per-profile configuration for cavalierctl.
// Loaded from all YAML files in ~/.cavalierctl/config/ and merged.
// Splitting connection and key into separate files (config.yaml + key.yaml)
// allows chmod 400 on the key file.
message Config {
  // connection is the gRPC connection configuration.
  // Used by the identity manager for token exchange with gateway.
  // Contains endpoints, private_key, and trusted_cas.
  grpcconfig.Config connection = 1 [(spec.assert_required) = true];

  // format is the default output format.
  outputformat.OutputFormat format = 2 [(spec.assert_enum_defined) = true];

  // agentic is the agentic workstation sensor configuration.
  AgenticConfig agentic = 3 [(spec.assert_required) = true];

  // direct_mode bypasses the daemon and connects directly to gateway.
  // Useful for debugging or environments where the daemon is not desired.
  // Can also be set via --direct flag on CLI commands.
  bool direct_mode = 4;

  // proxy_log_path is the file path for proxy log output.
  // If empty, the proxy logs to the system log (os_log on macOS,
  // journald on Linux, Event Log on Windows).
  string proxy_log_path = 5 [(spec.assert_max_length) = 4096];
}

// ProfileConfig is the top-level config file format.
// All YAML files in ~/.cavalierctl/config/ are parsed as ProfileConfig
// and merged at the profile level.
message ProfileConfig {
  // current_profile is the active profile name.
  string current_profile = 1 [(spec.assert_max_length) = 128];

  // profiles is a map of named connection profiles.
  map<string, Config> profiles = 2 [(spec.assert_max_size) = 64];
}

// ============================================================================
// Agentic Sensor
// ============================================================================

// AgenticConfig is the configuration for the agentic workstation sensor.
// The daemon receives events from coding-agent hooks (PostToolUse,
// SubagentStart, etc.) via a Unix socket, batches them, and publishes
// to EventBus. From there, Aegis ingests the events for topology
// visualization and forensics.
message AgenticConfig {
  // flush_interval_ms is the max time between event flushes to EventBus. Default: 5000.
  int32 flush_interval_ms = 1 [(spec.default_int) = 5000, (spec.assert_ge) = 100, (spec.assert_le) = 60000];

  // batch_size is the max events per flush. Default: 100.
  int32 batch_size = 2 [(spec.default_int) = 100, (spec.assert_ge) = 1, (spec.assert_le) = 10000];

  // max_event_payload_bytes caps how much of each tool input/output is
  // stored per event. Larger payloads are truncated. Default: 32768 (32KB).
  int32 max_event_payload_bytes = 3 [(spec.default_int) = 32768, (spec.assert_ge) = 1024, (spec.assert_le) = 1048576];

  // file_pattern_excludelist is a set of glob patterns for files to
  // exclude from tracking. Example: ["*.lock", "node_modules/**", ".git/**"].
  repeated string file_pattern_excludelist = 4 [(spec.assert_max_size) = 256, (spec.assert_max_length) = 512];

  // spool_max_bytes is the maximum spool file size in bytes. When the spool
  // reaches this limit, new events are dropped until the backlog drains.
  // Default: 524288000 (500MB).
  int64 spool_max_bytes = 5 [(spec.default_int) = 524288000, (spec.assert_ge) = 1024, (spec.assert_le) = 2147483648];
}

// ============================================================================
// Generated Proto Registry IDs
// Auto-injected by tacplus for shared type/RPC identifiers.
// ============================================================================
enum TypeID {
  TYPE_ID_UNSPECIFIED = 0;
  TYPE_ID_CONFIG = 1;
  TYPE_ID_PROFILE_CONFIG = 2;
  TYPE_ID_AGENTIC_CONFIG = 3;
}
