// BigData — Source of Truth data platform.
//
// BigData is the Source of Truth (SoT) service: HZ + Cassandra + Iceberg,
// plus a gateway/query layer that fans out to external projection services.
//
// ClickHouse and Dgraph are independent services (see clickhouse.proto,
// dgraph.proto). BigData discovers them via kernel ServiceHealth.
//
// Write path:  EventBus ──→ BigData SoT (HZ + Cassandra + Iceberg)
//              EventBus ──→ ClickHouse  (independent, timeseries projection)
//              EventBus ──→ Dgraph      (independent, graph projection)
//
// Read path:   Caller ──gRPC──→ BigData gateway ──┬── in-process → HZ/Cassandra/Iceberg
//                                                 ├── HTTPS ─────→ ClickHouse (discovered)
//                                                 └── gRPC ──────→ Dgraph (discovered)
//
// Source of truth: HZ → Cassandra → Iceberg, keyed by unique_id.
// Projections: ClickHouse (time + indexed fields) and Dgraph (relationships +
// indexed fields) are derived views, queried by the gateway via endpoints.
//
// Data temperature:
//   Hot    → Hazelcast    (0–3h, configurable, in-memory)
//   Warm   → Cassandra    (0–30d, durable, backs HZ on restart)
//   Cold   → Iceberg      (0–years, archive)

syntax = "proto3";

package bigdata;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.services.bigdata";
option java_outer_classname = "Bigdata";

import "libs/spec.proto";
import "google/protobuf/empty.proto";

option (spec.service) = {name: "bigdata", id: 19, store: true};

// ============================================================================
// Config
// ============================================================================

message Config {
  option (spec.grpc_config) = {service_name: "bigdata", id: 19};

  // --- Source of truth (HZ + Cassandra + Iceberg) ---

  // hot_window_hours is the default hot cache retention window.
  // Data older than this is evicted from HZ (still in Cassandra). Default: 3.
  int32 hot_window_hours = 1 [(spec.default_int) = 3, (spec.assert_ge) = 1];

  // reheat_ttl_minutes is the TTL for re-heated cold data pulled back
  // into a separate HZ map. Shorter than the primary hot window so
  // historical data ages independently. Default: 30.
  int32 reheat_ttl_minutes = 2 [(spec.default_int) = 30, (spec.assert_ge) = 1];

  // warm_retention_days is how long data lives in Cassandra before
  // aging out to Iceberg. Default: 30.
  int32 warm_retention_days = 3 [(spec.default_int) = 30, (spec.assert_ge) = 1];

  // archive_compaction_hours is how often Iceberg compaction runs. Default: 24.
  int32 archive_compaction_hours = 4 [(spec.default_int) = 24, (spec.assert_ge) = 1];

  // --- Query coordinator ---

  // cache_ttl_seconds is the default TTL for cached query results
  // in the dedicated HZ query cache map. Default: 60.
  int32 cache_ttl_seconds = 5 [(spec.default_int) = 60, (spec.assert_ge) = 1];

  // time_mask_seconds is the default time parameter quantization
  // resolution for query result caching. Queries within the same masked
  // window share cache entries. Default: 60.
  int32 time_mask_seconds = 6 [(spec.default_int) = 60, (spec.assert_ge) = 1];

  // max_fan_out is the max concurrent store queries per request. Default: 4.
  int32 max_fan_out = 7 [(spec.default_int) = 4, (spec.assert_ge) = 1];
}

// ============================================================================
// State
// ============================================================================

message BigDataState {
  option (spec.service_state) = {name: "BigDataState", tag: "bigdata", auto_tls: TLS_KEY_TYPE_ED25519};

  // node_registration tracks BigData SoT cluster membership.
  BigDataNode nodes = 1 [(spec.consistency) = CONSISTENCY_CONVERGENT];
}

// BigDataNode represents a SoT instance in the BigData service.
message BigDataNode {
  // node_id is the unique identifier for this instance.
  string node_id = 1 [(spec.indexed) = true];

  // started_at_ms is when this node started.
  int64 started_at_ms = 2;

  // store_status reports per-store health for this node.
  StoreStatus hz_status = 3;
  StoreStatus cassandra_status = 4;
  StoreStatus iceberg_status = 5;
}

// StoreStatus reports the connection health of a single backing store.
message StoreStatus {
  bool connected = 1;
  int64 last_heartbeat_ms = 2;
  string error_message = 3;
}

// ============================================================================
// Service RPCs
// ============================================================================
//
// BigData is the query gateway for all aegis event data. It stores serialized
// proto records in HZ/Cassandra/Iceberg and fans out to ClickHouse/Dgraph for
// projections. Response payloads use `bytes` for serialized aegis proto messages
// and `int32` for aegis enum values — keeping bigdata.proto self-contained
// without importing aegis.proto (which has its own service_state).
//
// Callers deserialize bytes fields using the documented aegis proto type.
// ============================================================================

service BigDataService {
  option (spec.service_grpc) = {name: "bigdata", auth_entitled_users: true};

  // Write path: BigData consumes from EventBus — no gRPC write RPCs needed.

  // ── Query path ──

  // Query executes a declared SQL query by name and returns typed results.
  rpc Query(QueryRequest) returns (QueryResponse);

  // GetByKey retrieves a full record from the source of truth by unique_id.
  rpc GetByKey(GetByKeyRequest) returns (GetByKeyResponse);

  // ── Visualization ──

  // GetTopology returns a point-in-time topology snapshot.
  // Response record is a serialized aegis.TopologySnapshot.
  rpc GetTopology(GetTopologyRequest) returns (GetTopologyResponse);

  // WatchTopology streams live topology change events.
  // Each streamed record is a serialized aegis.TopologyEvent.
  rpc WatchTopology(WatchTopologyRequest) returns (stream WatchTopologyResponse);

  // GetEntity returns a single graph entity by ID.
  // Response record is a serialized aegis.GraphEntity.
  rpc GetEntity(GetEntityRequest) returns (GetEntityResponse);

  // ── Conversation Replay ──

  // GetConversation returns the full conversation trace for a session.
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);

  // GetConversationTurn returns a single turn from a conversation.
  // Response record is a serialized aegis.ConversationTurn.
  rpc GetConversationTurn(GetConversationTurnRequest) returns (GetConversationTurnResponse);

  // ── Forensics ──

  // GetTokenTimeline returns all token observations for a principal.
  // Response record is a serialized aegis.TokenTimeline.
  rpc GetTokenTimeline(GetTokenTimelineRequest) returns (GetTokenTimelineResponse);

  // GetDelegationTree returns the delegation hierarchy for a root principal.
  // Response record is a serialized aegis.DelegationTree.
  rpc GetDelegationTree(GetDelegationTreeRequest) returns (GetDelegationTreeResponse);

  // GetSessionHistory returns token + conversation history for an agent/server pair.
  rpc GetSessionHistory(GetSessionHistoryRequest) returns (SessionHistoryResponse);

  // GetToolUsage returns tool call statistics and recent calls for a server.
  rpc GetToolUsage(GetToolUsageRequest) returns (GetToolUsageResponse);

  // ── Trace (causal chain) ──

  // GetTrace returns the full causal span tree for a trace.
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);

  // ── Actions ──

  // GetResourceHistory returns all actions that affected a resource.
  rpc GetResourceHistory(GetResourceHistoryRequest) returns (GetResourceHistoryResponse);

  // ── Detection Rules ──

  // ListDetectionRules returns configured detection rules.
  rpc ListDetectionRules(ListDetectionRulesRequest) returns (ListDetectionRulesResponse);

  // CreateDetectionRule creates a new detection rule.
  // Request and response records are serialized aegis.DetectionRule.
  rpc CreateDetectionRule(CreateDetectionRuleRequest) returns (CreateDetectionRuleResponse);

  // UpdateDetectionRule modifies an existing detection rule.
  // Request and response records are serialized aegis.DetectionRule.
  rpc UpdateDetectionRule(UpdateDetectionRuleRequest) returns (UpdateDetectionRuleResponse);

  // DeleteDetectionRule removes a detection rule by ID.
  rpc DeleteDetectionRule(DeleteDetectionRuleRequest) returns (DeleteDetectionRuleResponse);

  // ── Annotations ──

  // CreateAnnotation attaches an operator annotation to an entity or event.
  // Request and response records are serialized aegis.Annotation.
  rpc CreateAnnotation(CreateAnnotationRequest) returns (CreateAnnotationResponse);

  // ListAnnotations returns annotations matching filter criteria.
  rpc ListAnnotations(ListAnnotationsRequest) returns (ListAnnotationsResponse);

  // DeleteAnnotation removes an annotation by ID.
  rpc DeleteAnnotation(DeleteAnnotationRequest) returns (DeleteAnnotationResponse);

  // ── Admin ──

  // GetStoreHealth returns per-store health status.
  rpc GetStoreHealth(GetStoreHealthRequest) returns (GetStoreHealthResponse);
}

// ── Query Requests ──────────────────────────────────────────────────────────

message QueryRequest {
  // query_name is the declared query name (field name from the queries message).
  string query_name = 1 [(spec.assert_required) = true];

  // type_name is the BigData type this query operates on.
  string type_name = 2 [(spec.assert_required) = true];

  // params are the bound parameter values keyed by parameter name.
  map<string, string> params = 3 [(spec.assert_max_size) = 32];

  // skip_cache bypasses the query result cache.
  bool skip_cache = 4;
}

message QueryResponse {
  // records are the serialized proto messages matching the query.
  repeated bytes records = 1 [(spec.assert_max_size) = 4096];

  // total_count is the total number of matches (may exceed records if paginated).
  int64 total_count = 2;

  // cache_hit is true if the result was served from the query cache.
  bool cache_hit = 3;

  // stores_queried lists which backing stores were consulted.
  repeated string stores_queried = 4 [(spec.assert_max_size) = 8];
}

message GetByKeyRequest {
  string type_name = 1 [(spec.assert_required) = true];
  string key = 2 [(spec.assert_required) = true];
}

message GetByKeyResponse {
  bytes record = 1;
  // source indicates which store the record was resolved from.
  string source = 2;
}

// ── Admin Requests ──────────────────────────────────────────────────────────

message GetStoreHealthRequest {}

message GetStoreHealthResponse {
  StoreStatus hz = 1;
  StoreStatus cassandra = 2;
  StoreStatus iceberg = 3;
}

// ============================================================================
// Read RPCs — request/response messages (migrated from aegis)
//
// All response payloads that would reference aegis types use `bytes` for
// serialized proto records and `int32` for enum values. This is consistent
// with the generic Query/GetByKey pattern — BigData is a query gateway
// that stores and retrieves serialized protos across multiple stores.
// ============================================================================

// ── Visualization ───────────────────────────────────────────────────────────

message GetTopologyRequest {
  // entity_types filters by aegis.EntityType enum values.
  repeated int32 entity_types = 1 [(spec.assert_max_size) = 16];
  string focus_entity_id = 2;
  int32 hop_limit = 3;
  // view is an aegis.ViewPreset enum value.
  int32 view = 4;
  int64 from_ms = 5;
  int64 to_ms = 6;
  // density is an aegis.GraphDensity enum value.
  int32 density = 7;
}

message GetTopologyResponse {
  // Serialized aegis.TopologySnapshot.
  bytes record = 1;
}

message WatchTopologyRequest {
  // event_types filters by aegis.TopologyEventType enum values.
  repeated int32 event_types = 1 [(spec.assert_max_size) = 16];
  repeated string entity_ids = 2 [(spec.assert_max_size) = 256];
}

message WatchTopologyResponse {
  // Serialized aegis.TopologyEvent.
  bytes record = 1;
}

message GetEntityRequest {
  string entity_id = 1;
}

message GetEntityResponse {
  // Serialized aegis.GraphEntity.
  bytes record = 1;
}

// ── Conversation Replay ─────────────────────────────────────────────────────

message GetConversationRequest {
  string session_id = 1;
  int64 from_ms = 2;
  int64 to_ms = 3;
}

message GetConversationResponse {
  string session_id = 1;
  string agent_id = 2;
  string server_id = 3;
  string model_id = 4;
  string user_id = 5;
  // Each entry is a serialized aegis.ConversationTurn.
  repeated bytes turns = 6 [(spec.assert_max_size) = 1024];
  int32 total_turns = 7;
  int32 total_tool_calls = 8;
  int64 total_input_tokens = 9;
  int64 total_output_tokens = 10;
  int64 total_duration_ms = 11;
  int64 started_ms = 12;
  int64 ended_ms = 13;
  int64 total_cost_micros_usd = 14;
  bool cost_estimated = 15;
  // state is an aegis.ConversationState enum value.
  int32 state = 16;
  int32 total_actions = 17;
}

message GetConversationTurnRequest {
  string session_id = 1;
  int32 turn_number = 2;
}

message GetConversationTurnResponse {
  // Serialized aegis.ConversationTurn.
  bytes record = 1;
}

// ── Forensics ───────────────────────────────────────────────────────────────

message GetTokenTimelineRequest {
  string principal = 1;
  int64 from_ms = 2;
  int64 to_ms = 3;
  int32 limit = 4;
}

message GetTokenTimelineResponse {
  // Serialized aegis.TokenTimeline.
  bytes record = 1;
}

message GetDelegationTreeRequest {
  string root_principal = 1;
  int32 max_depth = 2;
}

message GetDelegationTreeResponse {
  // Serialized aegis.DelegationTree.
  bytes record = 1;
}

message GetSessionHistoryRequest {
  string agent_id = 1;
  string server_name = 2;
  int64 from_ms = 3;
  int64 to_ms = 4;
}

message SessionHistoryResponse {
  string agent_id = 1;
  string server_name = 2;
  // Each entry is a serialized aegis.ObservedToken.
  repeated bytes token_observations = 3 [(spec.assert_max_size) = 4096];
  // Each entry is a serialized aegis.ConversationTurn.
  repeated bytes conversation_turns = 4 [(spec.assert_max_size) = 1024];
  int64 total_observations = 5;
  int32 distinct_methods = 6;
  int64 rejection_count = 7;
  int32 total_tool_calls = 8;
  int64 first_seen_ms = 9;
  int64 last_seen_ms = 10;
  // Each entry is a serialized aegis.ActionEvent.
  repeated bytes actions = 11 [(spec.assert_max_size) = 4096];
}

message GetToolUsageRequest {
  string server_id = 1;
  string tool_name = 2;
  int64 from_ms = 3;
  int64 to_ms = 4;
}

message GetToolUsageResponse {
  // Each entry is a serialized aegis.ToolCallStats.
  repeated bytes tools = 1 [(spec.assert_max_size) = 256];
  // Each entry is a serialized aegis.ToolCallWithResult.
  repeated bytes recent_calls = 2 [(spec.assert_max_size) = 1024];
}

// ── Trace ───────────────────────────────────────────────────────────────────

message GetTraceRequest {
  string trace_id = 1;
}

message GetTraceResponse {
  string trace_id = 1;
  // Each entry is a serialized aegis.TraceSpan.
  repeated bytes spans = 2 [(spec.assert_max_size) = 4096];
  int64 started_ms = 3;
  int64 ended_ms = 4;
  int32 total_events = 5;
  int32 total_services = 6;
  int32 total_agents = 7;
  int32 total_actions = 8;
}

// ── Resource History ────────────────────────────────────────────────────────

message GetResourceHistoryRequest {
  string resource_uri = 1;
  int64 from_ms = 2;
  int64 to_ms = 3;
  int32 limit = 4;
}

message GetResourceHistoryResponse {
  string resource_uri = 1;
  string resource_type = 2;
  // Each entry is a serialized aegis.ActionEvent.
  repeated bytes actions = 3 [(spec.assert_max_size) = 4096];
  int64 total_actions = 4;
  repeated string acting_agent_ids = 5 [(spec.assert_max_size) = 256];
}

// ── Detection Rules ─────────────────────────────────────────────────────────

message ListDetectionRulesRequest {
  bool enabled_only = 1;
  // rule_type is an aegis.DetectionRuleType enum value.
  int32 rule_type = 2;
}

message ListDetectionRulesResponse {
  // Each entry is a serialized aegis.DetectionRule.
  repeated bytes rules = 1 [(spec.assert_max_size) = 256];
}

message CreateDetectionRuleRequest {
  // Serialized aegis.DetectionRule.
  bytes rule = 1;
}

message CreateDetectionRuleResponse {
  // Serialized aegis.DetectionRule (created).
  bytes rule = 1;
}

message UpdateDetectionRuleRequest {
  // Serialized aegis.DetectionRule.
  bytes rule = 1;
}

message UpdateDetectionRuleResponse {
  // Serialized aegis.DetectionRule (updated).
  bytes rule = 1;
}

message DeleteDetectionRuleRequest {
  string rule_id = 1;
}

message DeleteDetectionRuleResponse {}

// ── Annotations ─────────────────────────────────────────────────────────────

message CreateAnnotationRequest {
  // Serialized aegis.Annotation.
  bytes annotation = 1;
}

message CreateAnnotationResponse {
  // Serialized aegis.Annotation (created).
  bytes annotation = 1;
}

message ListAnnotationsRequest {
  string target_id = 1;
  // annotation_type is an aegis.AnnotationType enum value.
  int32 annotation_type = 2;
  string incident_id = 3;
  int64 from_ms = 4;
  int64 to_ms = 5;
}

message ListAnnotationsResponse {
  // Each entry is a serialized aegis.Annotation.
  repeated bytes annotations = 1 [(spec.assert_max_size) = 1024];
}

message DeleteAnnotationRequest {
  string annotation_id = 1;
}

message DeleteAnnotationResponse {}

// BigdataConfigState is the state boundary for bigdata service configuration.
// Auto-injected by tacplus from (spec.grpc_config) annotation.
message BigdataConfigState {
  option (spec.service_state) = {name: "BigdataConfigState", store: "kernel"};
  option (spec.state_consistency) = CONSISTENCY_CONVERGENT;

  bigdata.Config config = 1 [
    (spec.consistency) = CONSISTENCY_CONVERGENT,
    (spec.persistence) = true
  ];
}

// ============================================================================
// Auto-generated State Service (tacplus)
// ============================================================================

service BigDataStateService {
	// Singleton: Nodes
	rpc GetNodes(google.protobuf.Empty) returns (BigDataNode);
	rpc SetNodes(BigDataNode) returns (BigDataNode);
	rpc WatchNodes(google.protobuf.Empty) returns (stream BigDataNode);
}


// ============================================================================
// Auto-generated State Service (tacplus)
// ============================================================================

service BigdataConfigStateService {
	// Singleton: Config
	rpc GetConfig(google.protobuf.Empty) returns (Config);
	rpc SetConfig(Config) returns (Config);
	rpc WatchConfig(google.protobuf.Empty) returns (stream Config);
}

message MapEmpty {}


