// Kernel configuration, cluster state, and token exchange definitions.
// Admin and Hazelcast types are defined in common/hazelcast.proto.

syntax = "proto3";

package kernel;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.services.kernel";
option java_outer_classname = "Kernel";

import "libs/spec.proto";
import "libs/host.proto";
import "libs/logger.proto";
import "libs/outputformat.proto";
import "libs/jwk.proto";
import "libs/x509.proto";
import "libs/cloudvendor.proto";
import "common/tokenrequest.proto";
import "common/hazelcast.proto";
import "libs/healthreport.proto";

import "generated/services.proto";
import "generated/entitlements.proto";
import "generated/services_config.proto";
import "google/protobuf/empty.proto";

option (spec.service) = {name: "kernel", id: 8, store: true};

// Data must exist on at least 3 nodes (1 primary + 2 backups).
// Hazelcast backupCount = min(MIN_DATA_COPIES - 1, clusterSize - 1).
option (spec.int_const) = {name: "MIN_DATA_COPIES", value: 3};

// REST_ROOT_PATH is the base path for all REST endpoints exposed by the gateway.
// All service methods are exposed at {REST_ROOT_PATH}/{service_grpc}/{MethodName}.
// Also used by kernel as the token issuer path suffix.
option (spec.string_const) = {name: "REST_ROOT_PATH", value: "/api/v1"};

// ============================================================================
// Kernel Configuration
// ============================================================================

// BootstrapConfig is the top-level configuration for a Kernel node.
// Kernel provides distributed state management with gRPC access
// and clustered storage. This configuration is read once at boot and is
// immutable for the lifetime of the process.
//
// The config oneof determines how the gRPC configuration (Config)
// is sourced: from a URL, or from a local file.
// Unlike BootstrapConfig, Config can be reloaded at any time.
message BootstrapConfig {

  // cluster_name is the logical name for this cluster.
  // All nodes in the same cluster must use the same name.
  string cluster_name = 1 [(spec.assert_required) = true];

  // listener is the gRPC bind address for the Kernel server. Default port 5000.
  host.Host listener = 2 [(spec.assert_required) = true, (spec.default_host) = {host: "0.0.0.0", port: 5000}];

  // members is the list of cluster member addresses for discovery (e.g. host=10.0.0.1, port=9443).
  // At least one member must be specified for the node to join the cluster.
  repeated host.Host members = 3 [(spec.assert_required) = true, (spec.assert_max_size) = 32];

  // node_count is the expected number of nodes in the cluster.
  // Used for partition planning and quorum calculations.
  // Must be at least 1.
  int32 node_count = 4 [(spec.assert_gt) = 0];

  // partition_count is the number of partitions to distribute data across.
  // More partitions enable finer-grained distribution but increase metadata overhead.
  // Default: 271 (prime number for better distribution).
  // Must be greater than 0.
  int32 partition_count = 5 [(spec.assert_gt) = 0, (spec.default_int) = 271];

  // network configures cluster networking (timeouts, heartbeats, etc.).
  hazelcast.NetworkConfig network = 6 [(spec.assert_required) = true];

  // logger configures logging for the Kernel server.
  logger.LoggerConfig logger = 7 [(spec.assert_required) = true];

  // persistence_dir is the directory where DB dumps and redo logs are stored.
  // Default: "data/kernel".
  string persistence_dir = 9 [(spec.default_string) = "data/kernel"];

  // persistence_format configures the serialization format for redo logs and dumps.
  // Default: OUTPUT_FORMAT_PROTO_WIRE (binary protobuf).
  outputformat.OutputFormat persistence_format = 10;

  // config determines how gRPC configuration (Config) is sourced.
  oneof config {
    // url_loader fetches the config from a URL (HTTPS with optional auth token).
    UrlLoader url_loader = 11;

    // file_loader loads the config from a local file on disk.
    FileLoader file_loader = 12;
  }

  // loader_ca is the CA certificate trusted for TLS verification when
  // fetching Config via url_loader.
  repeated x509.X509Cert loader_ca = 13 [(spec.assert_max_size) = 16];

  // tls is the node's X.509 certificate and private key, used for
  // gRPC server TLS and Hazelcast mTLS.
  x509.X509CertChain tls = 14 [(spec.assert_required) = true];

  // hazelcast_listener is the bind address for Hazelcast cluster communication. Default port 5001.
  host.Host hazelcast_listener = 17 [(spec.default_host) = {host: "0.0.0.0", port: 5001}];
}

// ============================================================================
// Token Exchanger
// ============================================================================

// Identity holds the public verifying keys for kernel's token exchange service.
// Kernel is the sole token authority — all tokens (S2S, U2S, refresh) and
// X.509 certificates are signed by kernel's keys.
//
// Token exchange handles:
//   1. Direct exchange: delegate presents cred_pair JWT or cloud proof → token/cert
//   2. Delegation: broker (OAuth, K8S) authenticates via header, mints on behalf
//
// Access: RW for kernel, RO for any service that needs to verify tokens.
message Identity {
  option (spec.service_state) = {name: "Identity", tag: "kernel"};
  option (spec.disable_auth_message) = true;

  // Verification keys — kernel's public keys, rotated periodically.
  // Kernel holds the corresponding private keys internally.
  // Used by SecurityInterceptor to validate tokens for cluster calls.
  repeated jwk.Jwk verifying_keys = 1 [
    (spec.persistence) = true,
    (spec.view_member) = "JwkVerifyingKeysView",
    (spec.assert_max_size) = 16
  ];

  // fqdn is the cluster's public hostname, published from Config on
  // each config load. Services (e.g. letsencrypt) watch this to discover
  // the cluster FQDN without needing it in their own config.
  IdentityFqdn fqdn = 2;
}

// IdentityFqdn wraps the cluster's FQDN for publication as a singleton
// boundary in Identity state.
message IdentityFqdn {
  string fqdn = 1;
}

// TrustedCa stores trusted CA certificates for TLS verification.
// Installed from Config.trusted_cas on each config load.
// Services read these (RO) to verify TLS connections.
message TrustedCa {
  option (spec.service_state) = {name: "TrustedCa", tag: "kernel"};
  option (spec.disable_auth_message) = true;

  repeated x509.X509Cert trusted_cas = 1 [(spec.assert_max_size) = 16];
}

// MintService is kernel's identity authority — mints tokens and signs
// certificates. Kernel is the sole signing authority for the cluster.
// Hand-written implementation; tacplus generates client wrappers and server wiring.
//
// Gateway owns the public-facing MintService (OIDC discovery, JWKS, and
// REST endpoints) and delegates TokenMint/X509Mint to kernel via its
// direct kernel channel. This service is for S2S use only.
//
// Both RPCs handle direct exchange (caller presents credentials in the request)
// and delegation (broker authenticates via header, specifies subject/profiles).
// Kernel determines the mode from the request: if subject is set, it's delegation
// and the caller must be an authorized delegate implementation.
service KernelMintService {
  option (spec.service_grpc) = {name: "KernelMint", auth_disabled: true};

  // TokenMint mints a signed JWT token. Handles both direct credential
  // exchange and delegated minting from brokers (OAuth, K8S brokers).
  rpc TokenMint(tokenrequest.TokenMintRequest) returns (tokenrequest.TokenMintResponse) {}

  // X509Mint signs an X.509 certificate under a per-service intermediate CA.
  // Authentication via bearer token in the Authorization header or
  // input_token in the request body (for gateway-mediated calls).
  //
  // On each call, kernel:
  //   1. Extracts the service name from the token's sub claim.
  //   2. Gets or creates an intermediate CA for that service
  //      (signed by root CA, pathlen:0).
  //   3. Signs the caller-provided public key (cert_request.key)
  //      under the intermediate CA.
  //   4. Returns X509CertChain: leaf cert + intermediate CA cert in chain.
  //
  // The intermediate CA is unique per service, providing per-service
  // trust isolation — only nodes of the same service verify each other.
  rpc X509Mint(tokenrequest.X509MintRequest) returns (x509.X509CertChain) {}
}

// ============================================================================
// Delegate — S2S credential holders
// ============================================================================

// CloudIdentityMatcher configures which cloud identities a delegate accepts.
// The delegate proves identity using a CloudIdentityProof; this config
// tells kernel what to expect.
message CloudIdentityMatcher {
  // vendor identifies the cloud provider.
  cloudvendor.CloudVendor vendor = 1 [(spec.assert_enum_defined) = true];

  // expected_identity is the cloud identity to match against.
  // AWS: IAM role ARN. GCP: service account email. Azure: managed identity client ID.
  string expected_identity = 2 [(spec.assert_required) = true];
}

// Delegate holds credentials for a service or machine client that can request tokens.
// Each delegate is identified by name (becomes "sub" in issued tokens)
// and authenticates via a signed JWT (verified against cred_pairs) or cloud identity.
//
// Two authorization models (mutually exclusive):
//   - S2S: authorized_services → wildcard entitlements per listed service
//   - Profile-based: authorized_profiles → EntitlementProfile → per-service RPC lists
//     Used for machine clients (formerly ApiKey) that need fine-grained access.
message Delegate {
  // name is the delegate's identity (becomes sub in issued tokens).
  string name = 1 [(spec.assert_required) = true];

  // Public keys for verifying the delegate's signed JWT.
  // Repeated to allow rotation (old + new key during transition).
  repeated jwk.Jwk cred_pairs = 2 [(spec.assert_max_size) = 8];
  repeated CloudIdentityMatcher cloud_identities = 3 [(spec.assert_max_size) = 8];

  // authorized_services lists services this delegate can request tokens for.
  // Values are generated ServiceName enum entries matching service declarations.
  // The delegate can always request a token for itself (sub=name).
  // Use SERVICE_NAME_ANY to allow all services.
  repeated services.ServiceName authorized_services = 4 [(spec.assert_max_size) = 64];

  // authorized_profiles lists entitlement profiles this delegate may use.
  // When set, TokenMint resolves these profiles to per-service RPC lists
  // via entitlement_profiles in Config. Mutually exclusive with authorized_services:
  // a delegate uses either S2S (authorized_services) or profile-based
  // (authorized_profiles) authorization, not both.
  repeated string authorized_profiles = 5 [(spec.assert_max_size) = 100];

  // custom_claims are static key-value pairs added to every access token
  // minted for this delegate. Useful for identity claims (e.g. email).
  // Standard JWT claims (sub, iss, aud, exp, iat, azp, nbf, jti, typ, profiles)
  // are reserved and will be skipped.
  map<string, string> custom_claims = 6 [(spec.assert_max_size) = 20];
}

// ============================================================================
// gRPC Configuration
// ============================================================================

// Config is the gRPC configuration for Kernel.
// Unlike BootstrapConfig (read once at boot), Config can be reloaded at any time.
message Config {
  // trusted_cas lists the trusted CA certificates for TLS verification.
  repeated x509.X509Cert trusted_cas = 2 [(spec.assert_max_size) = 16];

  // rate_limit configures rate limiting for unary read RPCs to detect polling.
  hazelcast.RateLimitConfig rate_limit = 5 [(spec.assert_required) = true];

  // configs holds per-service configurations. On each config load,
  // each entry is written to the corresponding service config state boundary.
  services_config.Services configs = 7 [(spec.assert_required) = true];

  // --- Token Exchanger ---

  // key_rotation_interval_seconds is how often the exchanger rotates
  // its own signing keys. Default: 24 hours.
  int64 key_rotation_interval_seconds = 10 [(spec.default_int) = 86400];

  // default_token_expiry_seconds is the default lifetime for issued
  // access tokens when the request does not specify an expiry. Default: 1 hour.
  int64 default_token_expiry_seconds = 11 [(spec.default_int) = 3600];

  // delegates hold credentials for services that can request tokens.
  // Each delegate identifies a service and its authorized target services.
  repeated Delegate delegates = 16 [(spec.assert_max_size) = 128];

  // ca_cert_lifetime_seconds is the lifetime for node CA certificates.
  // Default: 31536000 (1 year). Node CA certs are regenerated on restart.
  int64 ca_cert_lifetime_seconds = 17 [
    (spec.default_int) = 31536000,
    (spec.assert_duration) = DURATION_TYPE_POSITIVE
  ];

  // --- User Token Authority (delegated from OAuth) ---

  // entitlement_profiles defines named sets of entitlements for user and machine
  // authorization. OPA policy in OAuth returns profile names; kernel resolves
  // those to concrete per-service RPC lists when OAuth calls MintToken.
  // Also used by TokenMint to resolve Delegate.authorized_profiles for machine clients.
  repeated entitlements.EntitlementProfile entitlement_profiles = 18 [(spec.assert_max_size) = 128];

  // access_token_lifetime_seconds is the default lifetime for user access tokens
  // minted via MintToken. Default: 900 (15 minutes).
  int64 access_token_lifetime_seconds = 20 [
    (spec.default_int) = 900,
    (spec.assert_duration) = DURATION_TYPE_POSITIVE
  ];

  // refresh_token_lifetime_seconds is the default lifetime for user refresh tokens
  // minted via MintToken. Default: 86400 (24 hours).
  int64 refresh_token_lifetime_seconds = 21 [
    (spec.default_int) = 86400,
    (spec.assert_duration) = DURATION_TYPE_POSITIVE
  ];

  // trust_domain is the SPIFFE trust domain for this cluster.
  // Used to construct SPIFFE IDs: spiffe://<trust_domain>/<azp>/<service>.
  // Default: "cavalier".
  string trust_domain = 22 [(spec.default_string) = "cavalier"];

  // fqdn is the fully qualified domain name for this cluster
  // (e.g. "api.example.com"). Published to Identity state for
  // services like letsencrypt. No default — must be set for production.
  string fqdn = 23 [(spec.assert_fqdn) = true];

  // issuer is the full issuer URL for tokens minted by this cluster.
  // For local development, computed as https://<fqdn>:<port> (port omitted if 443).
  // For production behind a load balancer, set explicitly (e.g. "https://api.example.com").
  string issuer = 24;

  // tls_cert_lifetime_seconds is the lifetime for auto-TLS service certificates.
  // Kernel sends a renewal request at half-life. Default: 86400 (24 hours).
  int64 tls_cert_lifetime_seconds = 25 [
    (spec.default_int) = 86400,
    (spec.assert_duration) = DURATION_TYPE_POSITIVE
  ];

  // max_token_lifetime_seconds is the maximum lifetime kernel will allow for
  // any minted token. Requests with exp beyond now + this value are rejected.
  // Delegates control their own exp policy within this ceiling.
  // Default: 2592000 (30 days).
  int64 max_token_lifetime_seconds = 26 [
    (spec.default_int) = 2592000,
    (spec.assert_duration) = DURATION_TYPE_POSITIVE
  ];
}

// ============================================================================
// Config Loaders
// ============================================================================

// UrlLoader fetches gRPC configuration from a URL.
// Supports HTTPS with optional bearer token authentication.
// TLS verification uses BootstrapConfig.loader_ca.
message UrlLoader {
  // url is the HTTPS URL to fetch the configuration from.
  string url = 1 [(spec.assert_required) = true];

  // token is the bearer token for authentication.
  // Sent as "Authorization: Bearer <token>" header.
  string token = 2;
}

// FileLoader loads gRPC configuration from a local file on disk.
message FileLoader {
  // path is the filesystem path to the configuration file.
  string path = 1 [(spec.assert_required) = true];
}

// ============================================================================
// Cluster State (cluster diagnostics, health, and metrics)
// ============================================================================
//
// Cluster is a state root that exposes cluster diagnostics and
// operational metrics. A background publisher in each node periodically
// computes metrics from JVM/Hazelcast APIs and writes them to the maps.
// Tacplus auto-generates Get/Set/Watch RPCs for each boundary.
//
// PATTERNS TO ADDRESS LATER:
//
// 1. Filtered queries: GetMapEntries needs key_prefix filter and limit.
//    The auto-generated collection Get doesn't support ad-hoc filtering.
//    Needs a hand-wrapped RPC or a new tacplus pattern for parameterized
//    queries on collections.
//
// 2. Transient point-in-time queries: ListLocks returns a snapshot of
//    lock state that changes too rapidly to publish to maps. Needs a
//    hand-wrapped RPC. Same applies to thread deadlock detection —
//    better as on-demand than periodic.
//
// 3. Publisher latency vs event-driven updates: Watch fires when maps
//    update, but the publisher writes on a fixed interval. For membership
//    changes, consider event-driven publishing (MembershipListener
//    triggers immediate cluster_info/cluster_health write) alongside
//    periodic publishing for metrics.
//
message Cluster {
  option (spec.service_state) = {name: "Cluster", tag: "kernel"};

  // --- Cluster-wide singletons (any node writes, convergent LWW) ---

  // cluster_info captures cluster membership, state, and version.
  // Updated on membership change events and periodically.
  hazelcast.AdminClusterInfo cluster_info = 1;

  // cluster_health captures partition safety, quorum, and migration state.
  // Updated on membership change events and periodically.
  hazelcast.AdminClusterHealth cluster_health = 2;

  // --- Per-node collections (each node writes its own entry, keyed by node_id) ---

  // node_metrics captures memory, CPU, and disk usage per node.
  repeated hazelcast.AdminNodeMetrics node_metrics = 3 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 32
  ];

  // grpc_stats captures gRPC connection and RPC statistics per node.
  repeated hazelcast.AdminGrpcStats grpc_stats = 4 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 32
  ];

  // persistence_status captures redo log and dump state per node.
  repeated hazelcast.AdminPersistenceStatus persistence_status = 5 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 32
  ];

  // network_stats captures network connections and traffic per node.
  repeated hazelcast.AdminNetworkStats network_stats = 6 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 32
  ];

  // thread_info captures JVM thread counts per node.
  repeated hazelcast.AdminThreadInfo thread_info = 7 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 32
  ];

  // token_cache_stats captures security token cache statistics per node.
  repeated hazelcast.AdminTokenCacheStats token_cache_stats = 8 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 32
  ];

  // map_stats captures per-map statistics. Keyed by map name.
  // Each node publishes stats for maps it owns partitions of.
  repeated hazelcast.AdminMapStats map_stats = 9 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 1024
  ];

  // --- Commands ---

  // set_log_level dynamically changes a logger's level without restart.
  AdminSetLogLevelRequest set_log_level = 10 [(spec.command) = true];

  // --- Private (no external RPCs — server reads/writes internally) ---

  // config_dump holds the running configuration. Private because it
  // contains secrets (cluster secret, keys, tokens).
  AdminConfigDump config_dump = 11 [
    (spec.private) = true
  ];

  // reload_config triggers a reload of the gRPC Config from the
  // configured source (URL or file). Updates token exchange
  // and per-service config state from the reloaded config.
  AdminReloadConfigRequest reload_config = 12 [
    (spec.command) = true,
    (spec.boundary_callers) = "orchestrator"
  ];

  // --- Configuration (published on boot / config reload for admin visibility) ---

  // bootstrap_config is the node's BootstrapConfig, published once at boot.
  // Private because BootstrapConfig contains the node's TLS private key.
  BootstrapConfig bootstrap_config = 13 [
    (spec.private) = true
  ];

  // grpc_config is the current gRPC Config, updated on each config reload.
  Config grpc_config = 14;

  // --- Graph registry and service connections ---

  // graph_registry contains metadata for all boundaries across all state roots.
  // Published once at boot from the generated Registry. Keyed by qualified_name.
  // Consumers use WatchGraphRegistry to discover all graphs in the system.
  repeated hazelcast.AdminGraphInfo graph_registry = 15 [(spec.assert_max_size) = 1024];

  // service_connections tracks which microservices are connected and what
  // graphs they are accessing. Published periodically by the security
  // interceptor based on authenticated peer identity. Keyed by "service_id@node_id".
  repeated hazelcast.AdminServiceConnection service_connections = 16 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 256
  ];

  // queue_stats captures per-queue statistics (depth, offer/consume rates).
  // Published per-queue per-node. Keyed by qualified_name.
  repeated hazelcast.AdminQueueStats queue_stats = 17 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 1024
  ];

  // topic_stats captures per-topic statistics (publish rate, subscriber count).
  // Published per-topic per-node. Keyed by qualified_name.
  repeated hazelcast.AdminTopicStats topic_stats = 18 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 1024
  ];

  // watch_health tracks active Watch streams and their consumer health.
  // Published per-active-watch per-node. Keyed by watch_id.
  repeated hazelcast.AdminWatchHealth watch_health = 19 [
    (spec.eviction_ttl_seconds) = 60,
    (spec.assert_max_size) = 1024
  ];

  // mutation_rates captures per-boundary write throughput.
  // Published per-boundary per-node. Keyed by qualified_name.
  repeated hazelcast.AdminMutationRate mutation_rates = 20 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 1024
  ];
}

// ============================================================================
// Admin — Log Level Control
// ============================================================================

// AdminSetLogLevelRequest dynamically changes a logger's level without restart.
// Dispatched as a command via Cluster.set_log_level.
message AdminSetLogLevelRequest {
  // logger_name is the fully qualified logger name (e.g., "com.example.MyClass").
  // Empty string targets the root logger.
  string logger_name = 1;

  // level is the desired log level (e.g., "DEBUG", "INFO", "WARN", "ERROR").
  string level = 2 [(spec.assert_required) = true];
}

// AdminReloadConfigRequest triggers a reload of the gRPC Config.
message AdminReloadConfigRequest {
  // force_reload forces a reload even if the config hasn't changed.
  bool force_reload = 1;
}

// ============================================================================
// Admin — Config Dump (private — contains secrets)
// ============================================================================

// AdminConfigDump holds the Hazelcast configuration for diagnostics.
// Private because the Hazelcast config may contain internal cluster details.
// Stored as a singleton in Cluster.config_dump.
message AdminConfigDump {
  // hazelcast_config_xml is the Hazelcast configuration serialized as XML.
  string hazelcast_config_xml = 3;
}

// ============================================================================
// Service Health State
// ============================================================================

// ServiceHealth is a state root for service instance health.
// All microservices have RW access. The server enforces per-instance write
// isolation via the token's instance_id claim (instance_keyed annotation).
message ServiceHealth {
  option (spec.service_state) = {name: "ServiceHealth", tag: "kernel"};

  // instances holds health data for each running service instance.
  // Keyed by "service_id@instance_id" (composed by server from token claims).
  // Entries TTL-expire in 30s if not refreshed, ensuring stale instances
  // are removed when a process dies.
  repeated healthreport.ServiceInstanceHealth instances = 1 [
    (spec.instance_keyed) = true,
    (spec.eviction_ttl_seconds) = 30,
    (spec.assert_max_size) = 256
  ];
}

// ============================================================================
// CA State (cluster-internal PKI)
// ============================================================================

// Ca holds CA certificates for the cluster's internal PKI.
// Each kernel node generates its own CA keypair (private key in memory)
// and publishes its CA cert here. Services read ca_certs (RO) for trust.
message Ca {
  option (spec.service_state) = {name: "Ca", tag: "kernel"};
  option (spec.disable_auth_message) = true;

  // ca_certs is the collection of all node CA certificates.
  // Each node publishes its own CA cert on boot. Services read these
  // to build a trust store for verifying certificates signed by any node.
  repeated x509.X509Cert ca_certs = 1 [
    (spec.persistence) = true,
    (spec.assert_max_size) = 16
  ];

  // service_cas holds per-service intermediate CA key pairs.
  // Each entry is keyed by service name (e.g., "eventbus", "dgraph").
  // The intermediate CA is created on first X509Mint call for a service
  // and reused for all subsequent calls by that service.
  // Signed by the cluster root CA with BasicConstraints CA:TRUE, pathlen:0.
  repeated x509.X509CertChain service_cas = 2 [
    (spec.persistence) = true,
    (spec.assert_max_size) = 64
  ];
}

// ============================================================================
// Gateway TLS — public-facing certificate management
// ============================================================================

// GatewayTlsState holds TLS certificate chains for the gateway's public-facing
// HTTPS endpoint. Certificates come from two sources:
//   - config_certs: manually configured cert chains (kernel writes from config)
//   - acme_certs: automatically provisioned by LetsEncrypt (RW for letsencrypt)
//
// Gateway watches the all_certs view to serve the correct certificate
// for each domain, regardless of how it was provisioned.
message GatewayTlsState {
  option (spec.service_state) = {name: "GatewayTls", tag: "kernel"};

  // config_certs holds manually configured TLS certificate chains.
  // Kernel populates these from its bootstrap config.
  repeated GatewayTlsCert config_certs = 1 [
    (spec.persistence) = true,
    (spec.assert_max_size) = 16
  ];

  // acme_certs holds certificate chains provisioned by LetsEncrypt.
  // LetsEncrypt has RW access to write and renew certs here.
  repeated GatewayTlsCert acme_certs = 2 [
    (spec.persistence) = true,
    (spec.boundary_perms) = {target: "letsencrypt.LetsEncryptState", mode: STATE_PERMS_MODE_RW},
    (spec.assert_max_size) = 16
  ];

  // all_certs is a read-only view over config_certs and acme_certs.
  // Gateway watches this to serve TLS certificates for all domains.
  repeated GatewayTlsCert all_certs = 3 [
    (spec.view_sources) = "config_certs",
    (spec.view_sources) = "acme_certs"
  ];
}

// GatewayTlsCert binds a domain name to a TLS certificate chain.
message GatewayTlsCert {
  // domain is the FQDN this certificate is for (e.g., "api.example.com").
  string domain = 1 [(spec.indexed) = true, (spec.assert_required) = true];

  // cert_chain is the TLS certificate chain and private key for this domain.
  x509.X509CertChain cert_chain = 2 [(spec.assert_required) = true];
}


// Collection query types (auto-injected)
enum ComparisonOp {
