// Package openai defines typed representations of the OpenAI Chat Completions API.
// The LLM proxy deserializes inbound requests and outbound responses into these
// types, forwards the raw HTTP/SSE to OpenAI, and emits a ProxyEvent
// capturing the full typed request/response pair for audit and observability.

syntax = "proto3";

package openai;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.services.openai";
option java_outer_classname = "Openai";

import "libs/spec.proto";
import "google/protobuf/empty.proto";

option (spec.service) = {name: "openai", id: 25};

// API constants.
option (spec.string_const) = { name: "CHAT_COMPLETIONS_PATH" value: "/v1/chat/completions" };
option (spec.string_const) = { name: "OPENAI_API_KEY_HEADER" value: "Authorization" };

// ============================================================================
// Content Parts — polymorphic content within user messages
// ============================================================================

// ContentPart is a single part of a multi-modal user message.
message ContentPart {
  ContentPartType type = 1 [(spec.assert_enum_defined) = true];

  // Text content (type = TEXT).
  string text = 2 [(spec.assert_max_length) = 5242880];

  // Image URL (type = IMAGE_URL).
  ImageUrl image_url = 3;
}

enum ContentPartType {
  CONTENT_PART_TYPE_UNSPECIFIED = 0;
  CONTENT_PART_TYPE_TEXT = 1 [(spec.json_return_value) = "text"];
  CONTENT_PART_TYPE_IMAGE_URL = 2 [(spec.json_return_value) = "image_url"];
}

// ImageUrl carries an image reference (URL or data URI).
message ImageUrl {
  // url is the image URL or base64 data URI ("data:image/png;base64,...").
  string url = 1 [(spec.assert_required) = true, (spec.assert_max_length) = 20971520];

  // detail controls image processing fidelity: "auto", "low", or "high".
  string detail = 2 [(spec.assert_max_length) = 16];
}

// ============================================================================
// Messages
// ============================================================================

enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;
  CHAT_ROLE_SYSTEM = 1 [(spec.json_return_value) = "system"];
  CHAT_ROLE_USER = 2 [(spec.json_return_value) = "user"];
  CHAT_ROLE_ASSISTANT = 3 [(spec.json_return_value) = "assistant"];
  CHAT_ROLE_TOOL = 4 [(spec.json_return_value) = "tool"];
  CHAT_ROLE_DEVELOPER = 5 [(spec.json_return_value) = "developer"];
}

// ChatMessage is a single turn in the conversation.
// Field presence depends on role:
//   system/developer: content (string)
//   user: content (string or content_parts)
//   assistant: content, tool_calls, refusal
//   tool: content, tool_call_id
message ChatMessage {
  ChatRole role = 1 [(spec.assert_enum_defined) = true];

  // content as a simple string (all roles).
  string content = 2 [(spec.assert_max_length) = 5242880];

  // content as multi-modal parts (user messages with images).
  repeated ContentPart content_parts = 3 [(spec.assert_max_size) = 1024];

  // name is an optional participant name for multi-agent conversations.
  string name = 4 [(spec.assert_max_length) = 256];

  // tool_calls requested by the assistant.
  repeated ToolCall tool_calls = 5 [(spec.assert_max_size) = 1024];

  // tool_call_id links a tool message to its originating tool_call.
  string tool_call_id = 6 [(spec.assert_max_length) = 256];

  // refusal is the assistant's refusal message (content filtering).
  string refusal = 7 [(spec.assert_max_length) = 4096];
}

// ============================================================================
// Tool Calls — model-generated invocations
// ============================================================================

// ToolCall is a tool invocation generated by the model.
message ToolCall {
  string id = 1 [(spec.assert_required) = true, (spec.assert_max_length) = 256];
  string type = 2 [(spec.assert_max_length) = 32];  // always "function"
  FunctionCall function = 3 [(spec.assert_required) = true];
}

// FunctionCall is the function name and JSON-encoded arguments.
message FunctionCall {
  string name = 1 [(spec.assert_required) = true, (spec.assert_max_length) = 256];
  string arguments = 2 [(spec.assert_required) = true, (spec.assert_max_length) = 1048576];  // JSON string
}

// ============================================================================
// Tool Definitions
// ============================================================================

// ToolDefinition describes a tool available to the model.
message ToolDefinition {
  string type = 1 [(spec.assert_max_length) = 32];  // "function"
  FunctionDefinition function = 2 [(spec.assert_required) = true];
}

// FunctionDefinition describes a callable function.
message FunctionDefinition {
  string name = 1 [(spec.assert_required) = true, (spec.assert_max_length) = 256];
  string description = 2 [(spec.assert_max_length) = 16384];

  // parameters is the JSON Schema for the function's parameters.
  string parameters = 3 [(spec.assert_max_length) = 1048576];

  // strict enables strict schema adherence (structured outputs).
  bool strict = 4;
}

// ToolChoice controls how the model selects tools.
message ToolChoice {
  // type controls tool selection: "auto", "none", "required", or "function".
  // When type = "function", the function field specifies which function.
  string type = 1 [(spec.assert_required) = true, (spec.assert_max_length) = 32];

  // function forces a specific function (when type = "function").
  ToolChoiceFunction function = 2;
}

// ToolChoiceFunction names a specific function to call.
message ToolChoiceFunction {
  string name = 1 [(spec.assert_required) = true, (spec.assert_max_length) = 256];
}

// ============================================================================
// Response Format (Structured Outputs)
// ============================================================================

// ResponseFormat controls the output structure.
message ResponseFormat {
  // type is "text", "json_object", or "json_schema".
  string type = 1 [(spec.assert_required) = true, (spec.assert_max_length) = 32];

  // json_schema defines the output schema (when type = "json_schema").
  JsonSchemaFormat json_schema = 2;
}

// JsonSchemaFormat defines a JSON Schema for structured output.
message JsonSchemaFormat {
  string name = 1 [(spec.assert_required) = true, (spec.assert_max_length) = 256];
  string description = 2 [(spec.assert_max_length) = 4096];

  // schema is the JSON Schema as a JSON string.
  string schema = 3 [(spec.assert_required) = true, (spec.assert_max_length) = 1048576];

  // strict enables exact schema matching.
  bool strict = 4;
}

// ============================================================================
// Stream Options
// ============================================================================

// StreamOptions configures streaming behavior.
message StreamOptions {
  // include_usage returns token usage in the final streamed chunk.
  bool include_usage = 1;
}

// ============================================================================
// Request
// ============================================================================

// CreateChatCompletionRequest is the request body for POST /v1/chat/completions.
message CreateChatCompletionRequest {
  string model = 1 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 128];
  repeated ChatMessage messages = 2 [(spec.assert_required) = true, (spec.assert_min_size) = 1, (spec.assert_max_size) = 4096];

  // Generation limits.
  int32 max_completion_tokens = 3 [(spec.assert_ge) = 1, (spec.assert_le) = 131072];

  // Sampling parameters.
  float temperature = 4 [(spec.assert_ge) = 0, (spec.assert_le) = 2];
  float top_p = 5 [(spec.assert_ge) = 0, (spec.assert_le) = 1];
  float frequency_penalty = 6 [(spec.assert_ge) = -2, (spec.assert_le) = 2];
  float presence_penalty = 7 [(spec.assert_ge) = -2, (spec.assert_le) = 2];

  // Number of completions to generate.
  int32 n = 8 [(spec.assert_ge) = 1, (spec.assert_le) = 128];

  // Streaming.
  bool stream = 9;
  StreamOptions stream_options = 10;

  // Stop sequences.
  repeated string stop = 11 [(spec.assert_max_size) = 4, (spec.assert_max_length) = 256];

  // Tool configuration.
  repeated ToolDefinition tools = 12 [(spec.assert_max_size) = 1024];
  ToolChoice tool_choice = 13;
  bool parallel_tool_calls = 14;

  // Output structure.
  ResponseFormat response_format = 15;

  // Reproducibility.
  int64 seed = 16;

  // Log probabilities.
  bool logprobs = 17;
  int32 top_logprobs = 18 [(spec.assert_ge) = 0, (spec.assert_le) = 20];

  // Reasoning effort for o-series models: "low", "medium", "high".
  string reasoning_effort = 19 [(spec.assert_max_length) = 16];

  // End-user identifier (opaque, not PII).
  string user = 20 [(spec.assert_max_length) = 256];

  // Token bias: maps token IDs to bias values (-100 to 100).
  // JSON-encoded as a map of string token IDs to floats.
  string logit_bias = 21 [(spec.assert_max_length) = 65536];

  // Service tier: "auto" or "default".
  string service_tier = 22 [(spec.assert_max_length) = 32];
}

// ============================================================================
// Response
// ============================================================================

// CreateChatCompletionResponse is the response from POST /v1/chat/completions.
message CreateChatCompletionResponse {
  string id = 1 [(spec.assert_max_length) = 256];
  string object = 2 [(spec.assert_max_length) = 64];  // "chat.completion"
  int64 created = 3 [(spec.assert_ge) = 0];            // unix timestamp
  string model = 4 [(spec.assert_max_length) = 128];
  repeated Choice choices = 5 [(spec.assert_max_size) = 128];
  Usage usage = 6;
  string system_fingerprint = 7 [(spec.assert_max_length) = 128];
  string service_tier = 8 [(spec.assert_max_length) = 32];
}

// Choice is a single completion in the response.
message Choice {
  int32 index = 1 [(spec.assert_ge) = 0];
  ChatMessage message = 2;
  FinishReason finish_reason = 3 [(spec.assert_enum_defined) = true];
  LogprobsResult logprobs = 4;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1 [(spec.json_return_value) = "stop"];
  FINISH_REASON_LENGTH = 2 [(spec.json_return_value) = "length"];
  FINISH_REASON_TOOL_CALLS = 3 [(spec.json_return_value) = "tool_calls"];
  FINISH_REASON_CONTENT_FILTER = 4 [(spec.json_return_value) = "content_filter"];
}

// Usage reports token consumption.
message Usage {
  int32 prompt_tokens = 1 [(spec.assert_ge) = 0];
  int32 completion_tokens = 2 [(spec.assert_ge) = 0];
  int32 total_tokens = 3 [(spec.assert_ge) = 0];

  // Detailed breakdown (when available).
  UsageDetails prompt_tokens_details = 4;
  UsageDetails completion_tokens_details = 5;
}

// UsageDetails provides a breakdown of token consumption.
message UsageDetails {
  int32 cached_tokens = 1 [(spec.assert_ge) = 0];
  int32 reasoning_tokens = 2 [(spec.assert_ge) = 0];
  int32 audio_tokens = 3 [(spec.assert_ge) = 0];
  int32 accepted_prediction_tokens = 4 [(spec.assert_ge) = 0];
  int32 rejected_prediction_tokens = 5 [(spec.assert_ge) = 0];
}

// ============================================================================
// Log Probabilities
// ============================================================================

// LogprobsResult contains log probability data for the response.
message LogprobsResult {
  repeated TokenLogprob content = 1 [(spec.assert_max_size) = 131072];
  repeated TokenLogprob refusal = 2 [(spec.assert_max_size) = 131072];
}

// TokenLogprob is the log probability of a single token.
message TokenLogprob {
  string token = 1 [(spec.assert_max_length) = 256];
  float logprob = 2;
  repeated int32 bytes = 3 [(spec.assert_max_size) = 64];  // UTF-8 bytes
  repeated TopLogprob top_logprobs = 4 [(spec.assert_max_size) = 20];
}

// TopLogprob is a candidate token and its log probability.
message TopLogprob {
  string token = 1 [(spec.assert_max_length) = 256];
  float logprob = 2;
  repeated int32 bytes = 3 [(spec.assert_max_size) = 64];
}

// ============================================================================
// Streaming
// ============================================================================

// ChatCompletionChunk is a single SSE event during streaming.
message ChatCompletionChunk {
  string id = 1 [(spec.assert_max_length) = 256];
  string object = 2 [(spec.assert_max_length) = 64];  // "chat.completion.chunk"
  int64 created = 3 [(spec.assert_ge) = 0];
  string model = 4 [(spec.assert_max_length) = 128];
  repeated ChunkChoice choices = 5 [(spec.assert_max_size) = 128];
  Usage usage = 6;                                      // final chunk only
  string system_fingerprint = 7 [(spec.assert_max_length) = 128];
  string service_tier = 8 [(spec.assert_max_length) = 32];
}

// ChunkChoice is a single choice delta in a streaming chunk.
message ChunkChoice {
  int32 index = 1 [(spec.assert_ge) = 0];
  ChunkDelta delta = 2;
  FinishReason finish_reason = 3 [(spec.assert_enum_defined) = true];
  LogprobsResult logprobs = 4;
}

// ChunkDelta carries incremental message content in a streaming chunk.
message ChunkDelta {
  ChatRole role = 1 [(spec.assert_enum_defined) = true];
  string content = 2 [(spec.assert_max_length) = 65536];
  repeated ToolCall tool_calls = 3 [(spec.assert_max_size) = 1024];
  string refusal = 4 [(spec.assert_max_length) = 4096];
}

// ============================================================================
// Error
// ============================================================================

// ErrorResponse is the error envelope returned by the API.
message ErrorResponse {
  ErrorDetail error = 1 [(spec.assert_required) = true];
}

message ErrorDetail {
  string message = 1 [(spec.assert_required) = true, (spec.assert_max_length) = 4096];
  string type = 2 [(spec.assert_required) = true, (spec.assert_max_length) = 64];
  string param = 3 [(spec.assert_max_length) = 256];
  string code = 4 [(spec.assert_max_length) = 64];
}

// ============================================================================
// Config
// ============================================================================

message Config {
  option (spec.grpc_config) = {service_name: "openai", id: 25};

  // openai_api_key is the API key for authenticating with the OpenAI API.
  string openai_api_key = 1 [(spec.assert_required) = true];

  // anthropic_api_key is the API key for proxying to the Anthropic API (cross-provider).
  string anthropic_api_key = 2;
}

// ============================================================================
// Service
// ============================================================================

// ProxyRequest wraps a CreateChatCompletionRequest with the destination API endpoint.
// The endpoint is not stored in service config — callers specify it per-request.
message ProxyRequest {
  // api_endpoint is the OpenAI API base URL (e.g. "https://api.openai.com").
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];

  // request is the Chat Completions API request body.
  CreateChatCompletionRequest request = 2 [(spec.assert_required) = true];

  // provider selects the upstream API format: "openai" (default) or "anthropic".
  // When "anthropic", the service converts the OpenAI request to Anthropic format,
  // proxies to the Anthropic API, and converts the response back.
  string provider = 3 [(spec.assert_max_length) = 32];
}

service OpenAIService {
  option (spec.service_grpc) = {name: "openai", auth_entitled_users: true};

  // CreateChatCompletion sends a non-streaming request to the OpenAI Chat Completions API.
  rpc CreateChatCompletion(ProxyRequest) returns (CreateChatCompletionResponse);

  // CreateChatCompletionStream sends a streaming request to the OpenAI Chat Completions API.
  // Returns a server-side stream of SSE chunks.
  rpc CreateChatCompletionStream(ProxyRequest) returns (stream ChatCompletionChunk);
}

// ============================================================================
// Proxy Event — typed audit record emitted by the LLM proxy
// ============================================================================

// ProxyEvent captures a single proxied LLM request/response pair.
// Emitted as a typed event by the LLM proxy for every API call.
message ProxyEvent {
  // Identity of the caller (sub claim from the bearer token).
  string subject = 1 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];

  // Request as received by the proxy (before API key injection).
  CreateChatCompletionRequest request = 2 [(spec.assert_required) = true];

  // Response from the provider. For streaming requests, this is
  // assembled from the final chunk (accumulated content + usage).
  CreateChatCompletionResponse response = 3;

  // Error from the provider, if the request failed.
  ErrorResponse error = 4;

  // Timing.
  int64 request_epoch_ms = 5 [(spec.assert_ge) = 0];
  int64 response_epoch_ms = 6 [(spec.assert_ge) = 0];
  int64 duration_ms = 7 [(spec.assert_ge) = 0];

  // Whether the request used streaming.
  bool streamed = 8;

  // HTTP status code from the upstream provider.
  int32 upstream_status = 9 [(spec.assert_ge) = 100, (spec.assert_le) = 599];

  // Provider identity.
  string provider = 10 [(spec.default_string) = "openai", (spec.assert_max_length) = 64];
}

// OpenaiConfigState is the state boundary for openai service configuration.
// Auto-injected by tacplus from (spec.grpc_config) annotation.
message OpenaiConfigState {
  option (spec.service_state) = {name: "OpenaiConfigState", store: "kernel"};
  option (spec.state_consistency) = CONSISTENCY_CONVERGENT;

  openai.Config config = 1 [
    (spec.consistency) = CONSISTENCY_CONVERGENT,
    (spec.persistence) = true
  ];
}

// ============================================================================
// Auto-generated State Service (tacplus)
// ============================================================================

service OpenaiConfigStateService {
	// Singleton: Config
	rpc GetConfig(google.protobuf.Empty) returns (Config);
	rpc SetConfig(Config) returns (Config);
	rpc WatchConfig(google.protobuf.Empty) returns (stream Config);
}

message MapEmpty {}


// ============================================================================
// Generated Proto Registry IDs
// Auto-injected by tacplus for shared type/RPC identifiers.
// ============================================================================
enum TypeID {
  TYPE_ID_UNSPECIFIED = 0;
  TYPE_ID_CONTENT_PART = 1;
  TYPE_ID_IMAGE_URL = 2;
  TYPE_ID_CHAT_MESSAGE = 3;
  TYPE_ID_TOOL_CALL = 4;
  TYPE_ID_FUNCTION_CALL = 5;
  TYPE_ID_TOOL_DEFINITION = 6;
  TYPE_ID_FUNCTION_DEFINITION = 7;
  TYPE_ID_TOOL_CHOICE = 8;
  TYPE_ID_TOOL_CHOICE_FUNCTION = 9;
  TYPE_ID_RESPONSE_FORMAT = 10;
  TYPE_ID_JSON_SCHEMA_FORMAT = 11;
  TYPE_ID_STREAM_OPTIONS = 12;
  TYPE_ID_CREATE_CHAT_COMPLETION_REQUEST = 13;
  TYPE_ID_CREATE_CHAT_COMPLETION_RESPONSE = 14;
  TYPE_ID_CHOICE = 15;
  TYPE_ID_USAGE = 16;
  TYPE_ID_USAGE_DETAILS = 17;
  TYPE_ID_LOGPROBS_RESULT = 18;
  TYPE_ID_TOKEN_LOGPROB = 19;
  TYPE_ID_TOP_LOGPROB = 20;
  TYPE_ID_CHAT_COMPLETION_CHUNK = 21;
  TYPE_ID_CHUNK_CHOICE = 22;
  TYPE_ID_CHUNK_DELTA = 23;
  TYPE_ID_ERROR_RESPONSE = 24;
  TYPE_ID_ERROR_DETAIL = 25;
  TYPE_ID_CONFIG = 26;
  TYPE_ID_PROXY_REQUEST = 27;
  TYPE_ID_PROXY_EVENT = 28;
  TYPE_ID_OPENAI_CONFIG_STATE = 29;
  TYPE_ID_MAP_EMPTY = 30;
}

enum OpenAIServiceRpcId {
  OPEN_AI_SERVICE_RPC_ID_UNSPECIFIED = 0;
  OPEN_AI_SERVICE_RPC_ID_ALL_ACCESSORS = 1;
  OPEN_AI_SERVICE_RPC_ID_ALL_MUTATORS = 2;
  OPEN_AI_SERVICE_RPC_ID_ALL_EXECUTORS = 3;
  OPEN_AI_SERVICE_RPC_ID_CREATE_CHAT_COMPLETION = 4;
  OPEN_AI_SERVICE_RPC_ID_CREATE_CHAT_COMPLETION_STREAM = 5;
}

enum OpenaiConfigStateServiceRpcId {
  OPENAI_CONFIG_STATE_SERVICE_RPC_ID_UNSPECIFIED = 0;
  OPENAI_CONFIG_STATE_SERVICE_RPC_ID_ALL_ACCESSORS = 1;
  OPENAI_CONFIG_STATE_SERVICE_RPC_ID_ALL_MUTATORS = 2;
  OPENAI_CONFIG_STATE_SERVICE_RPC_ID_ALL_EXECUTORS = 3;
  OPENAI_CONFIG_STATE_SERVICE_RPC_ID_GET_CONFIG = 4;
  OPENAI_CONFIG_STATE_SERVICE_RPC_ID_SET_CONFIG = 5;
  OPENAI_CONFIG_STATE_SERVICE_RPC_ID_WATCH_CONFIG = 6;
}
