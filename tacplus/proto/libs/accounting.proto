// Package accounting defines the typed event system that replaces unstructured
// text logging. Every event is a proto message with a known schema. Events flow
// through EventBus to consumers (short-term store, long-term accounting, LLM
// troubleshooting, alerting, suppression).
//
// Event levels:
//   ERROR — our bugs/failures, not user errors
//   WARN  — user-caused issues (expired token, bad input)
//   INFO  — state changes, completed actions (the accounting backbone)
//   DEBUG — fine-grained detail (dev binary only, console only, never stored)
//
// Prod binaries emit INFO+ to EventBus. Debug code paths are compiled out.
// Dev binaries also emit DEBUG to stderr (never EventBus).
//
// AccountingMethod is the only generated type (generated/accounting_method.proto,
// package accounting_method) because it has one field per discovered service.
// Everything else is static.

syntax = "proto3";

package accounting;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.libs.accounting";

import "generated/accounting_method.proto";

// =============================================================================
// Common Types
// =============================================================================

// ErrorContext captures the origin of an error or diagnostic event.
// "caller" and "function" are cheap (Go runtime.Caller, Rust std::panic::Location,
// Java StackWalker). "stack_trace" is only populated on actual errors.
message ErrorContext {
  // caller is the file and line where the event originated (e.g., "auth.go:142").
  string caller = 1;

  // function is the fully qualified function name (e.g., "(*Authorizer).Authorize").
  string function = 2;

  // stack_trace is the full call stack, only populated on ERROR-level events.
  string stack_trace = 3;
}

// =============================================================================
// Event Level
// =============================================================================

// EventLevel classifies events for emission control and retention policy.
// The level is inherent to the event type, not chosen at emit-time.
enum EventLevel {
  EVENT_LEVEL_UNDEFINED = 0;
  EVENT_LEVEL_DEBUG = 1;   // Dev binary only, console only, never stored
  EVENT_LEVEL_INFO = 2;    // Accounting backbone — completed actions, state changes
  EVENT_LEVEL_WARN = 3;    // User-caused issues — not our bug, but noteworthy
  EVENT_LEVEL_ERROR = 4;   // Our failures — something is broken
}

// =============================================================================
// Event Envelope
// =============================================================================

// Event is the top-level envelope for all typed events. It carries common
// context (source, identity, request tracing) and a typed payload.
//
// This is what gets published to EventBus, spooled for guaranteed delivery,
// and indexed by consumers.
message Event {
  // timestamp_ms is the event timestamp in milliseconds since epoch (UTC).
  int64 timestamp_ms = 1;

  // source_id identifies the emitting process.
  // Format: "{service_id}-{instance_id}" for services (e.g., "kernel-a1b2c3")
  // or "{tool}-{user}" for clients (e.g., "cavalierctl-jody").
  string source_id = 2;

  // request_id is the x-request-id that traces a request across gateway,
  // backend services, and client tools. Set by gateway, forwarded as gRPC
  // metadata, extracted by generated wrappers.
  string request_id = 3;

  // identity is the caller's identity — the claims from the verified token.
  // Enables identity-scoped event access — users query only their own events.
  // Keys are claim names (sub, aud, iss, etc.), values are claim values.
  map<string, string> identity = 4;

  // level is the event level, derived from the event type.
  // Included on the envelope for filtering without inspecting the payload.
  EventLevel level = 5;

  // event is the typed payload.
  oneof event {
    // RPC lifecycle
    RpcCompleted rpc_completed = 10;
    RpcError rpc_error = 11;
    TokenRejected token_rejected = 12;
    SessionSummary session_summary = 13;
    // Auth
    TokenExchanged token_exchanged = 20;
    // Infrastructure
    EndpointHealthChanged endpoint_health_changed = 30;
    StateUpdated state_updated = 31;
    // Client operations
    CommandExecuted command_executed = 40;
    // Agent telemetry
    ToolUsed tool_used = 50;
    SubagentStarted subagent_started = 51;
    FileModified file_modified = 52;
    // Escape hatch
    Diagnostic diagnostic = 100;
  }
}

// =============================================================================
// RPC Lifecycle — emitted automatically by generated wrappers
// =============================================================================

// RpcCompleted records a successful RPC invocation. [INFO]
// This is the primary accounting event — one per completed request.
message RpcCompleted {
  // method is the RPC that was invoked (generated per-service type).
  accounting_method.AccountingMethod method = 1;

  // duration_ms is the server-side processing time in milliseconds.
  int64 duration_ms = 2;
}

// RpcError records a failed RPC invocation. [ERROR]
// Only emitted for internal failures — our bugs, not user input errors.
message RpcError {
  // method is the RPC that was invoked.
  accounting_method.AccountingMethod method = 1;

  // code is the gRPC status code (numeric).
  int32 code = 2;

  // message is the error description.
  string message = 3;

  // duration_ms is how long the request ran before failing.
  int64 duration_ms = 4;

  // error_context captures caller, function, and stack trace.
  ErrorContext error_context = 5;
}

// TokenRejected records a failed authentication attempt. [WARN]
// User-caused — expired token, invalid signature, wrong audience.
// Not an ERROR because it's not our bug.
message TokenRejected {
  // reason describes why the token was rejected.
  string reason = 1;

  // method is the RPC where the token was rejected.
  accounting_method.AccountingMethod method = 2;
}

// =============================================================================
// Aggregation
// =============================================================================

// RpcSummary is an aggregated view of RPC usage for a single method.
// Used by SessionSummary to compress N events into one record.
message RpcSummary {
  accounting_method.AccountingMethod method = 1;
  int32 count = 2;
  int64 total_duration_ms = 3;
  int32 error_count = 4;
}

// SessionSummary compresses all RPC events sharing the same token
// into a single record. The aggregation window is bounded by the
// token's expiration time, so it has a known finite period.
message SessionSummary {
  map<string, string> identity = 1;
  int64 start_ms = 2;
  int64 end_ms = 3;
  repeated RpcSummary rpcs = 4;
  int32 total_requests = 5;
  int32 total_errors = 6;
}

// =============================================================================
// Auth Events
// =============================================================================

// TokenExchanged records a successful token mint or exchange. [INFO]
// Accounting event — tracks token issuance for usage/billing.
message TokenExchanged {
  // audience is the target audience of the minted token.
  string audience = 1;

  // grant_type is the OAuth grant type used (e.g., "urn:ietf:params:oauth:grant-type:token-exchange").
  string grant_type = 2;

  // token_type distinguishes JWT vs X509 mints.
  string token_type = 3;
}

// =============================================================================
// Infrastructure Events
// =============================================================================

// EndpointHealthChanged records a change in endpoint health status. [WARN]
// Emitted by ServiceManager when an endpoint transitions healthy↔unhealthy.
message EndpointHealthChanged {
  // endpoint is the "host:port" of the affected endpoint.
  string endpoint = 1;

  // healthy is the new health status.
  bool healthy = 2;

  // latency_ms is the last measured latency (0 if unhealthy).
  int64 latency_ms = 3;
}

// StateUpdated records a state change in the system. [INFO]
// Emitted when entities are created, updated, or deleted via state services.
// Provides a coarse audit trail — "what changed" without the full payload.
message StateUpdated {
  // entity_type is the proto message type that changed (e.g., "DetectionRule", "Topic").
  string entity_type = 1;

  // entity_id is the identifier of the changed entity.
  string entity_id = 2;

  // action is what happened.
  StateAction action = 3;
}

// StateAction describes what happened to a state entity.
enum StateAction {
  STATE_ACTION_UNDEFINED = 0;
  STATE_ACTION_CREATED = 1;
  STATE_ACTION_UPDATED = 2;
  STATE_ACTION_DELETED = 3;
}

// =============================================================================
// Client Operations
// =============================================================================

// CommandExecuted records a CLI command invocation. [INFO]
// Emitted by client tools (cavalierctl, blueclaude) via the daemon.
message CommandExecuted {
  // tool is the CLI tool name (e.g., "cavalierctl", "blueclaude").
  string tool = 1;

  // command is the subcommand (e.g., "api", "bootstrap", "claude").
  string command = 2;

  // duration_ms is the command execution time.
  int64 duration_ms = 3;

  // success indicates whether the command completed successfully.
  bool success = 4;

  // error_message is set when success is false.
  string error_message = 5;
}

// =============================================================================
// Agent Telemetry — subsumes SensorEvent from blueclaude
// =============================================================================

// ToolUsed records an AI agent's use of a tool. [INFO]
message ToolUsed {
  string tool_name = 1;
  int64 duration_ms = 2;
  string session_id = 3;
  string project_path = 4;
}

// SubagentStarted records when an AI agent spawns a sub-agent. [INFO]
message SubagentStarted {
  string agent_type = 1;
  string session_id = 2;
  string description = 3;
}

// FileModified records a file modification by an AI agent. [INFO]
message FileModified {
  string path = 1;
  FileAction action = 2;
  string session_id = 3;
}

// FileAction describes what happened to a file.
enum FileAction {
  FILE_ACTION_UNDEFINED = 0;
  FILE_ACTION_CREATED = 1;
  FILE_ACTION_MODIFIED = 2;
  FILE_ACTION_DELETED = 3;
}

// =============================================================================
// Escape Hatch
// =============================================================================

// Diagnostic is the freeform escape hatch for cases where no typed event
// exists yet. [ERROR]
//
// Use this sparingly. When a Diagnostic pattern emerges (same context, same
// kind of message), promote it to a typed event. Diagnostics are a migration
// path, not a permanent solution.
message Diagnostic {
  string message = 1;
  string context = 2;
  ErrorContext error_context = 3;
}

// =============================================================================
// Spool Configuration
// =============================================================================

// SpoolConfig configures the local spool for guaranteed delivery of INFO+
// events to EventBus.
message SpoolConfig {
  int32 flush_interval_ms = 1;
  int32 batch_size = 2;
  string spool_path = 3;
  int64 spool_max_bytes = 4;
}

// ============================================================================
// Generated Proto Registry IDs
// Auto-injected by tacplus for shared type/RPC identifiers.
// ============================================================================
enum TypeID {
  TYPE_ID_UNSPECIFIED = 0;
  TYPE_ID_ERROR_CONTEXT = 1;
  TYPE_ID_EVENT = 2;
  TYPE_ID_RPC_COMPLETED = 3;
  TYPE_ID_RPC_ERROR = 4;
  TYPE_ID_TOKEN_REJECTED = 5;
  TYPE_ID_RPC_SUMMARY = 6;
  TYPE_ID_SESSION_SUMMARY = 7;
  TYPE_ID_TOKEN_EXCHANGED = 8;
  TYPE_ID_ENDPOINT_HEALTH_CHANGED = 9;
  TYPE_ID_STATE_UPDATED = 10;
  TYPE_ID_COMMAND_EXECUTED = 11;
  TYPE_ID_TOOL_USED = 12;
  TYPE_ID_SUBAGENT_STARTED = 13;
  TYPE_ID_FILE_MODIFIED = 14;
  TYPE_ID_DIAGNOSTIC = 15;
  TYPE_ID_SPOOL_CONFIG = 16;
}
