syntax = "proto3";
package gateway;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.services.gateway";
option java_outer_classname = "Gateway";

import "libs/spec.proto";
import "libs/host.proto";
import "google/protobuf/empty.proto";
import "libs/jwk.proto";
import "libs/x509.proto";
import "common/tokenrequest.proto";

message Config {

  // How often to refresh health state (seconds). Default 5.
  int64 health_poll_interval_seconds = 1;

  // Enable HTTP/1.1 and HTTP/2 listener (TCP). Default true.
  bool enable_http = 2;

  // Enable HTTP/3 listener (QUIC/UDP). Default true.
  bool enable_http3 = 3;

  // Enable gRPC listener (TCP). Default true.
  bool enable_grpc = 4;

  // TCP listener for HTTP/1.1, HTTP/2, and gRPC. Default port 8443.
  host.Host tcp_listener = 5;

  // QUIC/UDP listener for HTTP/3. Default port 8443.
  host.Host quic_listener = 6;
}

// MintService is gateway's token authority front-end. Gateway owns the OIDC
// discovery and JWKS endpoints (it already watches JWK keys from kernel).
// TokenMint and X509Mint are delegated to kernel via the direct kernel channel.
service MintService {

  // OpenIdConfig returns the OpenID Connect discovery document.
  // Gateway is the public-facing authority; the issuer URL is the gateway FQDN.
  rpc OpenIdConfig(google.protobuf.Empty) returns (jwk.OpenIdConfiguration) {
  }

  // Jwks returns the current JSON Web Key Set for token verification.
  // Gateway watches kernel's verifying keys and serves them at this endpoint.
  rpc Jwks(google.protobuf.Empty) returns (jwk.Jwks) {
  }

  // TokenMint mints a signed JWT token. Delegated to kernel's MintService.
  rpc TokenMint(tokenrequest.TokenMintRequest) returns (tokenrequest.TokenMintResponse) {}

  // X509Mint signs an X.509 certificate. Delegated to kernel's MintService.
  rpc X509Mint(tokenrequest.X509MintRequest) returns (x509.X509CertChain) {}
}

// GatewayConfigState is the state boundary for gateway service configuration.
// Auto-injected by tacplus from (spec.grpc_config) annotation.
message GatewayConfigState {

  gateway.Config config = 1;
}

// ============================================================================
// Auto-generated State Service (tacplus)
// ============================================================================

service GatewayConfigStateService {
	// Singleton: Config
	rpc GetConfig(google.protobuf.Empty) returns (Config);
	rpc SetConfig(Config) returns (Config);
	rpc WatchConfig(google.protobuf.Empty) returns (stream Config);
}

message MapEmpty {}

// ============================================================================
// Generated Proto Registry IDs
// Auto-injected by tacplus for shared type/RPC identifiers.
// ============================================================================
enum TypeID {
  TYPE_ID_UNSPECIFIED = 0;
  TYPE_ID_CONFIG = 1;
  TYPE_ID_GATEWAY_CONFIG_STATE = 2;
  TYPE_ID_MAP_EMPTY = 3;
}

enum MintServiceRpcId {
  MINT_SERVICE_RPC_ID_UNSPECIFIED = 0;
  MINT_SERVICE_RPC_ID_ALL_ACCESSORS = 1;
  MINT_SERVICE_RPC_ID_ALL_MUTATORS = 2;
  MINT_SERVICE_RPC_ID_ALL_EXECUTORS = 3;
  MINT_SERVICE_RPC_ID_OPEN_ID_CONFIG = 4;
  MINT_SERVICE_RPC_ID_JWKS = 5;
  MINT_SERVICE_RPC_ID_TOKEN_MINT = 6;
  MINT_SERVICE_RPC_ID_X509_MINT = 7;
}

enum GatewayConfigStateServiceRpcId {
  GATEWAY_CONFIG_STATE_SERVICE_RPC_ID_UNSPECIFIED = 0;
  GATEWAY_CONFIG_STATE_SERVICE_RPC_ID_ALL_ACCESSORS = 1;
  GATEWAY_CONFIG_STATE_SERVICE_RPC_ID_ALL_MUTATORS = 2;
  GATEWAY_CONFIG_STATE_SERVICE_RPC_ID_ALL_EXECUTORS = 3;
  GATEWAY_CONFIG_STATE_SERVICE_RPC_ID_GET_CONFIG = 4;
  GATEWAY_CONFIG_STATE_SERVICE_RPC_ID_SET_CONFIG = 5;
  GATEWAY_CONFIG_STATE_SERVICE_RPC_ID_WATCH_CONFIG = 6;
}
