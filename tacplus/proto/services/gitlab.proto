// Package gitlab defines typed representations of the GitLab REST API (v4).
// The gitlab service proxies gRPC requests to the remote GitLab API,
// providing typed request/response handling for common operations and a
// generic fallback proxy for any API endpoint. Every proxied call emits
// a typed audit event via the accounting system.
//
// Design: typed RPCs cover the most common agent workflows (projects,
// merge requests, issues, pipelines, repository files, branches, search).
// The generic Proxy RPC handles any endpoint not yet typed. The service
// implementation logs when the generic fallback is used, signaling a
// coverage gap for future typed RPC addition.

syntax = "proto3";

package gitlab;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.services.gitlab";
option java_outer_classname = "Gitlab";

import "libs/http.proto";
import "libs/spec.proto";
import "google/protobuf/empty.proto";

// API constants.

// ============================================================================
// Config
// ============================================================================

message Config {

  // api_token is the API token for authenticating with the GitLab API.
  // Supports personal access tokens, project access tokens, group access
  // tokens, and OAuth tokens.
  string api_token = 1;
}

// ============================================================================
// GitLab-Specific Metadata
// ============================================================================

message RateLimitInfo {
  int32 limit = 1;
  int32 remaining = 2;
  int32 observed = 3;
  int64 reset_at = 4 [json_name = "reset"]; // Unix epoch seconds
  string reset_time = 5;  // RFC 2616 human-readable
}

message PaginationInfo {
  int32 page = 1;
  int32 per_page = 2;
  int32 total = 3;
  int32 total_pages = 4;
  bool has_next_page = 5;
  string next_page_url = 6;
}

// ============================================================================
// Resource Types
// ============================================================================

message User {
  int64 id = 1;
  string username = 2;
  string name = 3;
  string avatar_url = 4;
  string web_url = 5;
  string state = 6;  // "active", "blocked", "deactivated"
}

message Namespace {
  int64 id = 1;
  string name = 2;
  string path = 3;
  string kind = 4;  // "user", "group"
  string full_path = 5;
  string web_url = 6;
}

message Project {
  int64 id = 1;
  string name = 2;
  string name_with_namespace = 3;
  string path = 4;
  string path_with_namespace = 5;
  string description = 6;
  string default_branch = 7;
  string visibility = 8;  // "private", "internal", "public"
  string web_url = 9;
  string ssh_url_to_repo = 10;
  string http_url_to_repo = 11;
  Namespace namespace = 12;
  User owner = 13;
  int32 star_count = 14;
  int32 forks_count = 15;
  int32 open_issues_count = 16;
  bool archived = 17;
  repeated string topics = 18;
  string created_at = 19;
  string last_activity_at = 20;
}

message Label {
  int64 id = 1;
  string name = 2;
  string color = 3;
  string description = 4;
}

message Milestone {
  int64 id = 1;
  int32 iid = 2;
  string title = 3;
  string description = 4;
  string state = 5;
  string due_date = 6;
  string web_url = 7;
}

message Issue {
  int64 id = 1;
  int32 iid = 2;
  string title = 3;
  string description = 4;
  string state = 5;  // "opened", "closed"
  User author = 6;
  User assignee = 7;
  repeated User assignees = 8;
  repeated Label labels = 9;
  Milestone milestone = 10;
  string web_url = 11;
  int32 user_notes_count = 12;
  bool confidential = 13;
  string created_at = 14;
  string updated_at = 15;
  string closed_at = 16;
}

message MergeRequest {
  int64 id = 1;
  int32 iid = 2;
  string title = 3;
  string description = 4;
  string state = 5;  // "opened", "closed", "merged", "locked"
  User author = 6;
  User assignee = 7;
  repeated User assignees = 8;
  repeated User reviewers = 9;
  repeated Label labels = 10;
  string source_branch = 11;
  string target_branch = 12;
  string web_url = 13;
  string merge_status = 14;   // "can_be_merged", "cannot_be_merged", etc.
  string sha = 15;            // HEAD SHA of source branch
  string merge_commit_sha = 16;
  bool has_conflicts = 17;
  bool draft = 18;
  int32 user_notes_count = 19;
  int32 changes_count = 20;
  string created_at = 21;
  string updated_at = 22;
  string merged_at = 23;
  User merged_by = 24;
  string detailed_merge_status = 25;
  Pipeline head_pipeline = 26;
}

message Note {
  int64 id = 1;
  string body = 2;
  User author = 3;
  bool system = 4;        // true if auto-generated by GitLab
  bool resolvable = 5;
  bool resolved = 6;
  string noteable_type = 7;  // "Issue", "MergeRequest"
  string created_at = 8;
  string updated_at = 9;
}

message MergeRequestDiff {
  string old_path = 1;
  string new_path = 2;
  string a_mode = 3;
  string b_mode = 4;
  bool new_file = 5;
  bool renamed_file = 6;
  bool deleted_file = 7;
  string diff = 8;
}

message Pipeline {
  int64 id = 1;
  int32 iid = 2;
  string status = 3;  // created, waiting, pending, running, success, failed, canceled, skipped, manual, scheduled
  string ref = 4;
  string sha = 5;
  string source = 6;  // push, web, trigger, schedule, api, pipeline, etc.
  string web_url = 7;
  User user = 8;
  string created_at = 9;
  string updated_at = 10;
  string started_at = 11;
  string finished_at = 12;
  int32 duration = 13;         // seconds
  int32 queued_duration = 14;  // seconds
}

message Job {
  int64 id = 1;
  string name = 2;
  string stage = 3;
  string status = 4;
  string ref = 5;
  string web_url = 6;
  User user = 7;
  Pipeline pipeline = 8;
  int32 duration = 9;
  int32 queued_duration = 10;
  string created_at = 11;
  string started_at = 12;
  string finished_at = 13;
  string failure_reason = 14;
}

message Branch {
  string name = 1;
  bool merged = 2;
  bool protected = 3;
  bool default = 4;
  BranchCommit commit = 5;
}

message BranchCommit {
  string id = 1;      // SHA
  string short_id = 2;
  string title = 3;
  string message = 4;
  string author_name = 5;
  string author_email = 6;
  string authored_date = 7;
  string committed_date = 8;
  string web_url = 9;
}

message RepositoryFile {
  string file_name = 1;
  string file_path = 2;
  int64 size = 3;
  string encoding = 4;    // "base64"
  string content = 5;
  string content_sha256 = 6;
  string ref = 7;
  string blob_id = 8;
  string commit_id = 9;
  string last_commit_id = 10;
}

message TreeEntry {
  string id = 1;       // SHA
  string name = 2;
  string type = 3;     // "blob", "tree"
  string path = 4;
  string mode = 5;
}

message SearchBlobResult {
  string basename = 1;
  string data = 2;
  string path = 3;
  string filename = 4;
  string ref = 5;
  int64 startline = 6;
  int64 project_id = 7;
}

// ============================================================================
// Project Requests / Responses
// ============================================================================

// GetProjectRequest fetches a project by ID or URL-encoded path.
message GetProjectRequest {
  string api_endpoint = 1;
  // project_id is the numeric ID or URL-encoded path (e.g., "my-group%2Fmy-project").
  string project_id = 2;
}

message GetProjectResponse {
  Project project = 1;
  RateLimitInfo rate_limit = 2;
}

// ============================================================================
// Issue Requests / Responses
// ============================================================================

message ListIssuesRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string state = 3;      // opened, closed, all
  string sort = 4;       // created_at, updated_at, priority, due_date, etc.
  string order_by = 5;   // asc, desc
  repeated string labels = 6;
  string assignee_username = 7;
  string search = 8;
  string created_after = 9;
  string updated_after = 10;
  int32 page = 11;
  int32 per_page = 12;
}

message ListIssuesResponse {
  repeated Issue issues = 1;
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

message GetIssueRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int32 issue_iid = 3;
}

message GetIssueResponse {
  Issue issue = 1;
  RateLimitInfo rate_limit = 2;
}

message CreateIssueRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string title = 3;
  string description = 4;
  repeated string labels = 5;
  int32 assignee_id = 6;
  repeated int32 assignee_ids = 7;
  int32 milestone_id = 8;
  bool confidential = 9;
}

message CreateIssueResponse {
  Issue issue = 1;
  RateLimitInfo rate_limit = 2;
}

message UpdateIssueRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int32 issue_iid = 3;
  string title = 4;
  string description = 5;
  string state_event = 6;  // "close", "reopen"
  repeated string labels = 7;
  repeated int32 assignee_ids = 8;
  int32 milestone_id = 9;
  bool confidential = 10;
}

message UpdateIssueResponse {
  Issue issue = 1;
  RateLimitInfo rate_limit = 2;
}

message CreateIssueNoteRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int32 issue_iid = 3;
  string body = 4;
}

message CreateIssueNoteResponse {
  Note note = 1;
  RateLimitInfo rate_limit = 2;
}

// ============================================================================
// Merge Request Requests / Responses
// ============================================================================

message ListMergeRequestsRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string state = 3;      // opened, closed, merged, locked, all
  string sort = 4;       // asc, desc
  string order_by = 5;   // created_at, updated_at
  string source_branch = 6;
  string target_branch = 7;
  string search = 8;
  repeated string labels = 9;
  int32 page = 10;
  int32 per_page = 11;
}

message ListMergeRequestsResponse {
  repeated MergeRequest merge_requests = 1;
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

message GetMergeRequestRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int32 merge_request_iid = 3;
}

message GetMergeRequestResponse {
  MergeRequest merge_request = 1;
  RateLimitInfo rate_limit = 2;
}

message CreateMergeRequestRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string title = 3;
  string source_branch = 4;
  string target_branch = 5;
  string description = 6;
  repeated string labels = 7;
  int32 assignee_id = 8;
  repeated int32 reviewer_ids = 9;
  int32 milestone_id = 10;
  bool remove_source_branch = 11;
  bool squash = 12;
}

message CreateMergeRequestResponse {
  MergeRequest merge_request = 1;
  RateLimitInfo rate_limit = 2;
}

message UpdateMergeRequestRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int32 merge_request_iid = 3;
  string title = 4;
  string description = 5;
  string state_event = 6;  // "close", "reopen"
  repeated string labels = 7;
  int32 assignee_id = 8;
  repeated int32 reviewer_ids = 9;
  int32 milestone_id = 10;
  bool remove_source_branch = 11;
  bool squash = 12;
  string target_branch = 13;
}

message UpdateMergeRequestResponse {
  MergeRequest merge_request = 1;
  RateLimitInfo rate_limit = 2;
}

message MergeMergeRequestRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int32 merge_request_iid = 3;
  string merge_commit_message = 4;
  string squash_commit_message = 5;
  bool squash = 6;
  bool should_remove_source_branch = 7;
  bool merge_when_pipeline_succeeds = 8;
  string sha = 9;  // SHA head must match (prevents race)
}

message MergeMergeRequestResponse {
  MergeRequest merge_request = 1;
  RateLimitInfo rate_limit = 2;
}

message ListMergeRequestChangesRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int32 merge_request_iid = 3;
}

message ListMergeRequestChangesResponse {
  repeated MergeRequestDiff changes = 1;
  RateLimitInfo rate_limit = 2;
}

message CreateMergeRequestNoteRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int32 merge_request_iid = 3;
  string body = 4;
}

message CreateMergeRequestNoteResponse {
  Note note = 1;
  RateLimitInfo rate_limit = 2;
}

// ============================================================================
// Pipeline Requests / Responses
// ============================================================================

message ListPipelinesRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string status = 3;     // created, waiting, pending, running, success, failed, canceled, skipped, manual, scheduled
  string ref = 4;
  string source = 5;     // push, web, trigger, schedule, api, etc.
  string sort = 6;        // asc, desc
  string order_by = 7;   // id, status, ref, updated_at, user_id
  int32 page = 8;
  int32 per_page = 9;
}

message ListPipelinesResponse {
  repeated Pipeline pipelines = 1;
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

message GetPipelineRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int64 pipeline_id = 3;
}

message GetPipelineResponse {
  Pipeline pipeline = 1;
  RateLimitInfo rate_limit = 2;
}

message CreatePipelineRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string ref = 3;
  repeated PipelineVariable variables = 4;
}

message PipelineVariable {
  string key = 1;
  string value = 2;
  string variable_type = 3;  // "env_var", "file"
}

message CreatePipelineResponse {
  Pipeline pipeline = 1;
  RateLimitInfo rate_limit = 2;
}

message CancelPipelineRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int64 pipeline_id = 3;
}

message CancelPipelineResponse {
  Pipeline pipeline = 1;
  RateLimitInfo rate_limit = 2;
}

message RetryPipelineRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int64 pipeline_id = 3;
}

message RetryPipelineResponse {
  Pipeline pipeline = 1;
  RateLimitInfo rate_limit = 2;
}

message ListPipelineJobsRequest {
  string api_endpoint = 1;
  string project_id = 2;
  int64 pipeline_id = 3;
  string scope = 4;  // created, pending, running, failed, success, canceled, skipped, manual
  int32 page = 5;
  int32 per_page = 6;
}

message ListPipelineJobsResponse {
  repeated Job jobs = 1;
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

// ============================================================================
// Repository File Requests / Responses
// ============================================================================

message GetRepositoryFileRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string file_path = 3;  // URL-encoded path
  string ref = 4;
}

message GetRepositoryFileResponse {
  RepositoryFile file = 1;
  RateLimitInfo rate_limit = 2;
}

message CreateRepositoryFileRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string file_path = 3;
  string branch = 4;
  string content = 5;
  string commit_message = 6;
  string encoding = 7;      // "text" (default) or "base64"
  string author_email = 8;
  string author_name = 9;
  string start_branch = 10; // branch to start new branch from
}

message CreateRepositoryFileResponse {
  RepositoryFile file = 1;
  RateLimitInfo rate_limit = 2;
}

message UpdateRepositoryFileRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string file_path = 3;
  string branch = 4;
  string content = 5;
  string commit_message = 6;
  string encoding = 7;
  string author_email = 8;
  string author_name = 9;
  string last_commit_id = 10;  // prevents race condition
}

message UpdateRepositoryFileResponse {
  RepositoryFile file = 1;
  RateLimitInfo rate_limit = 2;
}

// ============================================================================
// Branch Requests / Responses
// ============================================================================

message ListBranchesRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string search = 3;
  int32 page = 4;
  int32 per_page = 5;
}

message ListBranchesResponse {
  repeated Branch branches = 1;
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

message CreateBranchRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string branch = 3;
  string ref = 4;  // branch, tag, or SHA to branch from
}

message CreateBranchResponse {
  Branch branch = 1;
  RateLimitInfo rate_limit = 2;
}

// ============================================================================
// Commit Requests / Responses
// ============================================================================

message ListCommitsRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string ref_name = 3;
  string path = 4;
  string since = 5;
  string until = 6;
  int32 page = 7;
  int32 per_page = 8;
}

message ListCommitsResponse {
  repeated BranchCommit commits = 1;
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

// ============================================================================
// Search Requests / Responses
// ============================================================================

// SearchBlobsRequest searches for code within a project using the blobs scope.
message SearchBlobsRequest {
  string api_endpoint = 1;
  string project_id = 2;
  string search = 3;
  string ref = 4;
  int32 page = 5;
  int32 per_page = 6;
}

message SearchBlobsResponse {
  repeated SearchBlobResult results = 1;
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

// ============================================================================
// Service
// ============================================================================

service GitLabService {

  // Generic fallback proxy for any GitLab REST API endpoint.
  // The service logs when this is used, signaling a typed RPC coverage gap.
  rpc Proxy(http.RawProxyRequest) returns (http.RawProxyResponse);

  // Projects
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);

  // Issues
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse);
  rpc GetIssue(GetIssueRequest) returns (GetIssueResponse);
  rpc CreateIssue(CreateIssueRequest) returns (CreateIssueResponse);
  rpc UpdateIssue(UpdateIssueRequest) returns (UpdateIssueResponse);
  rpc CreateIssueNote(CreateIssueNoteRequest) returns (CreateIssueNoteResponse);

  // Merge Requests
  rpc ListMergeRequests(ListMergeRequestsRequest) returns (ListMergeRequestsResponse);
  rpc GetMergeRequest(GetMergeRequestRequest) returns (GetMergeRequestResponse);
  rpc CreateMergeRequest(CreateMergeRequestRequest) returns (CreateMergeRequestResponse);
  rpc UpdateMergeRequest(UpdateMergeRequestRequest) returns (UpdateMergeRequestResponse);
  rpc MergeMergeRequest(MergeMergeRequestRequest) returns (MergeMergeRequestResponse);
  rpc ListMergeRequestChanges(ListMergeRequestChangesRequest) returns (ListMergeRequestChangesResponse);
  rpc CreateMergeRequestNote(CreateMergeRequestNoteRequest) returns (CreateMergeRequestNoteResponse);

  // Pipelines
  rpc ListPipelines(ListPipelinesRequest) returns (ListPipelinesResponse);
  rpc GetPipeline(GetPipelineRequest) returns (GetPipelineResponse);
  rpc CreatePipeline(CreatePipelineRequest) returns (CreatePipelineResponse);
  rpc CancelPipeline(CancelPipelineRequest) returns (CancelPipelineResponse);
  rpc RetryPipeline(RetryPipelineRequest) returns (RetryPipelineResponse);
  rpc ListPipelineJobs(ListPipelineJobsRequest) returns (ListPipelineJobsResponse);

  // Repository Files
  rpc GetRepositoryFile(GetRepositoryFileRequest) returns (GetRepositoryFileResponse);
  rpc CreateRepositoryFile(CreateRepositoryFileRequest) returns (CreateRepositoryFileResponse);
  rpc UpdateRepositoryFile(UpdateRepositoryFileRequest) returns (UpdateRepositoryFileResponse);

  // Branches
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);

  // Commits
  rpc ListCommits(ListCommitsRequest) returns (ListCommitsResponse);

  // Search
  rpc SearchBlobs(SearchBlobsRequest) returns (SearchBlobsResponse);
}

// ============================================================================
// Proxy Event — typed audit record emitted by the GitLab proxy
// ============================================================================

// ProxyEvent captures a single proxied GitLab API request/response pair.
// Emitted as a typed event for every API call, whether through a typed
// RPC or the generic proxy fallback.
message ProxyEvent {
  // Identity of the caller (sub claim from the bearer token).
  string subject = 1;

  // HTTP method of the proxied request.
  http.HttpMethod method = 2;

  // API path of the proxied request (e.g., "/api/v4/projects/123/issues").
  string path = 3;

  // Project ID from the request, if applicable.
  string project_id = 4;

  // Whether the request used a typed RPC (true) or the generic proxy (false).
  bool typed_rpc = 5;

  // RPC method name (e.g., "GetProject", "Proxy").
  string rpc_method = 6;

  // HTTP status code from the upstream provider.
  int32 upstream_status = 7;

  // Timing.
  int64 request_epoch_ms = 8;
  int64 response_epoch_ms = 9;
  int64 duration_ms = 10;

  // Provider identity.
  string provider = 11;
}

// GitlabConfigState is the state boundary for gitlab service configuration.
// Auto-injected by tacplus from (spec.grpc_config) annotation.
message GitlabConfigState {

  gitlab.Config config = 1;
}

// ============================================================================
// Auto-generated State Service (tacplus)
// ============================================================================

service GitlabConfigStateService {
	// Singleton: Config
	rpc GetConfig(google.protobuf.Empty) returns (Config);
	rpc SetConfig(Config) returns (Config);
	rpc WatchConfig(google.protobuf.Empty) returns (stream Config);
}

message MapEmpty {}

