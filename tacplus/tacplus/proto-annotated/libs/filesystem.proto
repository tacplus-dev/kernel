// Package filesystem defines a protobuf representation of a filesystem tree.
// Directory is recursive and holds child directories and files. Permission
// models Unix-style owner/group/other read/write/execute bits.

syntax = "proto3";
package filesystem;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.libs.filesystem";

import "libs/spec.proto";

// Permission represents Unix-style file permissions (e.g., 755).
// Each field is a 3-bit mask: read (4) + write (2) + execute (1).
message Permission {
  // owner permission bits (0-7)
  uint32 owner = 1 [(spec.assert_ge) = 0, (spec.assert_le) = 7];
  // group permission bits (0-7)
  uint32 group = 2 [(spec.assert_ge) = 0, (spec.assert_le) = 7];
  // other permission bits (0-7)
  uint32 other = 3 [(spec.assert_ge) = 0, (spec.assert_le) = 7];
}

// File represents a single file with permissions and content.
message File {
  // name is the file name (not a path)
  string name = 1 [(spec.assert_required) = true, (spec.assert_max_length) = 255];
  // permission is the Unix-style permission for this file
  Permission permission = 2;
  // content is the raw file content (max 10 MB)
  bytes content = 3 [(spec.assert_max_size) = 10485760];
}

// Directory represents a directory node in a filesystem tree.
// Directories are recursive — each may contain child directories and files.
message Directory {
  // name is the directory name (not a path)
  string name = 1 [(spec.assert_required) = true, (spec.assert_max_length) = 255];
  // permission is the Unix-style permission for this directory
  Permission permission = 2;
  // directories holds zero or more child directories
  repeated Directory directories = 3 [(spec.assert_max_size) = 10000];
  // files holds zero or more files in this directory
  repeated File files = 4 [(spec.assert_max_size) = 10000];
}

// ============================================================================
// Generated Proto Registry IDs
// Auto-injected by tacplus for shared type/RPC identifiers.
// ============================================================================
enum TypeID {
  TYPE_ID_UNSPECIFIED = 0;
  TYPE_ID_PERMISSION = 1;
  TYPE_ID_FILE = 2;
  TYPE_ID_DIRECTORY = 3;
}
