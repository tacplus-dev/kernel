// Package healthreport defines the ServiceInstanceHealth model published by
// each running service instance. Fleetwood aggregates these reports to build
// a real-time fleet dashboard showing health, load, and reachability across
// all deployed instances.

syntax = "proto3";
package healthreport;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.libs.healthreport";

import "libs/spec.proto";
import "libs/host.proto";

// InstanceStatus represents the health status of a service instance.
enum InstanceStatus {
  INSTANCE_STATUS_STARTING = 0;
  INSTANCE_STATUS_HEALTHY = 1;
  INSTANCE_STATUS_DEGRADED = 2;
  INSTANCE_STATUS_DRAINING = 3;
  INSTANCE_STATUS_UNHEALTHY = 4;
}

// ServiceInstanceHealth captures the health, load, and reachability of a
// single running instance of a microservice. The composite key
// "service_id@instance_id" is set by the server from the caller's token claims.
message ServiceInstanceHealth {
  // Composite key: "service:fleetwood@uuid" — set by server from token claims
  string id = 1 [(spec.indexed) = true, (spec.assert_max_length) = 256];
  string service_id = 2 [(spec.assert_max_length) = 128];     // from token sub
  string instance_id = 3 [(spec.assert_max_length) = 128];    // from token instance_id

  // Reachability
  host.Host grpc_endpoint = 4;
  host.Host http_endpoint = 5;

  // Health
  InstanceStatus status = 6 [(spec.assert_enum_defined) = true];
  string status_message = 7 [(spec.assert_max_length) = 1024];

  // Load (auto-collected from runtime)
  double cpu_usage = 8 [(spec.assert_float) = {ge: 0.0, le: 100.0}];
  int64 memory_used_bytes = 9 [(spec.assert_ge) = 0];
  int64 memory_max_bytes = 10 [(spec.assert_ge) = 0];

  // Load (from grpcserver metrics)
  int32 active_requests = 11 [(spec.assert_ge) = 0];
  int32 max_concurrent_requests = 12 [(spec.assert_ge) = 0];
  double request_rate = 13 [(spec.assert_float) = {ge: 0.0}];

  // Performance (from grpcserver metrics)
  int64 p50_latency_us = 14 [(spec.assert_ge) = 0];
  int64 p99_latency_us = 15 [(spec.assert_ge) = 0];
  double error_rate = 16 [(spec.assert_float) = {ge: 0.0, le: 1.0}];

  // Routing metadata
  string version = 17 [(spec.assert_max_length) = 64];
  map<string, string> labels = 18 [(spec.assert_max_size) = 32];

  // Timestamps
  int64 started_at_ms = 19 [(spec.assert_ge) = 0];
  int64 timestamp_ms = 20 [(spec.assert_ge) = 0];
}

// ============================================================================
// Generated Proto Registry IDs
// Auto-injected by tacplus for shared type/RPC identifiers.
// ============================================================================
enum TypeID {
  TYPE_ID_UNSPECIFIED = 0;
  TYPE_ID_SERVICE_INSTANCE_HEALTH = 1;
}
