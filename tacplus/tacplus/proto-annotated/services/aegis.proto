// ============================================================================
// Declared Queries
// ============================================================================

// EntityQueries declares typed queries against the Entity BigData type.
message EntityQueries {
  option (spec.queries) = {target: "Entity"};

  string by_type = 1 [(spec.sql) =
    "SELECT * FROM Entity WHERE entity_type = :entity_type AND last_seen_ms BETWEEN :from_ms AND :to_ms"];

  string by_parent = 2 [(spec.sql) =
    "SELECT * FROM Entity WHERE parent_id = :parent_id"];

  string neighbors = 3 [(spec.sql) =
    "SELECT e.* FROM Entity e JOIN Edge ed ON e.id = ed.target_id WHERE ed.source_id = :entity_id"];
}

// EdgeQueries declares typed queries against the Edge BigData type.
message EdgeQueries {
  option (spec.queries) = {target: "Edge"};

  string by_source = 1 [(spec.sql) =
    "SELECT * FROM Edge WHERE source_id = :source_id AND last_seen_ms BETWEEN :from_ms AND :to_ms"];

  string by_target = 2 [(spec.sql) =
    "SELECT * FROM Edge WHERE target_id = :target_id"];

  string by_type = 3 [(spec.sql) =
    "SELECT * FROM Edge WHERE edge_type = :edge_type AND last_seen_ms BETWEEN :from_ms AND :to_ms"];
}

// TokenQueries declares typed queries against the TokenObservation BigData type.
message TokenQueries {
  option (spec.queries) = {target: "TokenObservation"};

  string by_subject = 1 [(spec.sql) =
    "SELECT * FROM TokenObservation WHERE subject = :subject AND observed_at_ms BETWEEN :from_ms AND :to_ms"];

  string by_trace = 2 [(spec.sql) =
    "SELECT * FROM TokenObservation WHERE trace_id = :trace_id"];

  string rejections = 3 [(spec.sql) =
    "SELECT * FROM TokenObservation WHERE result != 1 AND observed_at_ms BETWEEN :from_ms AND :to_ms"];
}

// ConversationQueries declares typed queries against the ConversationStep BigData type.
message ConversationQueries {
  option (spec.queries) = {target: "ConversationStep"};

  string by_session = 1 [(spec.sql) =
    "SELECT * FROM ConversationStep WHERE session_id = :session_id ORDER BY timestamp_ms ASC"];

  string by_agent = 2 [(spec.sql) =
    "SELECT * FROM ConversationStep WHERE agent_id = :agent_id AND timestamp_ms BETWEEN :from_ms AND :to_ms"];

  string tool_calls = 3 [(spec.sql) =
    "SELECT * FROM ConversationStep WHERE event_type = 3 AND agent_id = :agent_id AND timestamp_ms BETWEEN :from_ms AND :to_ms"];
}

// ActionQueries declares typed queries against the ActionStep BigData type.
message ActionQueries {
  option (spec.queries) = {target: "ActionStep"};

  string by_resource = 1 [(spec.sql) =
    "SELECT * FROM ActionStep WHERE target_resource = :resource AND executed_at_ms BETWEEN :from_ms AND :to_ms"];

  string by_type = 2 [(spec.sql) =
    "SELECT * FROM ActionStep WHERE action_type = :action_type AND executed_at_ms BETWEEN :from_ms AND :to_ms"];

  string failures = 3 [(spec.sql) =
    "SELECT * FROM ActionStep WHERE success = false AND executed_at_ms BETWEEN :from_ms AND :to_ms"];
}

// AlertQueries declares typed queries against the Alert BigData type.
message AlertQueries {
  option (spec.queries) = {target: "Alert"};

  string by_severity = 1 [(spec.sql) =
    "SELECT * FROM Alert WHERE severity = :severity"];

  string by_rule = 2 [(spec.sql) =
    "SELECT * FROM Alert WHERE rule_id = :rule_id"];
}

// ============================================================================
// State — Aegis is now a client-only service. Event ingestion goes through
// EventBus typed RPCs. Read/query RPCs are on BigDataService.
// AegisState is retained because DgraphState subscribes to event_stream.
// ============================================================================

message AegisState {
  option (spec.service_state) = {name: "AegisState", tag: "eventbus"};
  // Fields 1-5 are reserved for tacplus framework use.

  TopologyEvent event_stream = 6 [(spec.topic) = true, (spec.leader) = true];
}

// AegisConfigState is the state boundary for aegis service configuration.
// Auto-injected by tacplus from (spec.grpc_config) annotation.
message AegisConfigState {
  option (spec.service_state) = {name: "AegisConfigState", store: "kernel"};
  option (spec.state_consistency) = CONSISTENCY_CONVERGENT;

  // Fields 1-5 are reserved for tacplus framework use.

  aegis.Config config = 6 [
    (spec.consistency) = CONSISTENCY_CONVERGENT,
    (spec.persistence) = true
  ];
}

// ============================================================================
// Auto-generated State Service (tacplus)
// ============================================================================

service AegisStateService {
	// Topic: EventStream
	rpc PublishToEventStream(TopologyEvent) returns (TopicPublishReceipt);
	rpc SubscribeToEventStream(google.protobuf.Empty) returns (stream TopologyEvent);
	// Leader Election: EventStream
	rpc ElectEventStreamLeader(LeaderElectRequest) returns (LeaderRecord);
	rpc ResignEventStreamLeader(LeaderResignRequest) returns (LeaderRecord);
	rpc GetLeaderEventStream(google.protobuf.Empty) returns (LeaderRecord);
	rpc WatchLeaderEventStream(google.protobuf.Empty) returns (stream LeaderRecord);
	rpc RenewLeaseEventStream(stream LeaderLeaseRenewal) returns (stream LeaderRecord);
}


// ============================================================================
// Auto-generated State Service (tacplus)
// ============================================================================

service AegisConfigStateService {
	// Singleton: Config
	rpc GetConfig(google.protobuf.Empty) returns (Config);
	rpc SetConfig(Config) returns (Config);
	rpc WatchConfig(google.protobuf.Empty) returns (stream Config);
}

message MapEmpty {}

message TopicPublishReceipt { bool published = 1; }

message LeaderRecord { string leader_id = 1; int64 fence_token = 2; int64 lease_expiry_ms = 3; int64 term = 4; }
message LeaderElectRequest { string candidate_id = 1; }
message LeaderResignRequest { string leader_id = 1; int64 fence_token = 2; }
message LeaderLeaseRenewal { string leader_id = 1; int64 fence_token = 2; }


