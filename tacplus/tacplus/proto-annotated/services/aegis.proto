// Aegis — Agentic topology visualization, postmortem analysis, and simulation.
//
// ╔══════════════════════════════════════════════════════════════════════════╗
// ║                        DESIGN PHILOSOPHY                                 ║
// ╚══════════════════════════════════════════════════════════════════════════╝
//
// Aegis is a "flight recorder for agentic workloads." The core insight
// is postmortem-first: record everything, reconstruct the graph, assign cause,
// then write regression rules. The system is NOT a monitoring dashboard — it
// is a forensic tool that happens to have a real-time view.
//
// ── WHY TOKENS ARE THE TELEMETRY ──
//
// Traditional observability polls services for health or scrapes metrics
// endpoints. We do neither. Instead, every service in the control plane
// already validates OAuth tokens on every RPC. Those tokens contain rich
// claims: who the caller is (sub), what service they're calling (aud),
// what they're allowed to do (entitlements), who delegated authority to
// them (delegation_chain), and what framework they're running
// (client_component). By capturing the claims (stripping the signature),
// we get the ENTIRE topology for free — no additional instrumentation,
// no service mesh sidecars, no polling loops.
//
// A single observed token tells us:
//   - sub → the agent identity → creates an AGENT entity
//   - aud → the target service → creates an MCP_SERVER entity
//   - sub + aud → creates a SESSION edge between them
//   - delegation_chain[0] → the human at the root → creates a USER entity
//   - delegation_chain[0] → sub → creates an OWNS edge
//   - delegation_chain[i] → chain[i+1] → creates DELEGATION edges
//   - observer_host_id → creates a HOST entity + HOSTED_ON edge
//   - client_component → enriches the agent's framework metadata
//   - entitlements → what methods this agent is authorized to call
//   - result (accepted/rejected) → security posture signal
//
// This means the graph is DERIVED, not declared. No service registry,
// no config file listing "these agents exist." If a token shows up with
// a new sub we haven't seen, a new entity appears. If tokens stop
// arriving, the entity goes stale (grayed out after stale_entity_seconds).
//
// ── WHY MCP CONVERSATION EVENTS ARE THE SECOND STREAM ──
//
// Tokens tell us the topology (who talks to whom) but not the content
// (what they talked about). MCP conversation events fill this gap by
// capturing the actual prompt → LLM → tool calls → response flow.
//
// This second stream is essential for:
//   1. TOOL VISIBILITY — seeing which tools the LLM chose to call, what
//      inputs it provided, what outputs it received, and how long each
//      tool execution took. Without this, tool calls are invisible.
//   2. TIME SCRUBBING — replaying a conversation turn-by-turn to understand
//      what happened. The UI provides a scrubber that advances through
//      ConversationTurns, lighting up edges as each event fires.
//   3. COST TRACKING — token counts AND estimated costs per LLM call,
//      aggregated per agent, per user, per model. Answers "what did this
//      misbehavior cost us?"
//   4. POSTMORTEM — when an agent misbehaves, you can replay the exact
//      sequence: what was the prompt? What tools did the LLM call? Did a
//      tool fail? Did the LLM hallucinate the tool result?
//
// ── THIRD STREAM: ACTIONS (SIDE EFFECTS) ──
//
// Tool calls and tool results capture the mechanics, but not the real-world
// consequences. A tool result of "file written successfully" doesn't capture
// WHAT file, WHERE, or whether it was reversible. Actions are the bridge:
//   - file written → action on resource "file:///etc/nginx/nginx.conf"
//   - deployment triggered → action on resource "k8s://prod/deploy/api"
//   - git commit created → action on resource "git://repo/main/abc123"
//   - ticket updated → action on resource "jira://PROJ-182"
//
// Actions are first-class events with approval semantics (planned → approved
// → executed → confirmed/reverted), resource identity, and rollback
// references. This is critical for forensics: "this config change that
// broke production was caused by which prompt, which model decision, and
// who approved it?"
//
// ── CAUSAL MODEL ──
//
// For forensics you need to trace causality across streams:
//   "this filesystem change was caused by which prompt and which model decision?"
//
// We use distributed tracing semantics (trace_id, span_id, parent_span_id)
// on both token observations and conversation events. A single user request
// may fan out into multiple MCP sessions, multiple LLM calls, multiple tools,
// and multiple agents. session_id alone is too local.
//
// Span hierarchy:
//   trace_id = entire causal chain from user prompt to final result
//   prompt received → span
//   llm request → child span
//   tool call → child span
//   action executed → child span of tool call
//   external API call → child span of action
//
// ── COMPACT vs LOGICAL VIEW ──
//
// In reality, an MCP server plays two roles in a conversation:
//   1. It RECEIVES prompts from agents and SENDS responses back
//   2. It EXECUTES tools when the LLM calls back to it
//
// In compact view (GRAPH_DENSITY_COMPACT), the MCP server is one node,
// and edges go in/out of it in both directions. This is accurate but
// creates a "star" pattern that's hard to follow linearly.
//
// In logical view (GRAPH_DENSITY_LOGICAL), the MCP server splits into
// two visual nodes with the SAME COLOR to indicate they're the same
// physical entity:
//   - MCP(prompt-handler): receives prompts from agents, forwards to LLM
//   - MCP(tool-executor): receives tool calls from LLM, executes, returns
//
// This makes the flow read linearly left-to-right:
//   User → Agent → MCP(prompt) → LLM → MCP(tool) → [execute] → back to LLM → MCP(prompt) → Agent
//
// IMPORTANT: Logical-density split is a VIEW CONCERN, not a physical graph
// concern. The canonical physical graph always has one entity per physical
// server. The visual projection layer creates the split nodes with
// physical_entity_id pointing back to the canonical entity. GraphEdge.id
// is canonically derived from (source_id, target_id, edge_type) so that
// streaming diffs across density modes are consistent.
//
// ── TIME SCRUBBER ──
//
// The conversation trace is structured for time scrubbing:
//   ConversationTurn (one prompt→response cycle)
//     └─ LlmInteraction[] (each round-trip with the LLM)
//          └─ ToolCallWithResult[] (tool calls within that interaction)
//               └─ ActionEvent[] (side effects of each tool call)
//
// The UI scrubber advances through turns. Within each turn, it can
// step through individual LLM interactions. Each step lights up the
// corresponding edges in the graph:
//   - Prompt step: agent→MCP edge lights up
//   - LLM request step: MCP→LLM edge lights up
//   - Tool call step: LLM→MCP(tool) edge lights up
//   - Tool result step: MCP(tool)→LLM edge lights up
//   - Action step: MCP(tool)→Resource edge lights up
//   - Response step: MCP→agent edge lights up
//
// ── VISUALIZATION CLIENTS ──
//
// Two visualization clients consume this data:
//   1. Agate (browser) — D3 tree/graph layout in the web control plane UI
//   2. Aegis (native macOS) — GPU-rendered Bevy app with force-directed
//      layout, pinch-to-zoom, trackpad pan, and real-time topology updates.
//      Uses Metal backend on Apple Silicon for high-performance rendering
//      of large graphs. Supports multiple layout algorithms (force-directed,
//      hierarchical, radial, circular) switchable from a slide-out menu.
//
// Both clients use GetTopology for initial state and WatchTopology for
// live updates. The native app is optimized for operational "terrain"
// visualization where you want to see the full battlespace at once.
//
// ── ENTITY TYPE COLOR CODING (for both clients) ──
//
//   User            → Blue (#4488ff)
//   Agent           → Green (#44ff88)
//   MCP Server      → Orange (#ffaa44)
//   LLM             → Purple (#ff44ff)
//   Host            → Gray (#888888)
//   Resource        → Cyan (#44dddd)
//   External System → Yellow (#dddd44)
//
// ── VIEW PRESETS ──
//
// View presets control which entity types and edge types are emphasized:
//   USER           — the default "who's running what" view
//   INFRASTRUCTURE — ops view: hosts, servers, agents
//   SESSION        — active conversations with stats
//   SECURITY       — delegation chains, entitlements, rejections
//   LLM            — model-centric: which LLMs, who's calling them, cost
//   TOOL           — tool-centric: which tools, usage stats, error rates
//
// ── DERIVED vs OBSERVED ──
//
// Many fields in entity metadata are aggregates (e.g. total_input_tokens,
// avg_latency_ms). Some values may be exact or estimated depending on
// the source. Fields that may be estimates carry a bool estimated flag.
// Token counts from providers are typically exact; cost estimates use
// configured pricing tables and are always estimates.
//
// ============================================================================

syntax = "proto3";

package aegis;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.services.aegis";
option java_outer_classname = "Aegis";

import "libs/spec.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

option (spec.service) = {name: "aegis", id: 17};

// ============================================================================
// Config
// ============================================================================

message Config {
  option (spec.grpc_config) = {service_name: "aegis", id: 17};
  // Fields 1-5 are reserved for tacplus framework use.

  // event_retention_hours is how long observed tokens and conversation events
  // are kept before pruning. Default: 168 (7 days).
  int32 event_retention_hours = 6 [(spec.default_int) = 168, (spec.assert_ge) = 1];

  // max_graph_nodes caps the number of entities returned in a single
  // topology snapshot. Default: 5000.
  int32 max_graph_nodes = 7 [(spec.default_int) = 5000, (spec.assert_ge) = 100];

  // stale_entity_seconds is how long after the last observation an entity
  // is considered stale and grayed out in the UI. Default: 300 (5 min).
  int32 stale_entity_seconds = 8 [(spec.default_int) = 300, (spec.assert_ge) = 30];

  // max_tool_call_payload_bytes caps how much of each tool call's input/output
  // is stored. Larger payloads are truncated. Default: 65536 (64KB).
  int32 max_tool_call_payload_bytes = 9 [(spec.default_int) = 65536, (spec.assert_ge) = 1024];

  // simulation_profiles maps profile names to simulation configurations.
  map<string, SimulationProfile> simulation_profiles = 10 [(spec.assert_max_size) = 16];
}

// ============================================================================
// Simulation (mock-aegis-client)
// ============================================================================

message SimulationProfile {
  string host_id = 1 [(spec.assert_required) = true];
  int32 user_count = 2 [(spec.default_int) = 10, (spec.assert_ge) = 1, (spec.assert_le) = 100];
  int32 agents_per_user = 3 [(spec.default_int) = 4, (spec.assert_ge) = 1, (spec.assert_le) = 20];
  int32 mcp_server_count = 4 [(spec.default_int) = 5, (spec.assert_ge) = 1, (spec.assert_le) = 50];
  double speed = 5 [(spec.default_float) = 1.0, (spec.assert_float) = {gt: 0, le: 1000}];
  double phase_offset = 6 [(spec.assert_float) = {ge: 0, le: 1}];
  int32 batch_interval_ms = 7 [(spec.default_int) = 5000, (spec.assert_ge) = 100];
  string seed = 8;
}

// ============================================================================
// Event Provenance
// ============================================================================

// EventProvenance captures the source and integrity metadata of an event.
message EventProvenance {
  string source_service = 1;
  string source_instance_id = 2;
  string source_version = 3;
  int64 ingested_at_ms = 4;
  int64 clock_skew_ms_estimate = 5;
  CaptureMethod capture_method = 6;
}

enum CaptureMethod {
  CAPTURE_METHOD_UNSPECIFIED = 0;
  CAPTURE_METHOD_OBSERVED = 1;
  CAPTURE_METHOD_RECONSTRUCTED = 2;
  CAPTURE_METHOD_SAMPLED = 3;
  CAPTURE_METHOD_INFERRED = 4;
}

// ============================================================================
// Content Metadata
// ============================================================================

message ContentMeta {
  bool was_truncated = 1;
  int64 original_bytes = 2;
  bool redaction_applied = 3;
  string redaction_policy_id = 4;
  string content_hash = 5;
  DataClassification classification = 6;
}

enum DataClassification {
  DATA_CLASSIFICATION_UNSPECIFIED = 0;
  DATA_CLASSIFICATION_PUBLIC = 1;
  DATA_CLASSIFICATION_INTERNAL = 2;
  DATA_CLASSIFICATION_CONFIDENTIAL = 3;
  DATA_CLASSIFICATION_RESTRICTED = 4;
}

message SensitiveContentFlags {
  bool contains_pii = 1;
  bool contains_secrets = 2;
  bool contains_credentials = 3;
  bool contains_source_code = 4;
  string retention_class = 5;
}

// ============================================================================
// Data Stream 1: Observed Tokens
// ============================================================================

message ObservedToken {
  option (spec.graph_type) = {name: "TokenObservation"};
  option (spec.bigdata) = {name: "TokenObservation", key: "token_id"};

  int64 observed_at_ms = 1 [(spec.graph_index) = "int", (spec.timeseries) = true, (spec.cache) = true];
  string observer_service = 2 [(spec.graph_index) = "exact", (spec.timeseries) = true];
  string observer_host_id = 3 [(spec.cache) = true];

  string trace_id = 4 [(spec.graph_index) = "exact", (spec.timeseries) = true];
  string span_id = 5;
  string parent_span_id = 6;

  string subject = 10 [(spec.graph_index) = "exact", (spec.timeseries) = true, (spec.cache) = true];
  string issuer = 11;
  string audience = 12 [(spec.timeseries) = true, (spec.cache) = true];
  int64 issued_at = 13;
  int64 expires_at = 14;
  string token_id = 15 [(spec.cache) = true];

  string subject_type = 20 [(spec.timeseries) = true];
  repeated string entitlements = 21 [(spec.assert_max_size) = 128];
  repeated string delegation_chain = 22 [(spec.assert_max_size) = 16];
  string client_component = 23 [(spec.cache) = true];
  repeated string profiles = 24 [(spec.assert_max_size) = 64];
  string authorized_party = 25;
  string auth_type = 26 [(spec.timeseries) = true];

  google.protobuf.Struct extra_claims = 30;
  map<string, string> labels = 31 [(spec.assert_max_size) = 64];

  string observed_method = 40 [(spec.timeseries) = true];
  ObservationResult result = 41 [(spec.timeseries) = true, (spec.cache) = true];
  string rejection_reason = 42;

  EventProvenance provenance = 50;
  int32 schema_version = 51;
  string token_format_version = 52 [(spec.archive) = true];
}

enum ObservationResult {
  OBSERVATION_RESULT_UNSPECIFIED = 0;
  OBSERVATION_RESULT_ACCEPTED = 1;
  OBSERVATION_RESULT_REJECTED_EXPIRED = 2;
  OBSERVATION_RESULT_REJECTED_UNAUTHORIZED = 3;
  OBSERVATION_RESULT_REJECTED_INVALID = 4;
  OBSERVATION_RESULT_REJECTED_POLICY_DENIED = 5;
}

// ============================================================================
// Data Stream 2: MCP Conversation Events
// ============================================================================

message McpConversationEvent {
  option (spec.graph_type) = {name: "ConversationStep"};
  option (spec.bigdata) = {name: "ConversationStep", key: "event_id"};

  string event_id = 1 [(spec.graph_index) = "exact", (spec.cache) = true];
  int64 timestamp_ms = 2 [(spec.timeseries) = true, (spec.cache) = true];
  string session_id = 3 [(spec.graph_index) = "exact", (spec.timeseries) = true, (spec.cache) = true];
  int32 turn_number = 4 [(spec.timeseries) = true];
  int32 sequence = 5;
  ConversationEventType event_type = 6 [(spec.timeseries) = true, (spec.cache) = true];

  string trace_id = 7 [(spec.graph_index) = "exact", (spec.timeseries) = true];
  string span_id = 8;
  string parent_span_id = 9;

  string agent_id = 10 [(spec.graph_index) = "exact", (spec.timeseries) = true, (spec.cache) = true];
  string server_id = 11 [(spec.timeseries) = true, (spec.cache) = true];
  string model_id = 12 [(spec.timeseries) = true];
  string user_id = 13 [(spec.timeseries) = true];

  string connection_id = 14;
  string conversation_id = 15;

  // Event payloads — source of truth only (not projected to index stores).
  PromptEvent prompt = 20;
  LlmRequestEvent llm_request = 21;
  ToolCallEvent tool_call = 22;
  ToolResultEvent tool_result = 23;
  LlmResponseEvent llm_response = 24;
  ResponseSentEvent response_sent = 25;
  ErrorEvent error = 26;
  ActionEvent action = 27;

  EventProvenance provenance = 50;
  int32 schema_version = 51;
  string mcp_protocol_version = 52 [(spec.archive) = true];
}

enum ConversationEventType {
  CONVERSATION_EVENT_TYPE_UNSPECIFIED = 0;
  CONVERSATION_EVENT_TYPE_PROMPT_RECEIVED = 1;
  CONVERSATION_EVENT_TYPE_LLM_REQUEST = 2;
  CONVERSATION_EVENT_TYPE_TOOL_CALL = 3;
  CONVERSATION_EVENT_TYPE_TOOL_RESULT = 4;
  CONVERSATION_EVENT_TYPE_LLM_RESPONSE = 5;
  CONVERSATION_EVENT_TYPE_RESPONSE_SENT = 6;
  CONVERSATION_EVENT_TYPE_ERROR = 7;
  CONVERSATION_EVENT_TYPE_ACTION_EXECUTED = 8;
  CONVERSATION_EVENT_TYPE_ACTION_PLANNED = 9;
  CONVERSATION_EVENT_TYPE_ACTION_CONFIRMED = 10;
  CONVERSATION_EVENT_TYPE_ACTION_REVERTED = 11;
}

// ── Event Payloads ──────────────────────────────────────────────────────────

message PromptEvent {
  string prompt_text = 1;
  string system_prompt = 2;
  int32 input_tokens = 3;
  int32 context_message_count = 4;
  ContentMeta prompt_content_meta = 5;
  ContentMeta system_prompt_content_meta = 6;
  SensitiveContentFlags sensitivity = 7;
}

message LlmRequestEvent {
  string model = 1;
  repeated ToolDefinition available_tools = 2 [(spec.assert_max_size) = 256];
  int32 input_tokens = 3;
  double temperature = 4;
  int32 max_tokens = 5;

  string llm_call_id = 10;
  string provider_request_id = 11;
  int32 attempt_number = 12;
  string fallback_from_model = 13;
  bool cache_hit = 14;
  bool streamed = 15;
  string reasoning_effort = 16;
  int32 timeout_ms = 17;
  string provider_region = 18;
  string deployment_id = 19;

  string provider = 20;
  string model_family = 21;
  string model_variant = 22;
  string endpoint = 23;
  string routing_policy = 24;
}

message ToolCallEvent {
  string tool_call_id = 1;
  string tool_name = 2;
  string tool_server = 3;
  string input_json = 4;
  int64 input_bytes = 5;

  string parallel_group_id = 6;
  int32 index_in_group = 7;
  bool is_speculative = 8;
  repeated string depends_on_tool_call_ids = 9 [(spec.assert_max_size) = 16];

  repeated string target_resource_uris = 10 [(spec.assert_max_size) = 32];
  string target_resource_type = 11;

  ContentMeta input_content_meta = 12;
  SensitiveContentFlags sensitivity = 13;

  bool approval_required = 14;
  ApprovalStatus approval_status = 15;
  string approved_by = 16;
  int64 approval_timestamp_ms = 17;
  string policy_rule_id = 18;
}

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_NOT_REQUIRED = 1;
  APPROVAL_STATUS_PENDING = 2;
  APPROVAL_STATUS_APPROVED = 3;
  APPROVAL_STATUS_DENIED = 4;
  APPROVAL_STATUS_AUTO_APPROVED = 5;
  APPROVAL_STATUS_TIMED_OUT = 6;
}

message ToolResultEvent {
  string tool_call_id = 1;
  string tool_name = 2;
  ToolExecutionStatus status = 3;
  string output = 4;
  int64 output_byte_count = 5;
  int64 duration_ms = 6;
  string error_message = 7;

  ContentMeta output_content_meta = 8;
  SensitiveContentFlags sensitivity = 9;

  int64 queued_at_ms = 10;
  int64 started_at_ms = 11;
  int64 ended_at_ms = 12;
}

enum ToolExecutionStatus {
  TOOL_EXECUTION_STATUS_UNSPECIFIED = 0;
  TOOL_EXECUTION_STATUS_QUEUED = 1;
  TOOL_EXECUTION_STATUS_DISPATCHED = 2;
  TOOL_EXECUTION_STATUS_RUNNING = 3;
  TOOL_EXECUTION_STATUS_SUCCEEDED = 4;
  TOOL_EXECUTION_STATUS_FAILED = 5;
  TOOL_EXECUTION_STATUS_TIMED_OUT = 6;
  TOOL_EXECUTION_STATUS_CANCELLED = 7;
  TOOL_EXECUTION_STATUS_POLICY_DENIED = 8;
}

message LlmResponseEvent {
  string response_text = 1;
  bool has_more_tool_calls = 2;
  int32 input_tokens = 3;
  int32 output_tokens = 4;
  string stop_reason = 5;
  string finish_reason_normalized = 6;

  int64 input_cost_micros_usd = 7;
  int64 output_cost_micros_usd = 8;
  bool cost_estimated = 9;

  ContentMeta response_content_meta = 10;
}

message ResponseSentEvent {
  string response_text = 1;
  int32 total_input_tokens = 2;
  int32 total_output_tokens = 3;
  int32 tool_call_count = 4;
  int64 total_duration_ms = 5;

  int64 total_cost_micros_usd = 6;
  bool cost_estimated = 7;

  ContentMeta response_content_meta = 8;
}

message ErrorEvent {
  string stage = 1;
  string message = 2;
  int32 code = 3;
  bool recoverable = 4;
}

// ============================================================================
// Data Stream 3: Actions (Side Effects)
// ============================================================================

message ActionEvent {
  option (spec.graph_type) = {name: "ActionStep"};
  option (spec.bigdata) = {name: "ActionStep", key: "action_id"};

  string action_id = 1 [(spec.graph_index) = "exact", (spec.cache) = true];
  string action_type = 2 [(spec.graph_index) = "exact", (spec.timeseries) = true, (spec.cache) = true];

  string target_resource = 3 [(spec.graph_index) = "exact", (spec.timeseries) = true];
  string target_resource_type = 4 [(spec.timeseries) = true];
  repeated string affected_resource_uris = 5 [(spec.assert_max_size) = 32];

  string requested_by_tool_call_id = 6;
  string caused_by_event_id = 7;

  string approved_by = 8;
  ApprovalStatus approval_status = 9 [(spec.timeseries) = true];
  string policy_rule_id = 10;

  bool success = 11 [(spec.timeseries) = true, (spec.cache) = true];
  bool reversible = 12;
  string rollback_reference = 13;
  string side_effect_summary = 14;
  int64 executed_at_ms = 15 [(spec.timeseries) = true, (spec.cache) = true];
  int64 duration_ms = 16 [(spec.timeseries) = true];
}

message ToolDefinition {
  string name = 1;
  string description = 2;
  string input_schema_json = 3;
  string server = 4;
}

// ============================================================================
// Graph Entity and Edge Types
// ============================================================================

message GraphEntity {
  option (spec.graph_type) = {name: "Entity", xid_field: "id"};
  option (spec.bigdata) = {name: "Entity", key: "id"};

  string id = 1 [(spec.graph_index) = "exact", (spec.cache) = true];
  EntityType entity_type = 2 [(spec.graph_index) = "exact", (spec.timeseries) = true, (spec.cache) = true];
  string display_name = 3 [(spec.graph_index) = "term,fulltext", (spec.cache) = true];
  string parent_id = 4 [(spec.graph_index) = "exact"];
  int64 first_seen_ms = 5 [(spec.graph_index) = "int", (spec.timeseries) = true];
  int64 last_seen_ms = 6 [(spec.graph_index) = "int", (spec.timeseries) = true, (spec.cache) = true];
  int64 observation_count = 7 [(spec.timeseries) = true];

  UserMeta user_meta = 10;
  AgentMeta agent_meta = 11;
  McpServerMeta server_meta = 12;
  LlmMeta llm_meta = 13;
  HostMeta host_meta = 14;
  ResourceMeta resource_meta = 15;
  ExternalSystemMeta external_system_meta = 16;

  EntityRole role = 20;
  string physical_entity_id = 21;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_USER = 1;
  ENTITY_TYPE_AGENT = 2;
  ENTITY_TYPE_MCP_SERVER = 3;
  ENTITY_TYPE_LLM = 4;
  ENTITY_TYPE_HOST = 5;
  ENTITY_TYPE_RESOURCE = 6;
  ENTITY_TYPE_EXTERNAL_SYSTEM = 7;
}

enum EntityRole {
  ENTITY_ROLE_UNIFIED = 0;
  ENTITY_ROLE_PROMPT_HANDLER = 1;
  ENTITY_ROLE_TOOL_EXECUTOR = 2;
}

message GraphEdge {
  option (spec.graph_type) = {name: "Edge", xid_field: "id"};
  option (spec.bigdata) = {name: "Edge", key: "id"};

  string id = 1 [(spec.graph_index) = "exact", (spec.cache) = true];
  string source_id = 2 [(spec.graph_index) = "exact", (spec.timeseries) = true, (spec.cache) = true];
  string target_id = 3 [(spec.graph_index) = "exact", (spec.timeseries) = true, (spec.cache) = true];
  EdgeType edge_type = 4 [(spec.graph_index) = "exact", (spec.timeseries) = true, (spec.cache) = true];

  int64 observation_count = 5 [(spec.timeseries) = true];
  int64 first_seen_ms = 6 [(spec.graph_index) = "int", (spec.timeseries) = true];
  int64 last_seen_ms = 7 [(spec.graph_index) = "int", (spec.timeseries) = true, (spec.cache) = true];
  repeated string observed_methods = 8 [(spec.assert_max_size) = 256];

  SessionEdgeMeta session_meta = 10;
  DelegationEdgeMeta delegation_meta = 11;
  ToolEdgeMeta tool_meta = 12;
  ActionEdgeMeta action_meta = 13;
}

enum EdgeType {
  EDGE_TYPE_UNSPECIFIED = 0;
  EDGE_TYPE_OWNS = 1;
  EDGE_TYPE_SESSION = 2;
  EDGE_TYPE_MODEL_CALL = 3;
  EDGE_TYPE_HOSTED_ON = 4;
  EDGE_TYPE_DELEGATION = 5;
  EDGE_TYPE_TOOL_CALL = 6;
