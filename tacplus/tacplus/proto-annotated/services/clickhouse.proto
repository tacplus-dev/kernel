// ClickHouse — Timeseries projection service.
//
// ClickHouse runs as an off-the-shelf container (clickhouse/clickhouse-server)
// with a Go helper sidecar that handles TLS certs, config from kernel,
// health reporting, and node registration for discovery.
//
// No gRPC RPCs — BigData queries ClickHouse directly over HTTPS.

syntax = "proto3";

package clickhouse;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.services.clickhouse";
option java_outer_classname = "Clickhouse";

import "libs/spec.proto";
import "libs/host.proto";
import "google/protobuf/empty.proto";

option (spec.service) = {name: "clickhouse", id: 20};

// NodeMode determines whether this node runs as Keeper or Data.
enum NodeMode {
  NODE_MODE_UNDEFINED = 0;

  // Keeper: consensus/coordination (replaces ZooKeeper).
  NODE_MODE_KEEPER = 1;

  // Data: data storage, serves queries over HTTPS.
  NODE_MODE_DATA = 2;

  // Combined: runs both Keeper and Data in a single container (dev only).
  NODE_MODE_COMBINED = 3;
}

// ============================================================================
// Config
// ============================================================================

message Config {
  option (spec.grpc_config) = {service_name: "clickhouse", id: 20};
  // Fields 1-5 are reserved for tacplus framework use.

  // retention_days is the ClickHouse materialized view retention. Default: 90.
  int32 retention_days = 6 [(spec.default_int) = 90, (spec.assert_ge) = 1];

  // batch_size is the max rows per insert batch. Default: 10000.
  int32 batch_size = 7 [(spec.default_int) = 10000, (spec.assert_ge) = 1];

  // flush_interval_ms is the max time between flushes. Default: 1000.
  int32 flush_interval_ms = 8 [(spec.default_int) = 1000, (spec.assert_ge) = 100];

  // keeper_count is the expected number of Keeper nodes. Default: 3.
  int32 keeper_count = 9 [(spec.default_int) = 3, (spec.assert_ge) = 1];

  // data_count is the expected number of Data nodes. Default: 1.
  int32 data_count = 10 [(spec.default_int) = 1, (spec.assert_ge) = 1];

  // mode is the role assigned to this node.
  NodeMode mode = 11 [(spec.assert_required) = true];
}

// ============================================================================
// State (stored in kernel)
// ============================================================================

// ClickHouseNode represents a single ClickHouse instance registered for discovery.
message ClickHouseNode {
  // node_id is the unique identifier for this instance.
  string node_id = 1 [(spec.indexed) = true, (spec.assert_required) = true];

  // mode is the role of this node (Keeper or Data).
  NodeMode mode = 2 [(spec.assert_required) = true];

  // endpoint is the HTTPS endpoint for this ClickHouse node.
  host.Host endpoint = 3 [(spec.assert_required) = true];

  // started_at_ms is when this node started.
  int64 started_at_ms = 4;
}

// ClickHouseState holds the shared state for ClickHouse node discovery.
// The helper sidecar writes its ClickHouseNode entry on startup and
// refreshes it periodically. BigData discovers ClickHouse nodes via
// Watch on this collection.
message ClickHouseState {
  option (spec.service_state) = {name: "ClickHouseState", tag: "kernel", auto_tls: TLS_KEY_TYPE_ED25519};
  // Fields 1-5 are reserved for tacplus framework use.

  // nodes is the collection of registered ClickHouse instances.
  // Keyed by node_id, evicted after 120s if not refreshed.
  repeated ClickHouseNode nodes = 6 [
    (spec.eviction_ttl_seconds) = 120,
    (spec.assert_max_size) = 32
  ];
}

// ClickhouseConfigState is the state boundary for clickhouse service configuration.
// Auto-injected by tacplus from (spec.grpc_config) annotation.
message ClickhouseConfigState {
  option (spec.service_state) = {name: "ClickhouseConfigState", store: "kernel"};
  option (spec.state_consistency) = CONSISTENCY_CONVERGENT;

  // Fields 1-5 are reserved for tacplus framework use.

  clickhouse.Config config = 6 [
    (spec.consistency) = CONSISTENCY_CONVERGENT,
    (spec.persistence) = true
  ];
}

// Collection query types (auto-injected)
enum ComparisonOp {
  COMPARISON_OP_UNSPECIFIED = 0;
  COMPARISON_OP_EQ = 1;
  COMPARISON_OP_NE = 2;
  COMPARISON_OP_GT = 3;
  COMPARISON_OP_GE = 4;
  COMPARISON_OP_LT = 5;
  COMPARISON_OP_LE = 6;
  COMPARISON_OP_IN = 7;
  COMPARISON_OP_NOT_IN = 8;
  COMPARISON_OP_LIKE = 9;
  COMPARISON_OP_IS_NULL = 10;
  COMPARISON_OP_IS_NOT_NULL = 11;
}
enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}
enum LogicalOp {
  LOGICAL_OP_UNSPECIFIED = 0;
  LOGICAL_OP_AND = 1;
  LOGICAL_OP_OR = 2;
}
message QueryValue { oneof value { string string_value = 1; int64 int_value = 2; double double_value = 3; bool bool_value = 4; } }
message Predicate { string field_name = 1; ComparisonOp op = 2; QueryValue value = 3; repeated QueryValue values = 4; }
message PredicateGroup { LogicalOp op = 1; repeated Predicate predicates = 2; repeated PredicateGroup groups = 3; }
message SortField { string field_name = 1; SortDirection direction = 2; }
message CollectionQuery { PredicateGroup where = 1; repeated SortField order_by = 2; int32 limit = 3; int32 offset = 4; }


// ============================================================================
// Auto-generated State Service (tacplus)
// ============================================================================

service ClickHouseStateService {
	// Collection: Nodes
	rpc GetNodes(NodesGetRequest) returns (NodesValueResponse);
	rpc PutNodes(NodesPutRequest) returns (NodesValueResponse);
	rpc SetNodes(NodesPutRequest) returns (MapEmpty);
	rpc RemoveNodes(NodesGetRequest) returns (NodesValueResponse);
	rpc DeleteNodes(NodesGetRequest) returns (MapEmpty);
	rpc ContainsKeyNodes(NodesGetRequest) returns (NodesValueResponse);
	rpc GetAllNodes(NodesGetAllRequest) returns (NodesEntriesResponse);
	rpc KeySetNodes(NodesKeysRequest) returns (NodesKeysResponse);
	rpc SizeNodes(NodesSizeRequest) returns (NodesSizeResponse);
	rpc ClearNodes(NodesClearRequest) returns (MapEmpty);
	rpc PutIfAbsentNodes(NodesPutRequest) returns (NodesValueResponse);
	rpc WatchNodes(google.protobuf.Empty) returns (stream NodesEntriesResponse);
	rpc QueryNodes(NodesQueryRequest) returns (NodesQueryResponse);
	rpc WatchQueryNodes(NodesQueryRequest) returns (stream NodesQueryResponse);
}

message NodesGetRequest { string key = 1; }
message NodesPutRequest { string key = 1; ClickHouseNode value = 2; int64 lock_counter = 3; }
message NodesGetAllRequest {}
message NodesKeysRequest {}
message NodesSizeRequest {}
message NodesClearRequest {}
message NodesValueResponse { ClickHouseNode value = 1; bool found = 2; }
message NodesEntriesResponse { map<string, ClickHouseNode> entries = 1; }
message NodesKeysResponse { repeated string keys = 1; }
message NodesSizeResponse { int32 size = 1; }
message NodesQueryRequest { CollectionQuery query = 1; }
message NodesQueryResponse { repeated ClickHouseNode results = 1; int32 total_count = 2; }


// ============================================================================
// Auto-generated State Service (tacplus)
// ============================================================================

service ClickhouseConfigStateService {
	// Singleton: Config
	rpc GetConfig(google.protobuf.Empty) returns (Config);
	rpc SetConfig(Config) returns (Config);
	rpc WatchConfig(google.protobuf.Empty) returns (stream Config);
}

message MapEmpty {}


