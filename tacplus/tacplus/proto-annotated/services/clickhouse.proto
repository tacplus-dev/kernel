  TYPE_ID_NODES_GET_ALL_REQUEST = 12;
  TYPE_ID_NODES_KEYS_REQUEST = 13;
  TYPE_ID_NODES_SIZE_REQUEST = 14;
  TYPE_ID_NODES_CLEAR_REQUEST = 15;
  TYPE_ID_NODES_VALUE_RESPONSE = 16;
  TYPE_ID_NODES_ENTRIES_RESPONSE = 17;
  TYPE_ID_NODES_KEYS_RESPONSE = 18;
