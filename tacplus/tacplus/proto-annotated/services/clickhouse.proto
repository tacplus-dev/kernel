  CLICK_HOUSE_STATE_SERVICE_RPC_ID_UNSPECIFIED = 0;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_ALL_ACCESSORS = 1;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_ALL_MUTATORS = 2;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_ALL_EXECUTORS = 3;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_GET_NODES = 4;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_PUT_NODES = 5;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_SET_NODES = 6;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_REMOVE_NODES = 7;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_DELETE_NODES = 8;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_CONTAINS_KEY_NODES = 9;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_GET_ALL_NODES = 10;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_KEY_SET_NODES = 11;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_SIZE_NODES = 12;
  CLICK_HOUSE_STATE_SERVICE_RPC_ID_CLEAR_NODES = 13;
