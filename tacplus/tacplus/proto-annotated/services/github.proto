// Copyright (c) 2024 Second Star Cavalier, LLC.

// Package github defines typed representations of the GitHub REST API.
// The github service proxies gRPC requests to the remote GitHub API,
// providing typed request/response handling for common operations and a
// generic fallback proxy for any API endpoint. Every proxied call emits
// a typed audit event via the accounting system.
//
// Design: typed RPCs cover the most common agent workflows (issues, PRs,
// content, branches, search). The generic Proxy RPC handles any endpoint
// not yet typed. The service implementation logs when the generic fallback
// is used, signaling a coverage gap for future typed RPC addition.

syntax = "proto3";

package github;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.services.github";
option java_outer_classname = "Github";

import "libs/http.proto";
import "libs/spec.proto";
import "google/protobuf/empty.proto";

option (spec.service) = {name: "github", id: 23};

// API constants.
option (spec.string_const) = { name: "API_BASE_URL" value: "https://api.github.com" };
option (spec.string_const) = { name: "API_VERSION_HEADER" value: "X-GitHub-Api-Version" };
option (spec.string_const) = { name: "API_VERSION" value: "2022-11-28" };
option (spec.string_const) = { name: "AUTH_HEADER" value: "Authorization" };
option (spec.string_const) = { name: "ACCEPT_HEADER_VALUE" value: "application/vnd.github+json" };

// ============================================================================
// Config
// ============================================================================

message Config {
  option (spec.grpc_config) = {service_name: "github", id: 23};
  // Fields 1-5 are reserved for tacplus framework use.

  // api_token is the API token for authenticating with the GitHub API.
  // Supports personal access tokens (classic and fine-grained), OAuth tokens,
  // and GitHub App installation tokens.
  string api_token = 6 [(spec.assert_required) = true];
}

// ============================================================================
// GitHub-Specific Metadata
// ============================================================================

message RateLimitInfo {
  int32 limit = 1 [(spec.assert_ge) = 0];
  int32 remaining = 2 [(spec.assert_ge) = 0];
  int32 used = 3 [(spec.assert_ge) = 0];
  int64 reset = 4 [(spec.assert_ge) = 0];  // Unix epoch seconds
}

message PaginationInfo {
  int32 page = 1 [(spec.assert_ge) = 0];
  int32 per_page = 2 [(spec.assert_ge) = 0];
  bool has_next_page = 3;
  string next_page_url = 4 [(spec.assert_max_length) = 2048];
}

// ============================================================================
// Resource Types
// ============================================================================

message User {
  int64 id = 1;
  string login = 2 [(spec.assert_max_length) = 256];
  string avatar_url = 3 [(spec.assert_max_length) = 2048];
  string html_url = 4 [(spec.assert_max_length) = 2048];
  string type = 5 [(spec.assert_max_length) = 32];  // "User", "Organization", "Bot"
}

message Repository {
  int64 id = 1;
  string name = 2 [(spec.assert_max_length) = 256];
  string full_name = 3 [(spec.assert_max_length) = 512];
  bool private = 4;
  User owner = 5;
  string html_url = 6 [(spec.assert_max_length) = 2048];
  string description = 7 [(spec.assert_max_length) = 4096];
  bool fork = 8;
  string default_branch = 9 [(spec.assert_max_length) = 256];
  string language = 10 [(spec.assert_max_length) = 128];
  int32 forks_count = 11 [(spec.assert_ge) = 0];
  int32 stargazers_count = 12 [(spec.assert_ge) = 0];
  int32 open_issues_count = 13 [(spec.assert_ge) = 0];
  bool archived = 14;
  string visibility = 15 [(spec.assert_max_length) = 32];
  string created_at = 16 [(spec.assert_max_length) = 64];
  string updated_at = 17 [(spec.assert_max_length) = 64];
  string pushed_at = 18 [(spec.assert_max_length) = 64];
  repeated string topics = 19 [(spec.assert_max_size) = 64];
  string clone_url = 20 [(spec.assert_max_length) = 2048];
  string ssh_url = 21 [(spec.assert_max_length) = 2048];
}

message Label {
  int64 id = 1;
  string name = 2 [(spec.assert_max_length) = 256];
  string color = 3 [(spec.assert_max_length) = 16];
  string description = 4 [(spec.assert_max_length) = 1024];
}

message Milestone {
  int64 id = 1;
  int32 number = 2;
  string title = 3 [(spec.assert_max_length) = 256];
  string description = 4 [(spec.assert_max_length) = 4096];
  string state = 5 [(spec.assert_max_length) = 16];
  int32 open_issues = 6 [(spec.assert_ge) = 0];
  int32 closed_issues = 7 [(spec.assert_ge) = 0];
  string due_on = 8 [(spec.assert_max_length) = 64];
}

message Issue {
  int64 id = 1;
  int32 number = 2;
  string title = 3 [(spec.assert_max_length) = 1024];
  string body = 4 [(spec.assert_max_length) = 262144];
  string state = 5 [(spec.assert_max_length) = 16];  // "open", "closed"
  User user = 6;
  repeated Label labels = 7 [(spec.assert_max_size) = 128];
  User assignee = 8;
  repeated User assignees = 9 [(spec.assert_max_size) = 32];
  Milestone milestone = 10;
  string html_url = 11 [(spec.assert_max_length) = 2048];
  int32 comments = 12 [(spec.assert_ge) = 0];
  bool locked = 13;
  string created_at = 14 [(spec.assert_max_length) = 64];
  string updated_at = 15 [(spec.assert_max_length) = 64];
  string closed_at = 16 [(spec.assert_max_length) = 64];
  string state_reason = 17 [(spec.assert_max_length) = 32];  // completed, not_planned, reopened
}

message BranchRef {
  string ref = 1 [(spec.assert_max_length) = 256];
  string sha = 2 [(spec.assert_max_length) = 64];
  string label = 3 [(spec.assert_max_length) = 512];
  Repository repo = 4;
}

message PullRequest {
  int64 id = 1;
  int32 number = 2;
  string title = 3 [(spec.assert_max_length) = 1024];
  string body = 4 [(spec.assert_max_length) = 262144];
  string state = 5 [(spec.assert_max_length) = 16];
  User user = 6;
  repeated Label labels = 7 [(spec.assert_max_size) = 128];
  string html_url = 8 [(spec.assert_max_length) = 2048];
  BranchRef head = 9;
  BranchRef base = 10;
  bool merged = 11;
  bool mergeable = 12;
  string merge_commit_sha = 13 [(spec.assert_max_length) = 64];
  bool draft = 14;
  int32 commits = 15 [(spec.assert_ge) = 0];
  int32 additions = 16 [(spec.assert_ge) = 0];
  int32 deletions = 17 [(spec.assert_ge) = 0];
  int32 changed_files = 18 [(spec.assert_ge) = 0];
  string created_at = 19 [(spec.assert_max_length) = 64];
  string updated_at = 20 [(spec.assert_max_length) = 64];
  string closed_at = 21 [(spec.assert_max_length) = 64];
  string merged_at = 22 [(spec.assert_max_length) = 64];
  User merged_by = 23;
  repeated User requested_reviewers = 24 [(spec.assert_max_size) = 32];
}

message Comment {
  int64 id = 1;
  string body = 2 [(spec.assert_max_length) = 262144];
  User user = 3;
  string html_url = 4 [(spec.assert_max_length) = 2048];
  string created_at = 5 [(spec.assert_max_length) = 64];
  string updated_at = 6 [(spec.assert_max_length) = 64];
}

message Branch {
  string name = 1 [(spec.assert_max_length) = 256];
  CommitRef commit = 2;
  bool protected = 3;
}

message CommitRef {
  string sha = 1 [(spec.assert_max_length) = 64];
  string url = 2 [(spec.assert_max_length) = 2048];
}

message Commit {
  string sha = 1 [(spec.assert_max_length) = 64];
  CommitDetail commit = 2;
  User author = 3;
  User committer = 4;
  string html_url = 5 [(spec.assert_max_length) = 2048];
}

message CommitDetail {
  string message = 1 [(spec.assert_max_length) = 262144];
  CommitActor author = 2;
  CommitActor committer = 3;
}

message CommitActor {
  string name = 1 [(spec.assert_max_length) = 256];
  string email = 2 [(spec.assert_max_length) = 256];
  string date = 3 [(spec.assert_max_length) = 64];
}

message FileContent {
  string type = 1 [(spec.assert_max_length) = 32];        // "file", "dir", "symlink", "submodule"
  string encoding = 2 [(spec.assert_max_length) = 16];    // "base64"
  int64 size = 3 [(spec.assert_ge) = 0];
  string name = 4 [(spec.assert_max_length) = 512];
  string path = 5 [(spec.assert_max_length) = 2048];
  string content = 6 [(spec.assert_max_length) = 10485760];  // base64-encoded, up to ~7.5MB decoded
  string sha = 7 [(spec.assert_max_length) = 64];
  string html_url = 8 [(spec.assert_max_length) = 2048];
  string download_url = 9 [(spec.assert_max_length) = 2048];
}

message Review {
  int64 id = 1;
  User user = 2;
  string body = 3 [(spec.assert_max_length) = 262144];
  string state = 4 [(spec.assert_max_length) = 32];  // APPROVED, CHANGES_REQUESTED, COMMENTED, DISMISSED, PENDING
  string html_url = 5 [(spec.assert_max_length) = 2048];
  string submitted_at = 6 [(spec.assert_max_length) = 64];
}

message PullRequestFile {
  string sha = 1 [(spec.assert_max_length) = 64];
  string filename = 2 [(spec.assert_max_length) = 2048];
  string status = 3 [(spec.assert_max_length) = 32];  // added, removed, modified, renamed, copied, changed, unchanged
  int32 additions = 4 [(spec.assert_ge) = 0];
  int32 deletions = 5 [(spec.assert_ge) = 0];
  int32 changes = 6 [(spec.assert_ge) = 0];
  string patch = 7 [(spec.assert_max_length) = 1048576];
  string previous_filename = 8 [(spec.assert_max_length) = 2048];
}

message GitReference {
  string ref = 1 [(spec.assert_max_length) = 512];
  string node_id = 2 [(spec.assert_max_length) = 256];
  string url = 3 [(spec.assert_max_length) = 2048];
  GitObject object = 4;
}

message GitObject {
  string type = 1 [(spec.assert_max_length) = 16];  // "commit", "tree", "blob", "tag"
  string sha = 2 [(spec.assert_max_length) = 64];
  string url = 3 [(spec.assert_max_length) = 2048];
}

message FileCommitInfo {
  string sha = 1 [(spec.assert_max_length) = 64];
  string message = 2 [(spec.assert_max_length) = 4096];
  string html_url = 3 [(spec.assert_max_length) = 2048];
}

message SearchCodeResult {
  string name = 1 [(spec.assert_max_length) = 512];
  string path = 2 [(spec.assert_max_length) = 2048];
  string sha = 3 [(spec.assert_max_length) = 64];
  string html_url = 4 [(spec.assert_max_length) = 2048];
  Repository repository = 5;
}

enum MergeMethod {
  MERGE_METHOD_UNSPECIFIED = 0;
  MERGE_METHOD_MERGE = 1 [(spec.json_return_value) = "merge"];
  MERGE_METHOD_SQUASH = 2 [(spec.json_return_value) = "squash"];
  MERGE_METHOD_REBASE = 3 [(spec.json_return_value) = "rebase"];
}

// ============================================================================
// Repository Requests / Responses
// ============================================================================

message GetRepositoryRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
}

message GetRepositoryResponse {
  Repository repository = 1;
  RateLimitInfo rate_limit = 2;
}

// ============================================================================
// Issue Requests / Responses
// ============================================================================

message ListIssuesRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string state = 4 [(spec.assert_max_length) = 16];      // open, closed, all
  string sort = 5 [(spec.assert_max_length) = 16];       // created, updated, comments
  string direction = 6 [(spec.assert_max_length) = 8];   // asc, desc
  repeated string labels = 7 [(spec.assert_max_size) = 32, (spec.assert_max_length) = 256];
  string assignee = 8 [(spec.assert_max_length) = 256];
  string since = 9 [(spec.assert_max_length) = 64];      // ISO 8601 timestamp
  int32 page = 10 [(spec.assert_ge) = 0];
  int32 per_page = 11 [(spec.assert_ge) = 0, (spec.assert_le) = 100];
}

message ListIssuesResponse {
  repeated Issue issues = 1 [(spec.assert_max_size) = 100];
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

message GetIssueRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  int32 issue_number = 4 [(spec.assert_ge) = 1];
}

message GetIssueResponse {
  Issue issue = 1;
  RateLimitInfo rate_limit = 2;
}

message CreateIssueRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string title = 4 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 1024];
  string body = 5 [(spec.assert_max_length) = 262144];
  repeated string assignees = 6 [(spec.assert_max_size) = 32, (spec.assert_max_length) = 256];
  repeated string labels = 7 [(spec.assert_max_size) = 32, (spec.assert_max_length) = 256];
  int32 milestone = 8 [(spec.assert_ge) = 0];
}

message CreateIssueResponse {
  Issue issue = 1;
  RateLimitInfo rate_limit = 2;
}

message UpdateIssueRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  int32 issue_number = 4 [(spec.assert_ge) = 1];
  string title = 5 [(spec.assert_max_length) = 1024];
  string body = 6 [(spec.assert_max_length) = 262144];
  string state = 7 [(spec.assert_max_length) = 16];      // open, closed
  repeated string assignees = 8 [(spec.assert_max_size) = 32, (spec.assert_max_length) = 256];
  repeated string labels = 9 [(spec.assert_max_size) = 32, (spec.assert_max_length) = 256];
  int32 milestone = 10 [(spec.assert_ge) = 0];
  string state_reason = 11 [(spec.assert_max_length) = 32];  // completed, not_planned, reopened
}

message UpdateIssueResponse {
  Issue issue = 1;
  RateLimitInfo rate_limit = 2;
}

message CreateIssueCommentRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  int32 issue_number = 4 [(spec.assert_ge) = 1];
  string body = 5 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 262144];
}

message CreateIssueCommentResponse {
  Comment comment = 1;
  RateLimitInfo rate_limit = 2;
}

// ============================================================================
// Pull Request Requests / Responses
// ============================================================================

message ListPullRequestsRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string state = 4 [(spec.assert_max_length) = 16];      // open, closed, all
  string sort = 5 [(spec.assert_max_length) = 16];       // created, updated, popularity, long-running
  string direction = 6 [(spec.assert_max_length) = 8];   // asc, desc
  string head = 7 [(spec.assert_max_length) = 512];      // Filter by head user:ref-name or ref-name
  string base = 8 [(spec.assert_max_length) = 256];      // Filter by base branch
  int32 page = 9 [(spec.assert_ge) = 0];
  int32 per_page = 10 [(spec.assert_ge) = 0, (spec.assert_le) = 100];
}

message ListPullRequestsResponse {
  repeated PullRequest pull_requests = 1 [(spec.assert_max_size) = 100];
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

message GetPullRequestRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  int32 pull_number = 4 [(spec.assert_ge) = 1];
}

message GetPullRequestResponse {
  PullRequest pull_request = 1;
  RateLimitInfo rate_limit = 2;
}

message CreatePullRequestRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string title = 4 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 1024];
  string body = 5 [(spec.assert_max_length) = 262144];
  string head = 6 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];  // Branch to merge from
  string base = 7 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];  // Branch to merge into
  bool draft = 8;
  bool maintainer_can_modify = 9;
}

message CreatePullRequestResponse {
  PullRequest pull_request = 1;
  RateLimitInfo rate_limit = 2;
}

message MergePullRequestRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  int32 pull_number = 4 [(spec.assert_ge) = 1];
  string commit_title = 5 [(spec.assert_max_length) = 1024];
  string commit_message = 6 [(spec.assert_max_length) = 262144];
  MergeMethod merge_method = 7 [(spec.assert_enum_defined) = true];
  string sha = 8 [(spec.assert_max_length) = 64];  // SHA that head must match (prevents race)
}

message MergePullRequestResponse {
  string sha = 1 [(spec.assert_max_length) = 64];
  bool merged = 2;
  string message = 3 [(spec.assert_max_length) = 4096];
  RateLimitInfo rate_limit = 4;
}

message ListPullRequestFilesRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  int32 pull_number = 4 [(spec.assert_ge) = 1];
  int32 page = 5 [(spec.assert_ge) = 0];
  int32 per_page = 6 [(spec.assert_ge) = 0, (spec.assert_le) = 100];
}

message ListPullRequestFilesResponse {
  repeated PullRequestFile files = 1 [(spec.assert_max_size) = 3000];
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

// ============================================================================
// Content Requests / Responses
// ============================================================================

message GetContentRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string path = 4 [(spec.assert_required) = true, (spec.assert_max_length) = 2048];
  string ref = 5 [(spec.assert_max_length) = 256];  // branch, tag, or commit SHA
}

message GetContentResponse {
  // For files, file is populated. For directories, entries is populated.
  FileContent file = 1;
  repeated FileContent entries = 2 [(spec.assert_max_size) = 1000];
  RateLimitInfo rate_limit = 3;
}

message CreateOrUpdateFileRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string path = 4 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 2048];
  string message = 5 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 4096];  // commit message
  string content = 6 [(spec.assert_required) = true, (spec.assert_max_length) = 10485760];  // base64-encoded file content
  string sha = 7 [(spec.assert_max_length) = 64];         // required for updates (SHA of file being replaced)
  string branch = 8 [(spec.assert_max_length) = 256];     // target branch
  CommitActor committer = 9;
  CommitActor author = 10;
}

message CreateOrUpdateFileResponse {
  FileContent content = 1;
  FileCommitInfo commit = 2;
  RateLimitInfo rate_limit = 3;
}

// ============================================================================
// Branch Requests / Responses
// ============================================================================

message ListBranchesRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  int32 page = 4 [(spec.assert_ge) = 0];
  int32 per_page = 5 [(spec.assert_ge) = 0, (spec.assert_le) = 100];
}

message ListBranchesResponse {
  repeated Branch branches = 1 [(spec.assert_max_size) = 100];
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

// CreateBranchRequest creates a branch via the Git refs API.
message CreateBranchRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string ref = 4 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];  // "refs/heads/branch-name"
  string sha = 5 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 64];   // SHA to branch from
}

message CreateBranchResponse {
  GitReference reference = 1;
  RateLimitInfo rate_limit = 2;
}

// ============================================================================
// Commit Requests / Responses
// ============================================================================

message ListCommitsRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string owner = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string repo = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string sha = 4 [(spec.assert_max_length) = 256];     // branch name, tag, or SHA
  string path = 5 [(spec.assert_max_length) = 2048];   // filter by file path
  string author = 6 [(spec.assert_max_length) = 256];  // filter by author login or email
  string since = 7 [(spec.assert_max_length) = 64];    // ISO 8601
  string until = 8 [(spec.assert_max_length) = 64];    // ISO 8601
  int32 page = 9 [(spec.assert_ge) = 0];
  int32 per_page = 10 [(spec.assert_ge) = 0, (spec.assert_le) = 100];
}

message ListCommitsResponse {
  repeated Commit commits = 1 [(spec.assert_max_size) = 100];
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

// ============================================================================
// Search Requests / Responses
// ============================================================================

message SearchCodeRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string query = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 4096];
  string sort = 3 [(spec.assert_max_length) = 16];     // "" (best match) or "indexed"
  string order = 4 [(spec.assert_max_length) = 8];     // asc, desc
  int32 page = 5 [(spec.assert_ge) = 0];
  int32 per_page = 6 [(spec.assert_ge) = 0, (spec.assert_le) = 100];
}

message SearchCodeResponse {
  int32 total_count = 1 [(spec.assert_ge) = 0];
  bool incomplete_results = 2;
  repeated SearchCodeResult items = 3 [(spec.assert_max_size) = 100];
  RateLimitInfo rate_limit = 4;
}

// ============================================================================
// Service
// ============================================================================

service GitHubService {
  option (spec.service_grpc) = {name: "github", auth_entitled_users: true};

  // Generic fallback proxy for any GitHub REST API endpoint.
  // The service logs when this is used, signaling a typed RPC coverage gap.
  rpc Proxy(http.RawProxyRequest) returns (http.RawProxyResponse);

  // Repositories
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse);

  // Issues
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse);
  rpc GetIssue(GetIssueRequest) returns (GetIssueResponse);
  rpc CreateIssue(CreateIssueRequest) returns (CreateIssueResponse);
  rpc UpdateIssue(UpdateIssueRequest) returns (UpdateIssueResponse);
  rpc CreateIssueComment(CreateIssueCommentRequest) returns (CreateIssueCommentResponse);

  // Pull Requests
  rpc ListPullRequests(ListPullRequestsRequest) returns (ListPullRequestsResponse);
  rpc GetPullRequest(GetPullRequestRequest) returns (GetPullRequestResponse);
  rpc CreatePullRequest(CreatePullRequestRequest) returns (CreatePullRequestResponse);
  rpc MergePullRequest(MergePullRequestRequest) returns (MergePullRequestResponse);
  rpc ListPullRequestFiles(ListPullRequestFilesRequest) returns (ListPullRequestFilesResponse);

  // Content
  rpc GetContent(GetContentRequest) returns (GetContentResponse);
  rpc CreateOrUpdateFile(CreateOrUpdateFileRequest) returns (CreateOrUpdateFileResponse);

  // Branches
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
  rpc CreateBranch(CreateBranchRequest) returns (CreateBranchResponse);

  // Commits
  rpc ListCommits(ListCommitsRequest) returns (ListCommitsResponse);

  // Search
  rpc SearchCode(SearchCodeRequest) returns (SearchCodeResponse);
}

// ============================================================================
// Proxy Event — typed audit record emitted by the GitHub proxy
// ============================================================================

// ProxyEvent captures a single proxied GitHub API request/response pair.
// Emitted as a typed event for every API call, whether through a typed
// RPC or the generic proxy fallback.
message ProxyEvent {
  // Identity of the caller (sub claim from the bearer token).
  string subject = 1 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];

  // HTTP method of the proxied request.
  http.HttpMethod method = 2 [(spec.assert_enum_defined) = true];

  // API path of the proxied request (e.g., "/repos/owner/repo/issues").
  string path = 3 [(spec.assert_required) = true, (spec.assert_max_length) = 4096];

  // Owner and repo from the request, if applicable.
  string owner = 4 [(spec.assert_max_length) = 256];
  string repo = 5 [(spec.assert_max_length) = 256];

  // Whether the request used a typed RPC (true) or the generic proxy (false).
  bool typed_rpc = 6;

  // RPC method name (e.g., "GetRepository", "Proxy").
  string rpc_method = 7 [(spec.assert_max_length) = 128];

  // HTTP status code from the upstream provider.
  int32 upstream_status = 8 [(spec.assert_ge) = 100, (spec.assert_le) = 599];

  // Timing.
  int64 request_epoch_ms = 9 [(spec.assert_ge) = 0];
  int64 response_epoch_ms = 10 [(spec.assert_ge) = 0];
  int64 duration_ms = 11 [(spec.assert_ge) = 0];

  // Provider identity.
  string provider = 12 [(spec.default_string) = "github", (spec.assert_max_length) = 64];
}

// GithubConfigState is the state boundary for github service configuration.
// Auto-injected by tacplus from (spec.grpc_config) annotation.
message GithubConfigState {
  option (spec.service_state) = {name: "GithubConfigState", store: "kernel"};
  option (spec.state_consistency) = CONSISTENCY_CONVERGENT;

  // Fields 1-5 are reserved for tacplus framework use.

  github.Config config = 6 [
    (spec.consistency) = CONSISTENCY_CONVERGENT,
    (spec.persistence) = true
  ];
}

// ============================================================================
// Auto-generated State Service (tacplus)
// ============================================================================

service GithubConfigStateService {
	// Singleton: Config
	rpc GetConfig(google.protobuf.Empty) returns (Config);
	rpc SetConfig(Config) returns (Config);
	rpc WatchConfig(google.protobuf.Empty) returns (stream Config);
}

message MapEmpty {}


