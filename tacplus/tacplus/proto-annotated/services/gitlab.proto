  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
  string state = 3 [(spec.assert_max_length) = 16];      // opened, closed, merged, locked, all
  string sort = 4 [(spec.assert_max_length) = 16];       // asc, desc
  string order_by = 5 [(spec.assert_max_length) = 16];   // created_at, updated_at
  string source_branch = 6 [(spec.assert_max_length) = 256];
  string target_branch = 7 [(spec.assert_max_length) = 256];
  string search = 8 [(spec.assert_max_length) = 1024];
  repeated string labels = 9 [(spec.assert_max_size) = 32, (spec.assert_max_length) = 256];
  int32 page = 10 [(spec.assert_ge) = 0];
  int32 per_page = 11 [(spec.assert_ge) = 0, (spec.assert_le) = 100];
}

message ListMergeRequestsResponse {
  repeated MergeRequest merge_requests = 1 [(spec.assert_max_size) = 100];
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

message GetMergeRequestRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
  int32 merge_request_iid = 3 [(spec.assert_ge) = 1];
}

message GetMergeRequestResponse {
  MergeRequest merge_request = 1;
  RateLimitInfo rate_limit = 2;
}

message CreateMergeRequestRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
  string title = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 1024];
  string source_branch = 4 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string target_branch = 5 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 256];
  string description = 6 [(spec.assert_max_length) = 262144];
  repeated string labels = 7 [(spec.assert_max_size) = 32, (spec.assert_max_length) = 256];
  int32 assignee_id = 8 [(spec.assert_ge) = 0];
  repeated int32 reviewer_ids = 9 [(spec.assert_max_size) = 32];
  int32 milestone_id = 10 [(spec.assert_ge) = 0];
  bool remove_source_branch = 11;
  bool squash = 12;
}

message CreateMergeRequestResponse {
  MergeRequest merge_request = 1;
  RateLimitInfo rate_limit = 2;
}

message UpdateMergeRequestRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
  int32 merge_request_iid = 3 [(spec.assert_ge) = 1];
  string title = 4 [(spec.assert_max_length) = 1024];
  string description = 5 [(spec.assert_max_length) = 262144];
  string state_event = 6 [(spec.assert_max_length) = 16];  // "close", "reopen"
  repeated string labels = 7 [(spec.assert_max_size) = 32, (spec.assert_max_length) = 256];
  int32 assignee_id = 8 [(spec.assert_ge) = 0];
  repeated int32 reviewer_ids = 9 [(spec.assert_max_size) = 32];
  int32 milestone_id = 10 [(spec.assert_ge) = 0];
  bool remove_source_branch = 11;
  bool squash = 12;
  string target_branch = 13 [(spec.assert_max_length) = 256];
}

message UpdateMergeRequestResponse {
  MergeRequest merge_request = 1;
  RateLimitInfo rate_limit = 2;
}

message MergeMergeRequestRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
  int32 merge_request_iid = 3 [(spec.assert_ge) = 1];
  string merge_commit_message = 4 [(spec.assert_max_length) = 262144];
  string squash_commit_message = 5 [(spec.assert_max_length) = 262144];
  bool squash = 6;
  bool should_remove_source_branch = 7;
  bool merge_when_pipeline_succeeds = 8;
  string sha = 9 [(spec.assert_max_length) = 64];  // SHA head must match (prevents race)
}

message MergeMergeRequestResponse {
  MergeRequest merge_request = 1;
  RateLimitInfo rate_limit = 2;
}

message ListMergeRequestChangesRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
