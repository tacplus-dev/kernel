  string sort = 6 [(spec.assert_max_length) = 8];        // asc, desc
  string order_by = 7 [(spec.assert_max_length) = 16];   // id, status, ref, updated_at, user_id
  int32 page = 8 [(spec.assert_ge) = 0];
  int32 per_page = 9 [(spec.assert_ge) = 0, (spec.assert_le) = 100];
}

message ListPipelinesResponse {
  repeated Pipeline pipelines = 1 [(spec.assert_max_size) = 100];
