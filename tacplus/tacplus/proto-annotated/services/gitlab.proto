  RateLimitInfo rate_limit = 3;
}

message GetPipelineRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
  int64 pipeline_id = 3 [(spec.assert_ge) = 1];
}

message GetPipelineResponse {
  Pipeline pipeline = 1;
  RateLimitInfo rate_limit = 2;
