// Copyright (c) 2024 Second Star Cavalier, LLC.

// Package gitlab defines typed representations of the GitLab REST API (v4).
// The gitlab service proxies gRPC requests to the remote GitLab API,
// providing typed request/response handling for common operations and a
// generic fallback proxy for any API endpoint. Every proxied call emits
// a typed audit event via the accounting system.
//
// Design: typed RPCs cover the most common agent workflows (projects,
// merge requests, issues, pipelines, repository files, branches, search).
// The generic Proxy RPC handles any endpoint not yet typed. The service
// implementation logs when the generic fallback is used, signaling a
// coverage gap for future typed RPC addition.

syntax = "proto3";

package gitlab;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.services.gitlab";
option java_outer_classname = "Gitlab";

import "libs/http.proto";
import "libs/spec.proto";
import "google/protobuf/empty.proto";

option (spec.service) = {name: "gitlab", id: 24};

// API constants.
option (spec.string_const) = { name: "API_BASE_URL" value: "https://gitlab.com" };
option (spec.string_const) = { name: "API_PATH_PREFIX" value: "/api/v4" };
option (spec.string_const) = { name: "AUTH_HEADER" value: "PRIVATE-TOKEN" };
option (spec.string_const) = { name: "BEARER_AUTH_HEADER" value: "Authorization" };

// ============================================================================
// Config
// ============================================================================

message Config {
  option (spec.grpc_config) = {service_name: "gitlab", id: 24};
  // Fields 1-5 are reserved for tacplus framework use.

  // api_token is the API token for authenticating with the GitLab API.
  // Supports personal access tokens, project access tokens, group access
  // tokens, and OAuth tokens.
  string api_token = 6 [(spec.assert_required) = true];
}

// ============================================================================
// GitLab-Specific Metadata
// ============================================================================

message RateLimitInfo {
  int32 limit = 1 [(spec.assert_ge) = 0];
  int32 remaining = 2 [(spec.assert_ge) = 0];
  int32 observed = 3 [(spec.assert_ge) = 0];
  int64 reset = 4 [(spec.assert_ge) = 0];            // Unix epoch seconds
  string reset_time = 5 [(spec.assert_max_length) = 64];  // RFC 2616 human-readable
}

message PaginationInfo {
  int32 page = 1 [(spec.assert_ge) = 0];
  int32 per_page = 2 [(spec.assert_ge) = 0];
  int32 total = 3 [(spec.assert_ge) = 0];
  int32 total_pages = 4 [(spec.assert_ge) = 0];
  bool has_next_page = 5;
  string next_page_url = 6 [(spec.assert_max_length) = 2048];
}

// ============================================================================
// Resource Types
// ============================================================================

message User {
  int64 id = 1;
  string username = 2 [(spec.assert_max_length) = 256];
  string name = 3 [(spec.assert_max_length) = 512];
  string avatar_url = 4 [(spec.assert_max_length) = 2048];
  string web_url = 5 [(spec.assert_max_length) = 2048];
  string state = 6 [(spec.assert_max_length) = 16];  // "active", "blocked", "deactivated"
}

message Namespace {
  int64 id = 1;
  string name = 2 [(spec.assert_max_length) = 256];
  string path = 3 [(spec.assert_max_length) = 512];
  string kind = 4 [(spec.assert_max_length) = 16];  // "user", "group"
  string full_path = 5 [(spec.assert_max_length) = 1024];
  string web_url = 6 [(spec.assert_max_length) = 2048];
}

message Project {
  int64 id = 1;
  string name = 2 [(spec.assert_max_length) = 256];
  string name_with_namespace = 3 [(spec.assert_max_length) = 512];
  string path = 4 [(spec.assert_max_length) = 256];
  string path_with_namespace = 5 [(spec.assert_max_length) = 512];
  string description = 6 [(spec.assert_max_length) = 4096];
  string default_branch = 7 [(spec.assert_max_length) = 256];
  string visibility = 8 [(spec.assert_max_length) = 16];  // "private", "internal", "public"
  string web_url = 9 [(spec.assert_max_length) = 2048];
  string ssh_url_to_repo = 10 [(spec.assert_max_length) = 2048];
  string http_url_to_repo = 11 [(spec.assert_max_length) = 2048];
  Namespace namespace = 12;
  User owner = 13;
  int32 star_count = 14 [(spec.assert_ge) = 0];
  int32 forks_count = 15 [(spec.assert_ge) = 0];
  int32 open_issues_count = 16 [(spec.assert_ge) = 0];
  bool archived = 17;
  repeated string topics = 18 [(spec.assert_max_size) = 64];
  string created_at = 19 [(spec.assert_max_length) = 64];
  string last_activity_at = 20 [(spec.assert_max_length) = 64];
}

message Label {
  int64 id = 1;
  string name = 2 [(spec.assert_max_length) = 256];
  string color = 3 [(spec.assert_max_length) = 16];
  string description = 4 [(spec.assert_max_length) = 1024];
}

message Milestone {
  int64 id = 1;
  int32 iid = 2;
  string title = 3 [(spec.assert_max_length) = 256];
  string description = 4 [(spec.assert_max_length) = 4096];
  string state = 5 [(spec.assert_max_length) = 16];
  string due_date = 6 [(spec.assert_max_length) = 16];
  string web_url = 7 [(spec.assert_max_length) = 2048];
}

message Issue {
  int64 id = 1;
  int32 iid = 2;
  string title = 3 [(spec.assert_max_length) = 1024];
  string description = 4 [(spec.assert_max_length) = 262144];
  string state = 5 [(spec.assert_max_length) = 16];  // "opened", "closed"
  User author = 6;
  User assignee = 7;
  repeated User assignees = 8 [(spec.assert_max_size) = 32];
  repeated Label labels = 9 [(spec.assert_max_size) = 128];
  Milestone milestone = 10;
  string web_url = 11 [(spec.assert_max_length) = 2048];
  int32 user_notes_count = 12 [(spec.assert_ge) = 0];
  bool confidential = 13;
  string created_at = 14 [(spec.assert_max_length) = 64];
  string updated_at = 15 [(spec.assert_max_length) = 64];
  string closed_at = 16 [(spec.assert_max_length) = 64];
}

message MergeRequest {
  int64 id = 1;
  int32 iid = 2;
  string title = 3 [(spec.assert_max_length) = 1024];
  string description = 4 [(spec.assert_max_length) = 262144];
  string state = 5 [(spec.assert_max_length) = 16];  // "opened", "closed", "merged", "locked"
  User author = 6;
  User assignee = 7;
  repeated User assignees = 8 [(spec.assert_max_size) = 32];
  repeated User reviewers = 9 [(spec.assert_max_size) = 32];
  repeated Label labels = 10 [(spec.assert_max_size) = 128];
  string source_branch = 11 [(spec.assert_max_length) = 256];
  string target_branch = 12 [(spec.assert_max_length) = 256];
  string web_url = 13 [(spec.assert_max_length) = 2048];
  string merge_status = 14 [(spec.assert_max_length) = 32];   // "can_be_merged", "cannot_be_merged", etc.
  string sha = 15 [(spec.assert_max_length) = 64];            // HEAD SHA of source branch
  string merge_commit_sha = 16 [(spec.assert_max_length) = 64];
  bool has_conflicts = 17;
  bool draft = 18;
  int32 user_notes_count = 19 [(spec.assert_ge) = 0];
  int32 changes_count = 20 [(spec.assert_ge) = 0];
  string created_at = 21 [(spec.assert_max_length) = 64];
  string updated_at = 22 [(spec.assert_max_length) = 64];
  string merged_at = 23 [(spec.assert_max_length) = 64];
  User merged_by = 24;
  string detailed_merge_status = 25 [(spec.assert_max_length) = 64];
  Pipeline head_pipeline = 26;
}

message Note {
  int64 id = 1;
  string body = 2 [(spec.assert_max_length) = 262144];
  User author = 3;
  bool system = 4;        // true if auto-generated by GitLab
  bool resolvable = 5;
  bool resolved = 6;
  string noteable_type = 7 [(spec.assert_max_length) = 32];  // "Issue", "MergeRequest"
  string created_at = 8 [(spec.assert_max_length) = 64];
  string updated_at = 9 [(spec.assert_max_length) = 64];
}

message MergeRequestDiff {
  string old_path = 1 [(spec.assert_max_length) = 2048];
  string new_path = 2 [(spec.assert_max_length) = 2048];
  string a_mode = 3 [(spec.assert_max_length) = 8];
  string b_mode = 4 [(spec.assert_max_length) = 8];
  bool new_file = 5;
  bool renamed_file = 6;
  bool deleted_file = 7;
  string diff = 8 [(spec.assert_max_length) = 1048576];
}

message Pipeline {
  int64 id = 1;
  int32 iid = 2;
  string status = 3 [(spec.assert_max_length) = 32];  // created, waiting, pending, running, success, failed, canceled, skipped, manual, scheduled
  string ref = 4 [(spec.assert_max_length) = 256];
  string sha = 5 [(spec.assert_max_length) = 64];
  string source = 6 [(spec.assert_max_length) = 32];  // push, web, trigger, schedule, api, pipeline, etc.
  string web_url = 7 [(spec.assert_max_length) = 2048];
  User user = 8;
  string created_at = 9 [(spec.assert_max_length) = 64];
  string updated_at = 10 [(spec.assert_max_length) = 64];
  string started_at = 11 [(spec.assert_max_length) = 64];
  string finished_at = 12 [(spec.assert_max_length) = 64];
  int32 duration = 13 [(spec.assert_ge) = 0];         // seconds
  int32 queued_duration = 14 [(spec.assert_ge) = 0];  // seconds
}

message Job {
  int64 id = 1;
  string name = 2 [(spec.assert_max_length) = 256];
  string stage = 3 [(spec.assert_max_length) = 128];
  string status = 4 [(spec.assert_max_length) = 32];
  string ref = 5 [(spec.assert_max_length) = 256];
  string web_url = 6 [(spec.assert_max_length) = 2048];
  User user = 7;
  Pipeline pipeline = 8;
  int32 duration = 9 [(spec.assert_ge) = 0];
  int32 queued_duration = 10 [(spec.assert_ge) = 0];
  string created_at = 11 [(spec.assert_max_length) = 64];
  string started_at = 12 [(spec.assert_max_length) = 64];
  string finished_at = 13 [(spec.assert_max_length) = 64];
  string failure_reason = 14 [(spec.assert_max_length) = 128];
}

message Branch {
  string name = 1 [(spec.assert_max_length) = 256];
  bool merged = 2;
  bool protected = 3;
  bool default = 4;
  BranchCommit commit = 5;
}

message BranchCommit {
  string id = 1 [(spec.assert_max_length) = 64];      // SHA
  string short_id = 2 [(spec.assert_max_length) = 16];
  string title = 3 [(spec.assert_max_length) = 1024];
  string message = 4 [(spec.assert_max_length) = 262144];
  string author_name = 5 [(spec.assert_max_length) = 256];
  string author_email = 6 [(spec.assert_max_length) = 256];
  string authored_date = 7 [(spec.assert_max_length) = 64];
  string committed_date = 8 [(spec.assert_max_length) = 64];
  string web_url = 9 [(spec.assert_max_length) = 2048];
}

message RepositoryFile {
  string file_name = 1 [(spec.assert_max_length) = 512];
  string file_path = 2 [(spec.assert_max_length) = 2048];
  int64 size = 3 [(spec.assert_ge) = 0];
  string encoding = 4 [(spec.assert_max_length) = 16];    // "base64"
  string content = 5 [(spec.assert_max_length) = 10485760];
  string content_sha256 = 6 [(spec.assert_max_length) = 64];
  string ref = 7 [(spec.assert_max_length) = 256];
  string blob_id = 8 [(spec.assert_max_length) = 64];
  string commit_id = 9 [(spec.assert_max_length) = 64];
  string last_commit_id = 10 [(spec.assert_max_length) = 64];
}

message TreeEntry {
  string id = 1 [(spec.assert_max_length) = 64];       // SHA
  string name = 2 [(spec.assert_max_length) = 512];
  string type = 3 [(spec.assert_max_length) = 16];     // "blob", "tree"
  string path = 4 [(spec.assert_max_length) = 2048];
  string mode = 5 [(spec.assert_max_length) = 8];
}

message SearchBlobResult {
  string basename = 1 [(spec.assert_max_length) = 512];
  string data = 2 [(spec.assert_max_length) = 262144];
  string path = 3 [(spec.assert_max_length) = 2048];
  string filename = 4 [(spec.assert_max_length) = 512];
  string ref = 5 [(spec.assert_max_length) = 256];
  int64 startline = 6 [(spec.assert_ge) = 0];
  int64 project_id = 7;
}

// ============================================================================
// Project Requests / Responses
// ============================================================================

// GetProjectRequest fetches a project by ID or URL-encoded path.
message GetProjectRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  // project_id is the numeric ID or URL-encoded path (e.g., "my-group%2Fmy-project").
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
}

message GetProjectResponse {
  Project project = 1;
  RateLimitInfo rate_limit = 2;
}

// ============================================================================
// Issue Requests / Responses
// ============================================================================

message ListIssuesRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
  string state = 3 [(spec.assert_max_length) = 16];      // opened, closed, all
  string sort = 4 [(spec.assert_max_length) = 16];       // created_at, updated_at, priority, due_date, etc.
  string order_by = 5 [(spec.assert_max_length) = 16];   // asc, desc
  repeated string labels = 6 [(spec.assert_max_size) = 32, (spec.assert_max_length) = 256];
  string assignee_username = 7 [(spec.assert_max_length) = 256];
  string search = 8 [(spec.assert_max_length) = 1024];
  string created_after = 9 [(spec.assert_max_length) = 64];
  string updated_after = 10 [(spec.assert_max_length) = 64];
  int32 page = 11 [(spec.assert_ge) = 0];
  int32 per_page = 12 [(spec.assert_ge) = 0, (spec.assert_le) = 100];
}

message ListIssuesResponse {
  repeated Issue issues = 1 [(spec.assert_max_size) = 100];
  PaginationInfo pagination = 2;
  RateLimitInfo rate_limit = 3;
}

message GetIssueRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
  int32 issue_iid = 3 [(spec.assert_ge) = 1];
}

message GetIssueResponse {
  Issue issue = 1;
  RateLimitInfo rate_limit = 2;
}

message CreateIssueRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
  string title = 3 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 1024];
  string description = 4 [(spec.assert_max_length) = 262144];
  repeated string labels = 5 [(spec.assert_max_size) = 32, (spec.assert_max_length) = 256];
  int32 assignee_id = 6 [(spec.assert_ge) = 0];
  repeated int32 assignee_ids = 7 [(spec.assert_max_size) = 32];
  int32 milestone_id = 8 [(spec.assert_ge) = 0];
  bool confidential = 9;
}

message CreateIssueResponse {
  Issue issue = 1;
  RateLimitInfo rate_limit = 2;
}

message UpdateIssueRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
  int32 issue_iid = 3 [(spec.assert_ge) = 1];
  string title = 4 [(spec.assert_max_length) = 1024];
  string description = 5 [(spec.assert_max_length) = 262144];
  string state_event = 6 [(spec.assert_max_length) = 16];  // "close", "reopen"
  repeated string labels = 7 [(spec.assert_max_size) = 32, (spec.assert_max_length) = 256];
  repeated int32 assignee_ids = 8 [(spec.assert_max_size) = 32];
  int32 milestone_id = 9 [(spec.assert_ge) = 0];
  bool confidential = 10;
}

message UpdateIssueResponse {
  Issue issue = 1;
  RateLimitInfo rate_limit = 2;
}

message CreateIssueNoteRequest {
  string api_endpoint = 1 [(spec.assert_required) = true, (spec.assert_url) = URL_SCHEME_HTTPS, (spec.assert_max_length) = 2048];
  string project_id = 2 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 512];
  int32 issue_iid = 3 [(spec.assert_ge) = 1];
  string body = 4 [(spec.assert_required) = true, (spec.assert_min_length) = 1, (spec.assert_max_length) = 262144];
}

message CreateIssueNoteResponse {
  Note note = 1;
  RateLimitInfo rate_limit = 2;
}

