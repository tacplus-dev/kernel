  ASSIST_RESPONSE_TYPE_UNSPECIFIED = 0;
  // RESULT indicates the LLM successfully constructed the requested type.
  ASSIST_RESPONSE_TYPE_RESULT = 1;
  // REQUEST_ADDITIONAL_ACCESS indicates the LLM needs access to additional
  // tools to complete the request. The caller must approve or deny.
  ASSIST_RESPONSE_TYPE_REQUEST_ADDITIONAL_ACCESS = 2;
