// Package openai defines typed representations of the OpenAI Chat Completions API.
// The LLM proxy deserializes inbound requests and outbound responses into these
// types, forwards the raw HTTP/SSE to OpenAI, and emits a ProxyEvent
// capturing the full typed request/response pair for audit and observability.

syntax = "proto3";

package openai;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.common.openai";
option java_outer_classname = "Openai";

// API constants.

// ============================================================================
// Content Parts — polymorphic content within user messages
// ============================================================================

// ContentPart is a single part of a multi-modal user message.
message ContentPart {
  ContentPartType type = 1;

  // Text content (type = TEXT).
  string text = 2;

  // Image URL (type = IMAGE_URL).
  ImageUrl image_url = 3;
}

enum ContentPartType {
  CONTENT_PART_TYPE_UNSPECIFIED = 0;
  CONTENT_PART_TYPE_TEXT = 1;
  CONTENT_PART_TYPE_IMAGE_URL = 2;
}

// ImageUrl carries an image reference (URL or data URI).
message ImageUrl {
  // url is the image URL or base64 data URI ("data:image/png;base64,...").
  string url = 1;

  // detail controls image processing fidelity: "auto", "low", or "high".
  string detail = 2;
}

// ============================================================================
// Messages
// ============================================================================

enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;
  CHAT_ROLE_SYSTEM = 1;
  CHAT_ROLE_USER = 2;
  CHAT_ROLE_ASSISTANT = 3;
  CHAT_ROLE_TOOL = 4;
  CHAT_ROLE_DEVELOPER = 5;
}

// ChatMessage is a single turn in the conversation.
// Field presence depends on role:
//   system/developer: content (string)
//   user: content (string or content_parts)
//   assistant: content, tool_calls, refusal
//   tool: content, tool_call_id
message ChatMessage {
  ChatRole role = 1;

  // content as a simple string (all roles).
  string content = 2;

  // content as multi-modal parts (user messages with images).
  repeated ContentPart content_parts = 3;

  // name is an optional participant name for multi-agent conversations.
  string name = 4;

  // tool_calls requested by the assistant.
  repeated ToolCall tool_calls = 5;

  // tool_call_id links a tool message to its originating tool_call.
  string tool_call_id = 6;

  // refusal is the assistant's refusal message (content filtering).
  string refusal = 7;
}

// ============================================================================
// Tool Calls — model-generated invocations
// ============================================================================

// ToolCall is a tool invocation generated by the model.
message ToolCall {
  string id = 1;
  string type = 2;  // always "function"
  FunctionCall function = 3;
}

// FunctionCall is the function name and JSON-encoded arguments.
message FunctionCall {
  string name = 1;
  string arguments = 2;  // JSON string
}

// ============================================================================
// Tool Definitions
// ============================================================================

// ToolDefinition describes a tool available to the model.
message ToolDefinition {
  string type = 1;  // "function"
  FunctionDefinition function = 2;
}

// FunctionDefinition describes a callable function.
message FunctionDefinition {
  string name = 1;
  string description = 2;

  // parameters is the JSON Schema for the function's parameters.
  string parameters = 3;

  // strict enables strict schema adherence (structured outputs).
  bool strict = 4;
}

// ToolChoice controls how the model selects tools.
message ToolChoice {
  // type controls tool selection: "auto", "none", "required", or "function".
  // When type = "function", the function field specifies which function.
  string type = 1;

  // function forces a specific function (when type = "function").
  ToolChoiceFunction function = 2;
}

// ToolChoiceFunction names a specific function to call.
message ToolChoiceFunction {
  string name = 1;
}

// ============================================================================
// Response Format (Structured Outputs)
// ============================================================================

// ResponseFormat controls the output structure.
message ResponseFormat {
  // type is "text", "json_object", or "json_schema".
  string type = 1;

  // json_schema defines the output schema (when type = "json_schema").
  JsonSchemaFormat json_schema = 2;
}

// JsonSchemaFormat defines a JSON Schema for structured output.
message JsonSchemaFormat {
  string name = 1;
  string description = 2;

  // schema is the JSON Schema as a JSON string.
  string schema = 3;

  // strict enables exact schema matching.
  bool strict = 4;
}

// ============================================================================
// Stream Options
// ============================================================================

// StreamOptions configures streaming behavior.
message StreamOptions {
  // include_usage returns token usage in the final streamed chunk.
  bool include_usage = 1;
}

// ============================================================================
// Request
// ============================================================================

// CreateChatCompletionRequest is the request body for POST /v1/chat/completions.
message CreateChatCompletionRequest {
  string model = 1;
  repeated ChatMessage messages = 2;

  // Generation limits.
  int32 max_completion_tokens = 3;

  // Sampling parameters.
  float temperature = 4;
  float top_p = 5;
  float frequency_penalty = 6;
  float presence_penalty = 7;

  // Number of completions to generate.
  int32 n = 8;

  // Streaming.
  bool stream = 9;
  StreamOptions stream_options = 10;

  // Stop sequences.
  repeated string stop = 11;

  // Tool configuration.
  repeated ToolDefinition tools = 12;
  ToolChoice tool_choice = 13;
  bool parallel_tool_calls = 14;

  // Output structure.
  ResponseFormat response_format = 15;

  // Reproducibility.
  int64 seed = 16;

  // Log probabilities.
  bool logprobs = 17;
  int32 top_logprobs = 18;

  // Reasoning effort for o-series models: "low", "medium", "high".
  string reasoning_effort = 19;

  // End-user identifier (opaque, not PII).
  string user = 20;

  // Token bias: maps token IDs to bias values (-100 to 100).
  // JSON-encoded as a map of string token IDs to floats.
  string logit_bias = 21;

  // Service tier: "auto" or "default".
  string service_tier = 22;
}

// ============================================================================
// Response
// ============================================================================

// CreateChatCompletionResponse is the response from POST /v1/chat/completions.
message CreateChatCompletionResponse {
  string id = 1;
  string object = 2;  // "chat.completion"
  int64 created = 3;            // unix timestamp
  string model = 4;
  repeated Choice choices = 5;
  Usage usage = 6;
  string system_fingerprint = 7;
  string service_tier = 8;
}

// Choice is a single completion in the response.
message Choice {
  int32 index = 1;
  ChatMessage message = 2;
  FinishReason finish_reason = 3;
  LogprobsResult logprobs = 4;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;
  FINISH_REASON_LENGTH = 2;
  FINISH_REASON_TOOL_CALLS = 3;
  FINISH_REASON_CONTENT_FILTER = 4;
}

// Usage reports token consumption.
message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;

  // Detailed breakdown (when available).
  UsageDetails prompt_tokens_details = 4;
  UsageDetails completion_tokens_details = 5;
}

// UsageDetails provides a breakdown of token consumption.
message UsageDetails {
  int32 cached_tokens = 1;
  int32 reasoning_tokens = 2;
  int32 audio_tokens = 3;
  int32 accepted_prediction_tokens = 4;
  int32 rejected_prediction_tokens = 5;
}

// ============================================================================
// Log Probabilities
// ============================================================================

// LogprobsResult contains log probability data for the response.
message LogprobsResult {
  repeated TokenLogprob content = 1;
  repeated TokenLogprob refusal = 2;
}

// TokenLogprob is the log probability of a single token.
message TokenLogprob {
  string token = 1;
  float logprob = 2;
  repeated int32 bytes = 3;  // UTF-8 bytes
  repeated TopLogprob top_logprobs = 4;
}

// TopLogprob is a candidate token and its log probability.
message TopLogprob {
  string token = 1;
  float logprob = 2;
  repeated int32 bytes = 3;
}

// ============================================================================
// Streaming
// ============================================================================

// ChatCompletionChunk is a single SSE event during streaming.
message ChatCompletionChunk {
  string id = 1;
  string object = 2;  // "chat.completion.chunk"
  int64 created = 3;
  string model = 4;
  repeated ChunkChoice choices = 5;
  Usage usage = 6;                                      // final chunk only
  string system_fingerprint = 7;
  string service_tier = 8;
}

// ChunkChoice is a single choice delta in a streaming chunk.
message ChunkChoice {
  int32 index = 1;
  ChunkDelta delta = 2;
  FinishReason finish_reason = 3;
  LogprobsResult logprobs = 4;
}

// ChunkDelta carries incremental message content in a streaming chunk.
message ChunkDelta {
  ChatRole role = 1;
  string content = 2;
  repeated ToolCall tool_calls = 3;
  string refusal = 4;
}

// ============================================================================
// Error
// ============================================================================

// ErrorResponse is the error envelope returned by the API.
message ErrorResponse {
  ErrorDetail error = 1;
}

message ErrorDetail {
  string message = 1;
  string type = 2;
  string param = 3;
  string code = 4;
}

// ============================================================================
// Proxy Event — typed audit record emitted by the LLM proxy
// ============================================================================

// ProxyEvent captures a single proxied LLM request/response pair.
// Emitted as a typed event by the LLM proxy for every API call.
message ProxyEvent {
  // Identity of the caller (sub claim from the bearer token).
  string subject = 1;

  // Request as received by the proxy (before API key injection).
  CreateChatCompletionRequest request = 2;

  // Response from the provider. For streaming requests, this is
  // assembled from the final chunk (accumulated content + usage).
  CreateChatCompletionResponse response = 3;

  // Error from the provider, if the request failed.
  ErrorResponse error = 4;

  // Timing.
  int64 request_epoch_ms = 5;
  int64 response_epoch_ms = 6;
  int64 duration_ms = 7;

  // Whether the request used streaming.
  bool streamed = 8;

  // HTTP status code from the upstream provider.
  int32 upstream_status = 9;

  // Provider identity.
  string provider = 10;
}
