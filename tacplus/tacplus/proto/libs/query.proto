// Collection Query Support
// These types define the query language for statedb collection boundaries.
// They are re-emitted inline by the code generators into generated proto files.

syntax = "proto3";

package query;
option java_package = "com.gitlab.secondstarcavalier.controlplane.services.kernel.tacplus.types.libs.query";

enum ComparisonOp {
  COMPARISON_OP_UNSPECIFIED = 0;
  COMPARISON_OP_EQ = 1;           // =
  COMPARISON_OP_NE = 2;           // !=
  COMPARISON_OP_GT = 3;           // >
  COMPARISON_OP_GE = 4;           // >=
  COMPARISON_OP_LT = 5;           // <
  COMPARISON_OP_LE = 6;           // <=
  COMPARISON_OP_IN = 7;           // IN (...)
  COMPARISON_OP_NOT_IN = 8;       // NOT IN (...)
  COMPARISON_OP_LIKE = 9;         // LIKE pattern
  COMPARISON_OP_IS_NULL = 10;     // IS NULL
  COMPARISON_OP_IS_NOT_NULL = 11; // IS NOT NULL
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}

enum LogicalOp {
  LOGICAL_OP_UNSPECIFIED = 0;  // default: AND
  LOGICAL_OP_AND = 1;
  LOGICAL_OP_OR = 2;
}

message QueryValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
  }
}

message Predicate {
  string field_name = 1;          // proto field name (snake_case)
  ComparisonOp op = 2;
  QueryValue value = 3;           // for single-value ops (EQ, NE, GT, etc.)
  repeated QueryValue values = 4; // for IN, NOT_IN
}

message PredicateGroup {
  LogicalOp op = 1;               // how predicates combine (default: AND)
  repeated Predicate predicates = 2;
  repeated PredicateGroup groups = 3; // nested: (A AND B) OR (C AND D)
}

message SortField {
  string field_name = 1;
  SortDirection direction = 2;
}

message CollectionQuery {
  PredicateGroup where = 1;       // filter predicates (empty = match all)
  repeated SortField order_by = 2;
  int32 limit = 3;                // 0 = no limit
  int32 offset = 4;               // 0 = no offset
}

// ============================================================================
// Generated Proto Registry IDs
// Auto-injected by tacplus for shared type/RPC identifiers.
// ============================================================================
enum TypeID {
  TYPE_ID_UNSPECIFIED = 0;
  TYPE_ID_QUERY_VALUE = 1;
  TYPE_ID_PREDICATE = 2;
  TYPE_ID_PREDICATE_GROUP = 3;
  TYPE_ID_SORT_FIELD = 4;
  TYPE_ID_COLLECTION_QUERY = 5;
}
